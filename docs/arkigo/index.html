  const meta = make('div', 'detail-meta');
  meta.append(typeMark(object.type), make('span', '', types[object.type] ?? '步骤'));
  if (object.status) meta.append(statusMark(object.status, statuses, 'design-status'));
  if (object.origin) meta.append(make('span', 'muted', origins[object.origin]));
  const title = make('h2', '', inlinePlain(object.title, ctx));
  title.id = 'detail-title';
  title.tabIndex = -1;
  heading.append(meta, iconButton('close', '关闭详情', close), title);
  if (object.type !== 'step' && object.summary) heading.append(make('p', '', object.summary));
  const actions = make('div', 'detail-actions');
  if (ctx.canEnter(address)) {
    actions.append(button(object.type === 'flow' ? '查看流程' : '进入模块', () => ctx.enter(address), 'tool primary'));
  }
  if (object.type !== 'step') {
    actions.append(button('写批注', () => editDecision(ctx, object, 'comment'), 'tool detail-comment'));
  }
  if (actions.children.length) heading.append(actions);
  const content = make('div', 'detail-content');
  appendObjectContent(content, object, ctx);
  appendChildren(content, object, ctx);
  const related = ctx.design.relations.filter(({ from, to }) => from === address || to === address);
  if (related.length) content.append(detailSection('相关关系', relationRows(ctx, related, address)));
  appendEvidence(content, object, ctx);
  content.append(make('code', 'detail-id', object.id));
  byId('detail').replaceChildren(heading, content);
  byId('detail').scrollTop = 0;
  return title;
}

function appendObjectContent(content, object, ctx) {
  for (const key of bodyFields[object.type]) {
    const value = object.body[key];
    if (key !== 'chosen' && (value == null || Array.isArray(value) && !value.length)) continue;
    content.append(detailSection(fieldLabels[key], bodyContent(key, value, object, ctx), key));
  }
  for (const note of object.notes ?? []) content.append(renderNote(note, ctx));
}

// The details of a block are its document, so they also say what the block contains.
function appendChildren(content, object, ctx) {
  for (const [type, group] of groupBy(ctx.index.children.get(object.id) ?? [], (child) => child.type)) {
    const list = make('ul', 'child-list');
    for (const child of group) {
      const row = make('li');
      row.append(objectLink(ctx, child.id));
      if (child.summary) row.append(make('span', 'relation-note', inlinePlain(child.summary, ctx)));
      list.append(row);
    }
    const section = detailSection(types[type], list, 'children');
    section.firstChild.append(make('span', 'count', group.length));
    content.append(section);
  }
}

function appendEvidence(content, object, ctx) {
  const implementation = implementationState(object, ctx.evidence);
  if (implementation) {
    const body = make('div', 'implementation-detail');
    body.append(statusMark(implementation, implementations, 'implementation-status'));
    if (object.implementation?.note) body.append(rich(make('p'), object.implementation.note, ctx));
    if (object.implementation?.evidence?.length) {
      body.append(evidenceRows(ctx, object, object.implementation.evidence, 'implementation'));
    }
    content.append(detailSection(fieldLabels.implementation, body));
  }
  if (object.type === 'acceptance') {
    const verification = object.verification;
    const body = make('div');
    body.append(make('p', 'muted', { passed: '通过', failed: '未通过' }[verification?.status] ?? '未验证'));
    if (verification?.note) body.append(rich(make('p'), verification.note, ctx));
    if (verification?.evidence?.length) body.append(evidenceRows(ctx, object, verification.evidence, 'verification'));
    content.append(detailSection(fieldLabels.verification, body));
  }
  if (object.sources?.length) {
    content.append(detailSection(fieldLabels.sources, evidenceRows(ctx, object, object.sources, 'source')));
  }
}

function inlinePlain(value, ctx) {
  const flatten = (tokens) => tokens.map((token) => token.children ? flatten(token.children) :
    token.value ?? ctx.index.get(token.target)?.title ?? token.target).join('');
  return flatten(parseInline(value));
}


function createDirectory(ctx) {
  const dialog = byId('browse');
  const body = byId('browse-body');
  const title = byId('browse-title');
  const close = byId('browse-close');
  let mode;
  const expanded = new Set([ctx.index.root.id]);
  const searchIndex = buildSearchIndex(ctx.index, ctx.evidence);
  close.append(icon('close'));
  close.setAttribute('aria-label', '关闭浏览面板');
  close.addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', (event) => {
    if (event.target === dialog) dialog.close();
  });
  function open(name, heading, content, focus = close) {
    mode = name;
    dialog.dataset.panel = name;
    title.textContent = heading;
    body.replaceChildren(content);
    body.scrollTop = 0;
    if (!dialog.open) dialog.showModal();
    focus.focus();
  }

  // One panel finds things: the project's contents as a tree, and the matches once something is typed.
  function search() {
    const contents = make('div', 'search-contents');
    const field = make('div', 'search-field');
    const input = make('input');
    input.type = 'search';
    input.placeholder = '输入标题、内容或依据';
    input.setAttribute('aria-label', '搜索全部对象');
    const clear = iconButton('close', '清除搜索', () => {
      input.value = '';
      render();
      input.focus();
    });
    clear.classList.add('search-clear');
    field.append(icon('search'), input, clear);
    const list = make('div', 'search-results');
    const count = make('output', 'muted');
    count.setAttribute('aria-live', 'polite');
    const contentsTree = make('div', 'search-directory');
    // The pages without an entry of their own are found here as well.
    const pages = make('div', 'browse-pages');
    for (const [mode, label, glyph] of [
      ['inventory', '按类型列出全部', 'inventory'], ['progress', '实现情况', 'progress'], ['changes', '最近变更', 'reset']
    ]) {
      const page = button(label, () => ctx.navigate(mode, ctx.selection() ?? ctx.viewId), 'tool');
      page.dataset.mode = mode;
      page.prepend(icon(glyph));
      pages.append(page);
    }
    contentsTree.append(tree(), pages);
    const render = () => {
      const typed = Boolean(input.value.trim());
      const entries = searchDesign(searchIndex, input.value);
      count.textContent = typed ? entries.length + ' 个结果' : '';
      contentsTree.hidden = typed;
      list.replaceChildren();
      for (const { object, path } of entries) {
        const link = objectLink(ctx, object.id, undefined, 'search-result', true);
        const labels = make('span');
        labels.append(make('strong', '', object.title),
          make('small', 'muted', path.map((item) => item.title).join(' / ')));
        link.replaceChildren(typeMark(object.type), labels, icon('right'));
        list.append(link);
      }
    };
    input.addEventListener('input', render);
    input.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        (list.querySelector('a') ?? contentsTree.querySelector('a'))?.focus();
      }
      if (event.key === 'Enter') list.querySelector('a')?.click();
    });
    contents.append(field, count, list, contentsTree);
    open('search', '查找', contents, input);
  }

  function tree() {
    const list = make('ul', 'tree-list');
    for (const object of ctx.index.pathTo(ctx.selection() ?? ctx.index.root.id).slice(0, -1)) {
      expanded.add(object.id);
    }
    function branch(object) {
      const item = make('li');
      const row = make('div', 'tree-row');
      const children = ctx.index.children.get(object.id) ?? [];
      const sub = make('ul', 'tree-list');
      if (children.length) {
        let populated = false;
        const toggle = iconButton('right', '展开 ' + object.title, () => {
          if (expanded.has(object.id)) expanded.delete(object.id);
          else expanded.add(object.id);
          sync();
        });
        function sync() {
          const visible = expanded.has(object.id);
          toggle.replaceChildren(icon(visible ? 'down' : 'right'));
          const label = (visible ? '折叠 ' : '展开 ') + object.title;
          toggle.setAttribute('aria-label', label);
          toggle.title = label;
          toggle.setAttribute('aria-expanded', String(visible));
          sub.hidden = !visible;
          if (visible && !populated) {
            sub.append(...children.map(branch));
            populated = true;
          }
        }
        sync();
        row.append(toggle);
      } else row.append(make('span', 'tree-indent'));
      const link = objectLink(ctx, object.id, undefined, 'tree-object', true);
      link.prepend(typeMark(object.type));
      if (object.id === ctx.selection()) link.setAttribute('aria-current', 'true');
      row.append(link, statusMark(object.status, statuses, 'design-status'));
      const state = implementationState(object, ctx.evidence);
      if (state) row.append(statusMark(state, implementations, 'implementation-status'));
      item.append(row);
      if (children.length) item.append(sub);
      return item;
    }
    list.append(branch(ctx.index.root));
    return list;
  }

  function relations(title, entries) {
    open('relations', title, relationRows(ctx, entries));
  }
  return {
    search, relations, open,
    close: () => { if (dialog.open) dialog.close(); },
    active: () => dialog.open ? mode : null
  };
}


function graphCard(ctx, card, data, marks) {
  const element = make('button', 'graph-card');
  element.type = 'button';
  element.dataset.id = data.id;
  element.dataset.type = data.type;
  element.dataset.enterable = String(ctx.canEnter(data.id));
  element.setAttribute('aria-pressed', 'false');
  element.title = inlinePlain(data.title, ctx) + (data.summary ? '\n' + data.summary : '');
  cssBox(element, card);
  const head = make('span', 'card-meta');
  const kind = make('span', 'card-kind');
  kind.append(typeMark(data.type), textNode(data.actor ? ctx.index.get(data.actor).title : types[data.type] ?? '步骤'));
  head.append(kind);
  const implementation = implementationState(data, ctx.evidence);
  if (data.phase) head.append(make('span', 'step-phase', data.phase));
  else if (implementation) head.append(statusMark(implementation, implementations, 'implementation-status'));
  const flags = make('span', 'card-flags');
  for (const [type, relations] of Object.entries(marks ?? {})) {
    const label = annotationTypes[type];
    const mark = make('span', 'card-count');
    mark.title = types[label] + ' ' + relations.length;
    mark.append(icon(label), textNode(String(relations.length)));
    flags.append(mark);
  }
  if (data.failure) {
    const mark = make('span', 'card-count failure');
    mark.append(icon('warning'), textNode('失败处理'));
    flags.append(mark);
  }
  const changes = ctx.mode === 'map' && ctx.marksFor(card.id);
  if (changes?.size) {
    const label = [...changes].map((op) => changeLabels[op]).join('、');
    const mark = make('span', 'card-change', '变更');
    mark.title = label;
    mark.setAttribute('aria-label', label);
    flags.append(mark);
  }
  if (ctx.canEnter(data.id)) flags.append(icon('right'));
  element.append(head, make('strong', 'card-title', inlinePlain(data.title, ctx)),
    make('span', 'card-summary', inlinePlain(data.summary, ctx)), flags);
  element.addEventListener('click', (event) => {
    if (ctx.camera.consumeClick(event)) return;
    const enterable = ctx.canEnter(data.id);
    if (enterable && event.detail === 0 && ctx.selection() === data.id) ctx.enter(data.id);
    // Beside a wide map the details open at once. On a narrow screen they would cover the map, so a card that
    // can be entered is only selected there and the bar below offers its details and its inside.
    else ctx.select(data.id, !enterable || ctx.direction !== 'vertical');
  });
  element.addEventListener('dblclick', () => {
    if (ctx.canEnter(data.id)) ctx.enter(data.id);
  });
  element.addEventListener('focus', () => ctx.camera.reveal(card));
  return element;
}

function renderGraph(ctx, plan, records, annotations = new Map(), draggable = false) {
  const world = byId('world');
  const cardElements = new Map();
  const visible = new Map(plan.cards.map((card) => [card.id, card]));
  const vertical = plan.direction === 'vertical';
  const suffix = 'graph-arrow';
  const routes = svgElement('svg', { class: 'graph-edges', width: 1, height: 1, 'aria-hidden': true });
  const arrow = svgElement('marker', {
    id: suffix, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse'
  });
  arrow.append(svgElement('path', { d: 'M0 0l10 5-10 5z', class: 'arrow-tip' }));
  const defs = svgElement('defs', {});
  defs.append(arrow);
  routes.append(defs);
  const paths = svgElement('g', {});
  routes.append(paths);
  const labels = make('div', 'edge-labels');
  for (const zone of plan.zones) {
    const box = make('div', 'graph-zone');
    cssBox(box, zone);
    if (zone.height > plan.cards[0].height) box.append(make('span', '', types[zone.group] ?? zone.group));
    world.append(box);
  }
  world.append(routes, labels);
  for (const card of plan.cards) {
    const data = records.get(card.id);
    const element = graphCard(ctx, card, data, annotations.get(card.id));
    if (draggable) element.dataset.draggable = card.id;
    cardElements.set(data.id, { card, element });
    world.append(element);
  }
  function drawEdges(scale = 1) {
    paths.replaceChildren();
    labels.replaceChildren();
    const occupied = [];
    const ports = new Map();
    const used = new Map();
    // Lines drawn by default claim their label positions first.
    for (const edge of [...plan.edges].sort((a, b) => Number(a.main === false) - Number(b.main === false))) {
      const from = visible.get(edge.from);
      const to = visible.get(edge.to);
      // On a map every line of a card leaves from its own place, so lines that share a corridor stay apart.
      const pair = edge.from + '/' + edge.to;
      const lane = edge.relations ? Math.max(used.get(edge.from) ?? 0, used.get(edge.to) ?? 0) : ports.get(pair) ?? 0;
      ports.set(pair, lane + 1);
      used.set(edge.from, lane + 1);
      used.set(edge.to, lane + 1);
      const points = routeConnection(from, to, plan.cards, vertical, edge.back,
        (lane % 2 ? 1 : -1) * Math.min(edge.relations ? 44 : 28, Math.ceil(lane / 2) * (edge.relations ? 11 : 8)));
      if (!points) continue;
      const ends = { 'data-from': records.get(edge.from).id, 'data-to': records.get(edge.to).id };
      const kind = (edge.back ? ' back-edge' : '') + (edge.main === false ? ' minor-edge' : '');
      paths.append(svgElement('path', {
        class: 'graph-edge' + kind, ...ends, d: roundedPath(points),
        'marker-end': 'url(#' + suffix + ')', ...(edge.mutual && { 'marker-start': 'url(#' + suffix + ')' })
      }));
      const name = relationNames[edge.type];
      const exactLabel = edge.count === 1 ? edge.relations[0].label ?? edge.relations[0].when : undefined;
      const label = edge.when ?? exactLabel ?? name;
      const title = label ? inlinePlain(label, ctx) : '';
      if (!title) continue;
      const caption = title + (edge.count > 1 ? ' ×' + edge.count : '');
      const between = () => inlinePlain(records.get(edge.from).title, ctx) + ' 与 ' +
        inlinePlain(records.get(edge.to).title, ctx);
      const tag = edge.relations
        ? button(undefined, () => ctx.directory.relations(between() + ' · ' + edge.count + ' 条关系', edge.relations),
          'edge-label' + kind)
        : make('span', 'edge-label' + kind);
      tag.append(make('span', '', caption));
      tag.title = caption;
      tag.dataset.from = ends['data-from'];
      tag.dataset.to = ends['data-to'];
      const textWidth = [...caption].reduce((sum, char) => sum + (char.charCodeAt(0) > 255 ? 12 : 7), 0);
      const separate = largeTargets.matches && Boolean(edge.relations);
      const target = separate ? Math.ceil(44 / scale) : 0;
      const width = Math.max(target, Math.min(190, 14 + textWidth));
      const height = Math.max(target, 23);
      let position = placeConnectionLabel(
        points, width, height, plan.cards, occupied, plan.bounds, vertical, separate
      );
      // A label too long for the gap between two cards is cut to the gap; its title keeps the full text.
      const blocking = plan.cards.filter((card) => overlaps(card, position));
      if (blocking.length) {
        const middle = position.x + position.width / 2;
        const before = blocking.filter((card) => card.x + card.width / 2 < middle);
        const left = Math.max(position.x, ...before.map((card) => card.x + card.width + 4));
        const right = Math.min(position.x + position.width,
          ...blocking.filter((card) => !before.includes(card)).map((card) => card.x - 4));
        if (right - left >= Math.max(target, 40)) position = { ...position, x: left, width: right - left };
      }
      cssBox(tag, position);
      occupied.push(position);
      labels.append(tag);
    }
  }
  drawEdges();
  return { ...plan, cardsByAddress: cardElements, drawEdges, draggable };
}

function showSceneEmpty(title, content) {
  const empty = make('div', 'empty-scene');
  empty.append(emptyIllustration(), make('h2', '', title));
  if (content) empty.append(content);
  byId('view-content').hidden = false;
  byId('view-content').append(empty);
}


const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
const transform = ({ x, y, k }) => 'translate(' + x + 'px,' + y + 'px) scale(' + k + ')';

function createCamera(ctx) {
  const viewport = byId('viewport');
  const world = byId('world');
  const touches = new Map();
  const dimensions = () => ({ width: viewport.clientWidth, height: viewport.clientHeight });
  let value = { x: 0, y: 0, k: 1 };
  let home = 1;
  let scene = null;
  let gesture = null;
  let pinch;
  let cancelTransition;
  let suppressed = 0;
  let locked = 0;
  let wheeling = { last: 0 };
  let wheelUsed = false;
  let drawFrame = 0;
  let edgeScale = 1;

  const worldPoint = (event) => {
    const rect = viewport.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  };
  const center = (card) => ({ x: card.x + card.width / 2, y: card.y + card.height / 2 });
  const screen = ({ x, y }) => ({ x: x * value.k + value.x, y: y * value.k + value.y });

  function apply() {
    world.style.transform = transform(value);
    byId('scale').textContent = Math.round(value.k * 100) + '%';
    if (largeTargets.matches && edgeScale !== value.k) {
      edgeScale = value.k;
      requestEdges();
    }
  }

  // The whole map. With `readable` a map too large for that opens at a size its cards can still be read at,
  // from its top; the fit control then shows all of it.
  function fit(readable = false) {
    const { width, height } = dimensions();
    const box = scene?.bounds;
    if (!box?.width) return { x: 0, y: 0, k: 1 };
    const vertical = scene.direction === 'vertical';
    const pad = vertical ? 18 : 28;
    const ratio = Math.min((width - 2 * pad) / box.width, (height - 2 * pad) / box.height, 1);
    const k = vertical ? 1 : clamp(ratio, readable ? .7 : .14, 1);
    return {
      k,
      x: Math.max(pad, (width - box.width * k) / 2) - box.x * k,
      y: (vertical ? 15 : Math.max(pad, (height - box.height * k) / 2)) - box.y * k
    };
  }

  function setScene(next, previous) {
    scene = next;
    edgeScale = 1;
    const initial = fit(true);
    home = initial.k;
    const size = dimensions();
    value = previous ? {
      k: previous.k, x: previous.x + (size.width - previous.width) / 2,
      y: previous.y + (size.height - previous.height) / 2
    } : initial;
    apply();
  }

  function reveal(card, centered = false) {
    if (!card) return;
    const { width, height } = dimensions();
    const p = screen(center(card));
    const horizontal = Math.min(card.width * value.k / 2 + 12, width / 2);
    const vertical = Math.min(card.height * value.k / 2 + 12, height / 2);
    value.x += (centered ? width / 2 : clamp(p.x, horizontal, width - horizontal)) - p.x;
    value.y += (centered ? height / 2 : clamp(p.y, vertical, height - vertical)) - p.y;
    apply();
  }

  function stopTransition() {
    cancelTransition?.();
  }

  function snapshot() {
    stopTransition();
    if (reducedMotion.matches || document.documentElement.dataset.input === 'keyboard' || !scene?.cards.length) {
      return null;
    }
    const clone = world.cloneNode(true);
    clone.removeAttribute('id');
    clone.classList.add('scene-ghost');
    for (const child of clone.querySelectorAll('[id]')) child.removeAttribute('id');
    clone.setAttribute('aria-hidden', 'true');
    clone.inert = true;
    return clone;
  }

  function animateLevel(clone, oldScene, owner, parent, entering) {
    locked = performance.now() + 260;
    if (!clone || !owner || !scene?.cards.length) return;
    const box = entering ? scene.bounds : oldScene.bounds;
    const k = parent.k * Math.min((owner.width - 12) / box.width, (owner.height - 12) / box.height);
    const inside = {
      k,
      x: parent.x + center(owner).x * parent.k - (box.x + box.width / 2) * k,
      y: parent.y + center(owner).y * parent.k - (box.y + box.height / 2) * k
    };
    viewport.append(clone);
    const timing = { duration: 230, easing: 'cubic-bezier(.23,1,.32,1)', fill: 'both' };
    const animations = entering
      ? [world.animate([{ transform: transform(inside), opacity: .15 }, { opacity: 1 }], timing),
        clone.animate([{ opacity: 1 }, { opacity: 0 }], timing)]
      : [clone.animate([{ opacity: 1 }, { transform: transform(inside), opacity: 0 }], timing),
        world.animate([{ opacity: .18 }, { opacity: 1 }], timing)];
    const done = () => {
      if (cancelTransition !== done) return;
      cancelTransition = null;
      clone.remove();
      for (const animation of animations) animation.cancel();
    };
    cancelTransition = done;
    Promise.allSettled(animations.map((animation) => animation.finished)).then(done);
  }

  function zoom(factor, anchor, beforeGesture) {
    if (!scene || cancelTransition || gesture?.card) return false;
    const selected = scene.cardsByAddress.get(ctx.selection());
    const { width, height } = dimensions();
    const before = save();
    const point = anchor ?? (selected && factor > 1 ? screen(center(selected.card)) : { x: width / 2, y: height / 2 });
    const k = clamp(value.k * factor, .14, 12);
    const ratio = k / value.k;
    value = { k, x: point.x - (point.x - value.x) * ratio, y: point.y - (point.y - value.y) * ratio };
    if (!anchor && selected && factor > 1) reveal(selected.card);
    else apply();
    if (performance.now() < locked) return false;
    if (factor < 1 && k <= home * .62) return ctx.back(true);
    if (!selected || factor <= 1 || !ctx.canEnter(ctx.selection())) return false;
    const card = selected.card;
    const a = screen(card);
    const b = screen({ x: card.x + card.width, y: card.y + card.height });
    const w = b.x - a.x;
    const h = b.y - a.y;
    const visible = Math.max(0, Math.min(width, b.x) - Math.max(0, a.x)) *
      Math.max(0, Math.min(height, b.y) - Math.max(0, a.y));
    if (Math.max(w / width, h / height) < .58 || visible / (w * h) < .8) return false;
    if (anchor && (point.x < a.x - 32 || point.x > b.x + 32 || point.y < a.y - 32 || point.y > b.y + 32)) return false;
    ctx.enter(ctx.selection(), beforeGesture ?? before);
    return true;
  }

  function save() {
    return { ...value, ...dimensions() };
  }

  function requestEdges() {
    if (drawFrame) return;
    drawFrame = requestAnimationFrame(() => {
      drawFrame = 0;
      scene?.drawEdges(value.k);
    });
  }

  function abortGesture() {
    if (gesture?.card) {
      Object.assign(gesture.card, { x: gesture.x, y: gesture.y });
      cssBox(gesture.element, gesture.card);
      gesture.element.classList.remove('dragging');
      requestEdges();
    }
    gesture = null;
    viewport.classList.remove('panning');
  }

  function pinchGeometry() {
    const [a, b] = [...touches.values()];
    return { x: midpoint(a.x, b.x), y: midpoint(a.y, b.y), distance: Math.hypot(a.x - b.x, a.y - b.y) };
  }

  viewport.addEventListener('pointerdown', (event) => {
    if (!scene || event.button !== 0 || event.target.closest('.edge-label, #view-content')) return;
    stopTransition();
    const point = worldPoint(event);
    if (event.pointerType === 'touch') {
      touches.set(event.pointerId, point);
      if (touches.size >= 2) {
        abortGesture();
        if (touches.size === 2) pinch = { ...pinchGeometry(), before: save() };
        viewport.setPointerCapture(event.pointerId);
        event.preventDefault();
        return;
      }
    }
    if (gesture) return;
    const element = event.target.closest('.graph-card');
    const record = element && scene.cardsByAddress.get(element.dataset.id);
    if (element && !scene.draggable && event.pointerType !== 'touch') return;
    const card = scene.draggable ? record?.card : null;
    (element ?? viewport).focus({ preventScroll: true });
    (element ?? viewport).setPointerCapture(event.pointerId);
    gesture = { pointer: event.pointerId, point, card, element, x: card?.x ?? value.x, y: card?.y ?? value.y };
  });

  viewport.addEventListener('pointermove', (event) => {
    const point = worldPoint(event);
    if (touches.has(event.pointerId)) touches.set(event.pointerId, point);
    if (pinch) {
      if (touches.size !== 2 || pinch.used) return;
      const next = pinchGeometry();
      if (pinch.distance > 0 && next.distance > 0) {
        const used = zoom(next.distance / pinch.distance, pinch, pinch.before);
        if (!used) {
          value.x += next.x - pinch.x;
          value.y += next.y - pinch.y;
          apply();
        }
        pinch = { ...next, before: pinch.before, used };
      }
      return;
    }
    if (gesture?.pointer !== event.pointerId) return;
    const dx = point.x - gesture.point.x;
    const dy = point.y - gesture.point.y;
    if (!gesture.moved && Math.hypot(dx, dy) < 5) return;
    gesture.moved = true;
    if (gesture.card) {
      const { card, element } = gesture;
      card.x = Math.round(gesture.x + dx / value.k);
      card.y = Math.round(gesture.y + dy / value.k);
      if (scene.direction === 'vertical') card.x = clamp(card.x, 0, Math.max(0, ctx.availableWidth - card.width - 16));
      cssBox(element, card);
      element.classList.add('dragging');
      requestEdges();
    } else {
      value.x = gesture.x + dx;
      value.y = gesture.y + dy;
      viewport.classList.add('panning');
      apply();
    }
  });

  function endPointer(event) {
    touches.delete(event.pointerId);
    if (pinch) {
      if (touches.size === 0) pinch = null;
      suppressed = performance.now() + 250;
      return;
    }
    if (gesture?.pointer !== event.pointerId) return;
    const current = gesture;
    if (current.moved) suppressed = performance.now() + 250;
    if (event.type !== 'pointerup' || current.card && current.moved &&
        scene.cards.some((card) => card !== current.card && overlaps(card, current.card))) {
      if (event.type === 'pointerup') announce('位置与其他卡片重叠，已恢复');
      abortGesture();
      return;
    }
    gesture = null;
    viewport.classList.remove('panning');
    if (current.card && current.moved) ctx.move(current.card);
  }
  for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    viewport.addEventListener(name, endPointer);
  }
  viewport.addEventListener('wheel', (event) => {
    if (!scene) return;
    event.preventDefault();
    const now = performance.now();
    if (now - wheeling.last > 200) {
      wheelUsed = false;
      wheeling.before = save();
    }
    wheeling.last = now;
    if (wheelUsed) return;
    const delta = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewport.clientHeight : 1);
    if (delta) {
      wheelUsed = zoom(Math.exp(-clamp(delta, -120, 120) * .0025), worldPoint(event), wheeling.before);
    }
  }, { passive: false });

  const reset = () => {
    stopTransition();
    value = fit();
    home = value.k;
    apply();
  };
  viewport.addEventListener('keydown', (event) => {
    if (event.target !== viewport || !scene || event.altKey) return;
    const delta = { ArrowRight: [-48, 0], ArrowLeft: [48, 0], ArrowUp: [0, 48], ArrowDown: [0, -48] }[event.key];
    if (delta) {
      value.x += delta[0];
      value.y += delta[1];
      apply();
    } else if (event.key === '=' || event.key === '+') zoom(1.2);
    else if (event.key === '-') zoom(1 / 1.2);
    else if (event.key === '0') reset();
    else if (event.key === 'Enter' && ctx.canEnter(ctx.selection())) ctx.enter(ctx.selection());
    else return;
    event.preventDefault();
  });
  return {
    setScene, save, reveal, snapshot, animateLevel, stopTransition, reset, zoom,
    transitioning: () => Boolean(cancelTransition),
    consumeClick: (event) => event.detail > 0 && performance.now() < suppressed,
    abortGesture
  };
}


// Whose work the map shows comes before the map, and how much of it is built.
function mapFacts(ctx, container, people) {
  const facts = [];
  if (people.length) {
    const group = make('div', 'fact people');
    group.append(make('span', 'fact-name', types.actor));
    for (const person of people) {
      const chip = button(undefined, () => ctx.select(person.id, true), 'tool person');
      chip.dataset.object = person.id;
      chip.title = person.summary;
      chip.append(icon('actor'), textNode(person.title));
      group.append(chip);
    }
    facts.push(group);
  }
  const counts = new Map();
  for (const object of ctx.index.objects.values()) {
    if (object.id === container.id || !ctx.index.pathTo(object.id).includes(container)) continue;
    const state = implementationState(object, ctx.evidence);
    if (state) counts.set(state, (counts.get(state) ?? 0) + 1);
  }
  if (counts.size) {
    const progress = button(undefined, () => ctx.navigate('progress', container.id), 'tool fact progress-fact');
    progress.append(make('span', 'fact-name', '实现情况'));
    for (const state of Object.keys(implementations)) {
      if (!counts.has(state)) continue;
      const part = statusMark(state, implementations, 'implementation-status');
      part.append(make('b', '', counts.get(state)));
      progress.append(part);
    }
    facts.push(progress);
  }
  return facts;
}

registerRead('map', {
  label: '地图',
  icon: 'system',
  entry: true,
  resolve(ctx, address, intent) {
    const object = ctx.index.get(address);
    const enter = intent === 'enter' || intent === 'address' && object.type === 'module';
    const viewId = enter || object.id === ctx.index.root.id ? object.id : ctx.index.containerFor(object.parent).id;
    return { viewId, selected: enter || object.id === viewId ? null : address };
  },
  render(ctx) {
    const container = ctx.index.get(ctx.viewId);
    const children = ctx.index.children.get(container.id) ?? [];
    const annotations = children.filter((item) => Object.values(annotationTypes).includes(item.type));
    const drawn = children.filter((item) => !annotations.includes(item));
    // People are named above the map. They become cards only when the level holds nothing else.
    const people = drawn.some((item) => item.type !== 'actor') ? drawn.filter((item) => item.type === 'actor') : [];
    const cards = drawn.filter((item) => !people.includes(item));
    ctx.heading(container.title, container.summary, mapFacts(ctx, container, people));
    if (!cards.length) {
      showSceneEmpty(annotations.length ? '此层只有规则、验收或决策' : '此层暂无对象');
      return null;
    }
    const records = new Map(cards.map((card) => [card.id, card]));
    const projected = projectRelations(ctx.index, ctx.design.relations, container.id, new Set(records.keys()));
    const plan = layoutMap(cards, projected.edges, {
      direction: ctx.direction, availableWidth: ctx.availableWidth, positions: ctx.positions(container.id)
    });
    const scene = renderGraph(ctx, plan, records, projected.annotations, true);
    if (plan.edges.some((edge) => !edge.main)) scene.hint = '只画主要关系，选中卡片看它的全部关系';
    scene.related = (address) => new Set(ctx.design.relations
      .filter(({ from, to }) => (from === address) !== (to === address))
      .map(({ from, to }) => projected.owner(from === address ? to : from)).filter(Boolean));
    return scene;
  }
});


registerRead('flow', {
  label: '流程',
  icon: 'flow',
  resolve(ctx, address, intent) {
    const object = ctx.index.get(address);
    const flow = object.type === 'step' ? ctx.index.get(object.parent) : object;
    if (flow.type === 'flow') {
      return { viewId: flow.id, selected: object.type === 'step' || intent === 'switch' ? address : null };
    }
    return { viewId: ctx.index.root.id, selected: address === ctx.index.root.id ? null : address };
  },
  render(ctx) {
    const flow = ctx.index.get(ctx.viewId);
    if (flow.type !== 'flow') {
      ctx.heading('流程', '');
      const list = make('ul', 'flow-index');
      for (const item of ctx.design.objects.filter((object) => object.type === 'flow')) {
        const entry = make('li');
        entry.append(typeMark('flow'), objectLink(ctx, item.id),
          make('small', 'muted', ctx.index.pathTo(item.id).slice(0, -1).map((parent) => parent.title).join(' / ')));
        list.append(entry);
      }
      showSceneEmpty(list.children.length ? '选择流程' : '暂无流程', list.children.length ? list : null);
      return null;
    }
    ctx.heading(flow.title, flow.summary);
    const plan = layoutFlow(flow.body, { direction: ctx.direction, availableWidth: ctx.availableWidth });
    const records = new Map();
    const annotations = new Map();
    for (const step of flow.body.steps) {
      const id = flow.id + '#' + step.id;
      const phase = [flow.body.start === step.id ? '开始' : '', flow.body.ends.includes(step.id) ? '结束' : '']
        .filter(Boolean).join(' · ');
      records.set(step.id, { ...ctx.index.get(id), phase });
      const marks = ctx.design.relations.filter((edge) =>
        edge.type === 'governed_by' && edge.from === id || edge.type === 'verifies' && edge.to === id);
      annotations.set(step.id, Object.fromEntries(groupBy(marks, (mark) => mark.type)));
    }
    return renderGraph(ctx, plan, records, annotations);
  }
});


const inventoryColumns = {
  rule: [['触发条件', ({ body }) => body.when], ['约束', ({ body }) => body.constraint]],
  acceptance: [['当', ({ body }) => body.when], ['验收结果', (object) =>
    verificationStates[object.verification?.status ?? 'unknown']]],
  decision: [['问题', ({ body }) => body.question], ['结论', ({ body }) => body.chosen == null
    ? '待定' : body.options?.[body.chosen]?.title]],
  entity: [['字段数', ({ body }) => body.fields?.length ?? 0], ['归属', ({ body }) => body.ownership]],
  interface: [['类型', ({ body }) => body.kind], ['签名', ({ body }) => body.signature]],
  screen: [['路由', ({ body }) => body.route], ['用途', ({ body }) => body.purpose]]
};

function filterSelect(label, entries) {
  const field = make('label', 'reading-field');
  const select = make('select');
  select.setAttribute('aria-label', label);
  field.append(make('span', '', label), select);
  for (const [key, text] of [['', '全部'], ...entries]) {
    const option = make('option', '', text);
    option.value = key;
    select.append(option);
  }
  return { field, select };
}

function inventoryTable(ctx, type, rows) {
  const section = make('section', 'inventory-section');
  const title = type === 'decision' ? '待定与决策' : types[type];
  section.append(make('h2', '', title + ' · ' + rows.length));
  if (!rows.length) return section;
  const table = make('table', 'inventory-table');
  table.setAttribute('aria-label', title);
  const columns = [['名称'], ...inventoryColumns[type], ['所属模块'], ['设计状态']];
  const head = table.createTHead().insertRow();
  for (const [name] of columns) {
    const cell = make('th', '', name);
    cell.scope = 'col';
    head.append(cell);
  }
  const body = table.createTBody();
  for (const { object, module } of rows) {
    const row = body.insertRow();
    const first = row.insertCell();
    const action = inspectButton(ctx, object);
    first.append(action);
    const values = [...inventoryColumns[type].map(([, value]) => value(object)),
      module?.title, statuses[object.status]];
    for (const [i, value] of values.entries()) {
      const cell = row.insertCell();
      cell.append(make('span', 'inventory-cell-label', columns[i + 1][0]));
      cell.append(rich(make('span'), String(value ?? '—'), ctx));
    }
    row.addEventListener('click', (event) => { if (!event.target.closest('a, button')) action.click(); });
  }
  section.append(table);
  return section;
}

registerRead('inventory', {
  label: '清单', icon: 'inventory', article: true,
  render(ctx) {
    const page = articleReading(ctx, '项目清单', 'inventory-page');
    const toolbar = make('div', 'reading-toolbar');
    const modules = [...ctx.index.objects.values()].filter(({ type }) => type === 'module').sort(compareObjects);
    const filters = {
      status: filterSelect('设计状态', Object.entries(statuses)),
      implementation: filterSelect('实现情况', Object.entries(implementations)),
      module: filterSelect('所属模块', [['@root', '项目直属'], ...modules.map(({ id, title }) => [id, title])])
    };
    const results = make('div', 'inventory-results');
    const count = make('output', 'muted');
    count.setAttribute('aria-live', 'polite');
    const entries = Object.entries(filters);
    const clear = button('清除筛选', () => {
      for (const [, { select }] of entries) select.value = '';
      show();
      filters.status.select.focus();
    });
    function show() {
      const values = Object.fromEntries(entries.map(([key, { select }]) => [key, select.value]));
      const tables = inventoryRows(ctx.index, ctx.evidence, values);
      const total = Object.values(tables).reduce((sum, rows) => sum + rows.length, 0);
      const filtered = Object.values(values).some(Boolean);
      clear.disabled = !filtered;
      count.textContent = total + ' 项';
      results.replaceChildren(...(total
        ? Object.entries(tables).map(([type, rows]) => inventoryTable(ctx, type, rows))
        : [readingEmpty(filtered ? '当前筛选没有结果，可清除筛选查看全部。' : '暂无清单条目，可从地图查看项目。')]));
    }
    for (const [, { field, select }] of entries) {
      select.addEventListener('change', show);
      toolbar.append(field);
    }
    toolbar.append(clear, count);
    page.append(toolbar, results);
    show();
  }
});


function showProgressObjects(ctx, title, objects) {
  const list = make('ul', 'reading-object-list');
  for (const object of objects) {
    const row = make('li');
    const action = inspectButton(ctx, object);
    action.addEventListener('click', () => ctx.directory.close(), { capture: true });
    row.append(action);
    list.append(row);
  }
  ctx.directory.open('progress', title, objects.length ? list : readingEmpty('此项为 0，可返回进度查看其他状态。'));
}

function progressCounts(ctx, owner, kind, labels, groups) {
  const counts = make('div', 'progress-counts');
  for (const [state, items] of Object.entries(groups)) {
    const title = labels[state];
    const control = button(title + ' ' + items.length,
      () => showProgressObjects(ctx, owner.title + ' · ' + title, items), 'tool progress-count');
    control.dataset.kind = kind;
    control.dataset.state = state;
    control.dataset.count = items.length;
    counts.append(control);
  }
  return counts;
}

registerRead('progress', {
  label: '进度', icon: 'progress', article: true,
  render(ctx) {
    const result = progressGroups(ctx.index, ctx.evidence);
    const page = articleReading(ctx, '项目进度', 'progress-page');
    if (!result.matched) page.append(make('p', 'reading-notice', '本次生成未核对依据。'));
    if (!result.groups.length) {
      page.append(readingEmpty('暂无实现或验收条目，可从地图查看项目。'));
      return;
    }
    for (const { owner, implementation, verification } of result.groups) {
      const row = make('section', 'progress-group');
      row.dataset.module = owner.id;
      row.append(make('h2', '', owner.type === 'system' ? '项目直属' : owner.title));
      const bar = make('div', 'progress-bar');
      bar.setAttribute('aria-label', '实现情况分布');
      for (const [state, items] of Object.entries(implementation)) {
        if (!items.length) continue;
        const segment = make('span', '', items.length);
        segment.dataset.state = state;
        segment.style.flexGrow = items.length;
        segment.title = implementations[state] + ' ' + items.length;
        bar.append(segment);
      }
      if (bar.children.length) row.append(bar);
      row.append(progressCounts(ctx, owner, 'implementation', implementations, implementation),
        make('h3', '', '验收结果'), progressCounts(ctx, owner, 'verification', verificationStates, verification));
      page.append(row);
    }
    if (!result.review.length) return;
    const review = make('section', 'progress-group');
    review.append(make('h2', '', '需复查的依据'));
    const list = make('ul', 'reading-object-list');
    for (const { object, path, state } of result.review) {
      const row = make('li', 'review-evidence');
      row.append(inspectButton(ctx, object), make('code', '', path), make('span', 'muted', evidenceLabels[state]));
      list.append(row);
    }
    review.append(list);
    page.append(review);
  }
});


const changeLabels = { add: '新增', update: '修改', remove: '删除', link: '新增关系', unlink: '删除关系' };

function changeValue(value) {
  if (value === undefined) return '（无）';
  return typeof value === 'string' ? value : JSON.stringify(value, null, 2);
}

function compareField({ path, before, after }) {
  const field = make('div', 'changed-field');
  const key = path.replace(/^body\./, '');
  const label = Object.hasOwn(fieldLabels, key) ? fieldLabels[key] : null;
  field.append(make(label ? 'span' : 'code', 'field-path', label ?? path));
  const pair = make('div', 'diff-pair');
  const values = changeText(changeValue(before), changeValue(after));
  for (const [i, { leading, changed, trailing }] of values.entries()) {
    const cell = make('div', 'diff-cell');
    const value = make('pre');
    const mark = make(i === 0 ? 'del' : 'ins', '', changed);
    value.append(textNode(leading), mark, textNode(trailing));
    cell.append(make('span', 'muted', i === 0 ? '修改前' : '修改后'), value);
    pair.append(cell);
  }
  field.append(pair);
  return field;
}

function changeEntry(ctx, entry) {
  const item = make('li', 'change-entry');
  if (entry.relation) {
    const { from, to, type, label, when } = entry.relation;
    const subject = (id) => ctx.index.get(id)?.title ?? id;
    const description = subject(from) + ' → ' + subject(to);
    item.append(make('strong', '', description), make('p', 'muted', [relationNames[type], label, when]
      .filter(Boolean).join(' · ')));
    return item;
  }
  const object = entry.after ?? entry.before;
  const live = ctx.index.objects.get(entry.id);
  if (live) item.append(inspectButton(ctx, live, object?.title ?? entry.id));
  else item.append(make('strong', '', object?.title ?? entry.id));
  if (entry.op === 'update') {
    for (const field of fieldChanges(entry)) item.append(compareField(field));
  }
  return item;
}

registerRead('changes', {
  label: '变更', icon: 'reset', article: true,
  render(ctx) {
    const page = articleReading(ctx, '设计变更', 'changes-page');
    if (!ctx.history.length) {
      page.append(readingEmpty('暂无变更记录，设计更新后可在此查看。'));
      return;
    }
    const archive = make('ol', 'change-archive');
    const detail = make('div', 'change-details');
    const timestamp = new Intl.DateTimeFormat('sv-SE', { dateStyle: 'short', timeStyle: 'short' });
    const controls = [];
    function show() {
      for (const [i, control] of controls.entries()) {
        control.setAttribute('aria-pressed', String(ctx.activeChange === i));
      }
      detail.replaceChildren();
      if (ctx.activeChange === null) {
        detail.append(readingEmpty('请选择一条变更记录查看详情。'));
        return;
      }
      const record = ctx.history[ctx.activeChange];
      const heading = make('div', 'reading-actions');
      heading.append(make('h2', '', record.reason), button('取消选中', () => {
        const previous = controls[ctx.activeChange];
        ctx.setChange(null);
        show();
        previous.focus();
      }));
      detail.append(heading, make('p', 'muted', record.base + ' → ' + record.result));
      for (const [kind, entries] of Object.entries(historyChanges(ctx.index, ctx.history, ctx.activeChange))) {
        const section = make('section', 'change-section');
        section.dataset.change = kind;
        section.append(make('h3', '', changeLabels[kind] + ' · ' + entries.length));
        const list = make('ul');
        for (const entry of entries) list.append(changeEntry(ctx, entry));
        section.append(list);
        detail.append(section);
      }
    }
    for (const [i, record] of ctx.history.entries()) {
      const row = make('li');
      const control = button(undefined, () => { ctx.setChange(i); show(); }, 'tool change-record');
      const time = make('time', '', timestamp.format(new Date(record.at)));
      time.dateTime = record.at;
      control.append(make('strong', '', record.reason), time, make('small', 'muted', record.by));
      controls.push(control);
      row.append(control);
      archive.append(row);
    }
    page.append(archive, detail);
    show();
  }
});


function drawDecisionCount() {
  const tab = byId('readings').querySelector('[data-mode="decisions"]');
  if (!tab) return;
  let badge = tab.querySelector('.reading-badge');
  if (!badge) tab.append(badge = make('span', 'reading-badge'));
  const pending = pendingDecisions(index);
  const count = pending.filter((object) => !decisions.some(({ item }) =>
    item.id === object.id && item.op !== 'comment')).length;
  badge.textContent = count;
  tab.setAttribute('aria-label', '待拍板，' + count + ' 项待决定');
}

function decisionSave(ctx, item) {
  const saved = ctx.setDecisions(queueDecision(ctx.decisions, item, ctx.rev));
  announce(saved ? '已记录' : '浏览器无法保存，请导出后再关闭页面。');
}

function editDecision(ctx, object, op) {
  const existing = ctx.decisions.find(({ item }) => item.id === object.id && item.op === op)?.item;
  const form = make('form', 'decision-form');
  let choice;
  if (op === 'decide') {
    const field = make('label', 'reading-field');
    choice = make('select');
    choice.setAttribute('aria-label', '选项');
    choice.required = true;
    const placeholder = make('option', '', '选择一项');
    placeholder.value = '';
    choice.append(placeholder);
    for (const [i, item] of (object.body.options ?? []).entries()) {
      const option = make('option', '', item.title);
      option.value = i;
      choice.append(option);
    }
    choice.value = existing?.chosen ?? '';
    field.append(make('span', '', '选项'), choice);
    form.append(make('p', '', object.body.question), field);
  }
  const notes = make('label', 'reading-field');
  const text = make('textarea');
  text.rows = 4;
  text.value = existing?.text ?? existing?.rationale ?? '';
  text.required = op === 'comment';
  notes.append(make('span', '', op === 'comment' ? '批注' : '理由（可选）'), text);
  const submit = make('button', 'tool primary', '保存' + decisionVerbs[op]);
  submit.type = 'submit';
  form.append(notes, submit);
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (op === 'comment' && !text.value.trim()) {
      text.focus();
      return;
    }
    const item = { op, id: object.id };
    if (op === 'decide') item.chosen = Number(choice.value);
    if (op === 'comment') item.text = text.value;
    else if (text.value.trim()) item.rationale = text.value;
    ctx.directory.close();
    decisionSave(ctx, item);
    if (ctx.mode === 'decisions') focusDecision(object.id);
  });
  ctx.directory.open('decision-form', decisionVerbs[op] + ' · ' + object.title, form, choice ?? text);
}

function focusDecision(id) {
  const target = id && byId('view-content').querySelector('.decision-row[data-id="' + id + '"] button');
  (target ?? byId('view-content').querySelector('button') ?? byId('viewport')).focus();
}

async function copyDecisions(ctx) {
  const value = decisionPrompt(ctx.index, ctx.decisions, ctx.rev, ctx.designDir);
  try {
    await navigator.clipboard.writeText(value);
    announce('已复制给 AI');
    const feedback = byId('decision-feedback');
    if (feedback) feedback.textContent = '已复制';
  } catch {
    const field = make('label', 'reading-field');
    const text = make('textarea', 'decision-copy');
    text.readOnly = true;
    text.value = value;
    text.rows = 14;
    field.append(make('span', '', '剪贴板不可用，可全选并手动复制。'), text);
    ctx.directory.open('decision-copy', '复制给 AI', field, text);
    text.select();
  }
}

function pendingRow(ctx, object) {
  const row = make('li', 'decision-row');
  row.dataset.id = object.id;
  const head = make('div', 'decision-object');
  const title = inspectButton(ctx, object);
  title.prepend(typeMark(object.type));
  head.append(title, make('p', 'muted', object.body.question ?? object.summary));
  const queued = ctx.decisions.find(({ item }) => item.id === object.id && item.op !== 'comment');
  if (queued) head.append(make('p', 'decision-recorded', '已记录 · ' + decisionVerbs[queued.item.op]));
  if (object.type === 'decision' && object.body.chosen != null) {
    const { chosen, options, rationale } = object.body;
    head.append(make('p', 'decision-conclusion', fieldLabels.chosen + '：' + options[chosen].title));
    if (rationale) head.append(make('p', 'muted decision-rationale', fieldLabels.rationale + '：' + rationale));
  }
  const actions = make('div', 'reading-actions');
  for (const op of decisionActions(object)) {
    if (op === 'accept') {
      actions.append(button('接受', () => {
        decisionSave(ctx, { op, id: object.id });
        focusDecision(object.id);
      }));
    } else {
      const label = { decide: '选择选项', retire: '否决', comment: '写批注' }[op];
      actions.append(button(label, () => editDecision(ctx, object, op), op === 'decide' ? 'tool primary' : 'tool'));
    }
  }
  row.append(head, actions);
  return row;
}

registerRead('decisions', {
  label: '待拍板', icon: 'decision', article: true, entry: true,
  render(ctx) {
    const page = articleReading(ctx, '项目拍板', 'decisions-page');
    const queue = make('section', 'decision-queue');
    const count = ctx.decisions.length;
    queue.append(make('h2', '', '待交回的决定 · ' + count));
    if (count) {
      const actions = make('div', 'reading-actions');
      const feedback = make('output', 'muted');
      feedback.id = 'decision-feedback';
      feedback.setAttribute('aria-live', 'polite');
      actions.append(button('复制给 AI', () => copyDecisions(ctx), 'tool primary'),
        button('导出决定', () => downloadJson(decisionFile(ctx.decisions, ctx.rev), 'decisions.json')),
        button('清空已做的决定', () => {
          if (window.confirm('清空本项目尚保存在浏览器中的决定和批注？')) {
            ctx.setDecisions([]);
            focusDecision();
          }
        }), feedback);
      queue.append(actions);
      const list = make('ol', 'decision-list');
      for (const [i, { item, rev }] of ctx.decisions.entries()) {
        const row = make('li', 'decision-item');
        const text = make('div');
        text.append(make('p', '', decisionLine(ctx.index, item)), make('code', 'muted', rev));
        const undo = button('撤销', () => { ctx.setDecisions(undoDecision(ctx.decisions, i)); focusDecision(item.id); });
        undo.setAttribute('aria-label', '撤销第 ' + (i + 1) + ' 条');
        row.append(text, undo);
        list.append(row);
      }
      queue.append(list);
    }
    const items = pendingDecisions(ctx.index);
    if (count) page.append(queue);
    if (!items.length) {
      page.append(readingEmpty('暂无待决定事项，可在对象详情中写批注。'));
      return;
    }
    const list = make('ul', 'decision-list');
    for (const object of items) list.append(pendingRow(ctx, object));
    page.append(make('h2', '', '待决定事项 · ' + items.length), list);
  }
});


const input = JSON.parse(byId('arkigo-data').textContent);
const index = indexDesign(input.design);
const root = index.root.id;
const detail = byId('detail');
const restored = new Map();
const storageKey = 'arkigo-layout-v2:' + input.design.id;
const originalPositions = input.layout?.views ?? {};
const savedPositions = readStorage(storageKey, {});
const decisionKey = 'arkigo-decisions-v1:' + input.design.id;
let decisions = retainDecisions(readStorage(decisionKey, []), index, input.rev);
let activeChange = null;
let changeMarks = new Map();
const firstRead = readModes.keys().next().value;
let state;
let scene;
let renderedDetail;

function entriesFor(record, id) {
  return Object.hasOwn(record, id) ? record[id] : {};
}

function positions(id) {
  return Object.hasOwn(savedPositions, id) ? savedPositions[id] : entriesFor(originalPositions, id);
}

function exportData() {
  const views = [];
  for (const id of new Set([...Object.keys(originalPositions), ...Object.keys(savedPositions)])) {
    if (!index.objects.has(id)) continue;
    const entries = Object.entries(positions(id)).filter(([card, point]) => {
      const object = index.objects.get(card);
      return object?.parent === id && !Object.values(annotationTypes).includes(object.type) &&
        Number.isFinite(point?.x) && Number.isFinite(point?.y);
    });
    if (entries.length) views.push([id, Object.fromEntries(entries)]);
  }
  return { format: 'arkigo-layout/2', views: Object.fromEntries(views) };
}

function modeFor(address) {
  return ['step', 'flow'].includes(index.get(address)?.type) ? 'flow' : 'map';
}

function canEnter(address) {
  const object = address && index.get(address);
  return object?.type === 'flow' && state.viewId !== address ||
    object?.type === 'module' && index.children.has(address) && state.viewId !== address;
}

function heading(title, summary, facts = []) {
  byId('view-title').textContent = title;
  byId('view-summary').textContent = summary;
  byId('view-summary').hidden = !summary;
  byId('view-facts').replaceChildren(...facts);
  byId('view-facts').hidden = !facts.length;
}

const ctx = {
  ...input, index, heading, positions, modeFor, canEnter,
  get viewId() { return state.viewId; },
  get mode() { return state.mode; },
  get direction() { return narrowScreen.matches ? 'vertical' : 'horizontal'; },
  get availableWidth() { return Math.max(1, byId('viewport').clientWidth - 36); },
  selection: () => state?.selected,
  select, enter, back, move, jump,
  readAddress: (address) => {
    saveHistory();
    state = { ...state, address, selected: address };
    saveHistory(false);
    paintSelection();
  },
  get decisions() { return decisions; },
  setDecisions(entries) {
    decisions = entries;
    const saved = writeStorage(decisionKey, entries);
    drawDecisionCount();
    if (state.mode === 'decisions') renderReading();
    return saved;
  },
  get activeChange() { return activeChange; },
  setChange(record) {
    activeChange = record;
    changeMarks = historyMarks(index, input.history[record]);
  },
  marksFor: (id) => changeMarks.get(id),
  navigate: (mode, address, intent = 'switch') => navigate(mode, address, intent)
};
ctx.camera = createCamera(ctx);
ctx.directory = createDirectory(ctx);

function stateFor(mode, address, intent, showDetail = false) {
  const definition = readModes.get(mode);
  const resolved = definition.resolve?.(ctx, address, intent) ??
    { viewId: root, selected: address === root ? null : address };
  return {
    mode, address, viewId: resolved.viewId, selected: resolved.selected,
    detail: showDetail ? address : resolved.detail ?? null
  };
}

function locationState() {
  const match = /^#\/([^/]+)\/(.+)$/.exec(location.hash);
  let address;
  try { address = decodeURIComponent(match?.[2] ?? root); } catch { address = root; }
  const mode = readModes.has(match?.[1]) ? match[1] : firstRead;
  if (!index.get(address)) return stateFor(firstRead, root, 'address');
  const remembered = history.state?.arkigo;
  if (remembered?.mode === mode && remembered.address === address && index.objects.has(remembered.viewId)) {
    return remembered;
  }
  const type = index.get(address).type;
  const showDetail = !readModes.get(mode).article && !['system', 'module', 'flow'].includes(type);
  return stateFor(mode, address, 'address', showDetail);
}

function saveHistory(replace = true, camera = ctx.camera.save()) {
  history[replace ? 'replaceState' : 'pushState']({ arkigo: { ...state, camera } }, '',
    addressHash(state.mode, state.address));
}

function drawNavigation() {
  const page = readModes.get(state.mode);
  // A flow is part of the map. The pages without an entry of their own are opened from the map and lead back to it.
  const entry = page.entry ? state.mode : state.mode === 'flow' ? 'map' : null;
  for (const item of byId('readings').children) {
    if (item.dataset.mode === entry) item.setAttribute('aria-current', 'page');
    else item.removeAttribute('aria-current');
  }
  const crumbs = byId('crumbs');
  crumbs.replaceChildren();
  const trail = index.pathTo(state.viewId).filter((object) => ['system', 'module', 'flow'].includes(object.type))
    .map((item, i) => ({ title: i === 0 ? input.design.title : item.title, open: () => returnTo(item.id) }));
  if (!entry) trail.push({ title: page.label });
  for (const [i, { title, open }] of trail.entries()) {
    if (i) crumbs.append(icon('right'));
    const last = i === trail.length - 1;
    const crumb = last ? make('span', 'crumb', title) : button(title, open, 'crumb');
    crumb.title = title;
    if (last) crumb.setAttribute('aria-current', 'location');
    crumbs.append(crumb);
  }
  // At the top of the map the title already says where the reader is.
  crumbs.hidden = trail.length < 2;
  crumbs.scrollLeft = crumbs.scrollWidth;
}

function paintSelection() {
  const selected = state.selected && index.get(state.selected);
  const onCard = Boolean(scene?.cardsByAddress.has(state.selected));
  const related = selected && !onCard ? scene?.related?.(state.selected) : null;
  for (const [id, { element }] of scene?.cardsByAddress ?? []) {
    element.setAttribute('aria-pressed', String(id === state.selected));
    element.classList.toggle('card-related', Boolean(related?.has(id)));
  }
  for (const edge of byId('world').querySelectorAll('.graph-edge, .edge-label')) {
    edge.classList.toggle('edge-selected', edge.dataset.from === state.selected || edge.dataset.to === state.selected);
  }
  byId('world').classList.toggle('has-selection', onCard);
  for (const item of document.querySelectorAll('#view-content [data-object], #view-facts [data-object]')) {
    if (item.dataset.object === state.selected) item.setAttribute('aria-current', 'true');
    else item.removeAttribute('aria-current');
  }
  byId('selection').hidden = !selected || Boolean(state.detail) && narrowScreen.matches;
  byId('hint').textContent = scene?.hint ?? '';
  byId('hint').hidden = Boolean(selected) || !scene?.hint;
  byId('selection-title').textContent = selected?.title ?? '';
  byId('enter').hidden = !selected || !canEnter(selected.id);
  byId('enter').textContent = selected?.type === 'flow' ? '查看流程' : '进入模块';
}

function paintDetail(focus = false) {
  const show = Boolean(state.detail);
  byId('reading').inert = show && narrowScreen.matches;
  document.querySelector('.topbar').inert = show && narrowScreen.matches;
  document.querySelector('.location').inert = show && narrowScreen.matches;
  detail.hidden = !show;
  if (show && (renderedDetail !== state.detail || focus)) {
    const title = renderDetails(ctx, state.detail, () => closeDetail(true));
    if (focus) title.focus({ preventScroll: true });
  }
  renderedDetail = state.detail;
}

function render(camera = null, focus = false) {
  paintDetail(focus);
  byId('world').replaceChildren();
  scene = renderReading();
  byId('world').hidden = !scene;
  byId('controls').hidden = !scene;
  byId('reset').hidden = byId('export').hidden = !scene?.draggable;
  byId('view-detail').hidden = Boolean(readModes.get(state.mode).article);
  // The path row comes and goes with the level, so it is drawn before the camera measures the canvas.
  drawNavigation();
  ctx.camera.setScene(scene, camera);
  if (!camera || state.detail) ctx.camera.reveal(scene?.cardsByAddress.get(state.selected)?.card);
  paintSelection();
}

function renderReading() {
  byId('view-content').onscroll = null;
  byId('view-content').replaceChildren();
  byId('view-content').hidden = true;
  heading('', '');
  document.body.dataset.reading = state.mode;
  return readModes.get(state.mode).render(ctx);
}

function navigate(mode, address, intent, options = {}) {
  if (!readModes.has(mode) || !index.get(address)) return;
  const previous = state;
  const camera = options.before ?? ctx.camera.save();
  const owner = scene?.cardsByAddress.get(address)?.card;
  const oldScene = scene;
  const clone = options.transition ? ctx.camera.snapshot() : null;
  const next = options.saved ?? stateFor(mode, address, intent, options.detail);
  if (previous && !options.pop) {
    restored.set(previous.viewId, { ...previous, camera });
    saveHistory(true, camera);
  }
  ctx.camera.abortGesture();
  ctx.camera.stopTransition();
  ctx.directory.close();
  state = next;
  render(next.camera, Boolean(next.detail));
  if (!next.detail) {
    const target = scene?.cardsByAddress.get(next.selected)?.element;
    (options.transition || options.focus ? target ?? byId('viewport') : null)?.focus({ preventScroll: true });
  }
  if (!options.pop) saveHistory(false);
  if (options.transition === 'in') ctx.camera.animateLevel(clone, oldScene, owner, camera, true);
  if (options.transition === 'out') {
    const enclosing = scene?.cardsByAddress.get(options.via)?.card;
    ctx.camera.animateLevel(clone, oldScene, enclosing, ctx.camera.save(), false);
  }
  announce('当前视图 ' + byId('view-title').textContent);
}

function select(address, showDetail = false) {
  const oldCamera = ctx.camera.save();
  state = { ...state, address, selected: address, detail: showDetail ? address : null };
  paintDetail(showDetail);
  const card = scene?.cardsByAddress.get(address)?.card;
  ctx.camera.setScene(scene, oldCamera);
  ctx.camera.reveal(card);
  paintSelection();
  saveHistory();
}

function inspect(address) {
  if (address) select(address, true);
}

function closeDetail(focus = false) {
  if (!state.detail) return;
  const oldCamera = ctx.camera.save();
  state = { ...state, detail: null };
  paintDetail();
  ctx.camera.setScene(scene, oldCamera);
  paintSelection();
  saveHistory();
  if (focus) (scene?.cardsByAddress.get(state.selected)?.element ??
    byId('view-content').querySelector('[data-object="' + state.selected + '"]') ??
    byId('view-detail')).focus({ preventScroll: true });
}

function enter(address, before) {
  if (!canEnter(address)) return;
  navigate(modeFor(address), address, 'enter', { transition: 'in', before });
}

function jump(address, locate = false) {
  const type = index.get(address).type;
  const mode = type === 'flow' && locate ? 'map' : modeFor(address);
  navigate(mode, address, 'jump', { detail: !['module', 'system', 'flow'].includes(type), focus: true });
}

function returnTo(id, animated = true) {
  if (id === state.viewId && state.mode === 'map') return false;
  const path = index.pathTo(state.viewId);
  const via = path[path.findIndex((object) => object.id === id) + 1]?.id;
  const saved = restored.get(id);
  const next = saved?.mode === 'map' ? { ...saved, detail: null }
    : { ...stateFor('map', id, 'enter'), address: via ?? id, selected: via ?? null };
  navigate('map', next.address, 'enter', { saved: next, transition: animated ? 'out' : null, via, focus: true });
  return true;
}

function back(animated = true) {
  const parent = index.pathTo(state.viewId).slice(0, -1).reverse().find((item) =>
    ['system', 'module'].includes(item.type));
  if (parent) return returnTo(parent.id, animated);
  if (state.mode !== 'map') return returnTo(root, animated);
  return false;
}

function setPositions(viewId, value) {
  Object.defineProperty(savedPositions, viewId, { value, enumerable: true, configurable: true, writable: true });
  const saved = writeStorage(storageKey, savedPositions);
  announce(saved ? '布局已保存' : '浏览器无法保存位置，可导出布局文件');
}

function move(card) {
  setPositions(state.viewId, { ...positions(state.viewId), [card.id]: { x: card.x, y: card.y } });
  render(ctx.camera.save());
}

function downloadLayout() {
  downloadJson(exportData(), 'layout.json');
}

function restoreLocation() {
  const next = locationState();
  if (next.address === state.address && next.mode === state.mode && next.viewId === state.viewId &&
      next.selected === state.selected && next.detail === state.detail) return;
  navigate(next.mode, next.address, 'address', { saved: next, pop: true, focus: true });
}

function initialize() {
  const project = byId('project-name');
  project.textContent = project.title = input.design.title;
  document.title = input.design.title + ' · ArkiGo';
  byId('rev').textContent = input.rev;
  byId('rev').title = '最近变更';
  byId('rev').onclick = () => navigate('changes', state.selected ?? state.viewId, 'switch');
  byId('brand-icon').append(icon('module'));
  for (const [mode, definition] of readModes) {
    if (!definition.entry) continue;
    const tab = button(undefined, () => {
      if (mode !== state.mode) navigate(mode, state.selected ?? state.viewId, 'switch');
    }, 'read-mode');
    tab.dataset.mode = mode;
    tab.append(icon(definition.icon), textNode(definition.label));
    byId('readings').append(tab);
  }
  drawDecisionCount();
  writeStorage(decisionKey, decisions);
  const toolIcons = {
    'search-open': 'search', 'view-detail': 'info',
    'zoom-in': 'plus', 'zoom-out': 'minus', fit: 'fit', reset: 'reset', export: 'export'
  };
  for (const [id, glyph] of Object.entries(toolIcons)) {
    const tool = byId(id);
    const label = tool.getAttribute('aria-label');
    if (label) tool.title = label;
    tool.prepend(icon(glyph));
  }
  byId('search-open').onclick = ctx.directory.search;
  byId('view-detail').onclick = () => inspect(state.viewId);
  byId('inspect').onclick = () => inspect(state.selected);
  byId('enter').onclick = () => enter(state.selected);
  byId('zoom-in').onclick = () => ctx.camera.zoom(1.22);
  byId('zoom-out').onclick = () => ctx.camera.zoom(1 / 1.22);
  byId('fit').onclick = ctx.camera.reset;
  byId('reset').onclick = () => {
    setPositions(state.viewId, {});
    render();
  };
  byId('export').onclick = downloadLayout;
  const systemTheme = matchMedia('(prefers-color-scheme: dark)');
  const effectiveTheme = () => document.documentElement.dataset.theme ?? (systemTheme.matches ? 'dark' : 'light');
  const theme = byId('theme');
  function paintTheme() {
    const dark = effectiveTheme() === 'dark';
    theme.replaceChildren(icon(dark ? 'sun' : 'moon'));
    theme.setAttribute('aria-label', dark ? '切换到浅色' : '切换到深色');
    theme.title = theme.getAttribute('aria-label');
  }
  theme.onclick = () => {
    const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('arkigo-theme', next); } catch {}
    paintTheme();
  };
  systemTheme.addEventListener('change', paintTheme);
  paintTheme();

  document.addEventListener('pointerdown', () => { document.documentElement.dataset.input = 'pointer'; }, true);
  document.addEventListener('keydown', (event) => {
    document.documentElement.dataset.input = 'keyboard';
    const editing = event.target.closest('input, textarea, select, [contenteditable="true"]');
    const browse = ctx.directory.active();
    if (event.key === 'Escape' && !browse) {
      if (state.detail) closeDetail(true);
      else back(false);
      event.preventDefault();
    } else if (event.altKey && event.key === 'ArrowLeft' && !editing && !browse) {
      back(false);
      event.preventDefault();
    } else if (!editing && !browse && !detail.contains(event.target) &&
        (event.key === '/' || event.key.toLowerCase() === 'k' && (event.metaKey || event.ctrlKey))) {
      event.preventDefault();
      ctx.directory.search();
    } else if (!editing && !browse && event.key.toLowerCase() === 'i' && state.selected) {
      inspect(state.selected);
      event.preventDefault();
    }
  });
  window.addEventListener('popstate', restoreLocation);
  window.addEventListener('hashchange', restoreLocation);
  narrowScreen.addEventListener('change', () => {
    ctx.camera.stopTransition();
    render();
  });
  largeTargets.addEventListener('change', () => render(ctx.camera.save()));
  reducedMotion.addEventListener('change', () => ctx.camera.stopTransition());
  state = locationState();
  render(state.camera);
  saveHistory();
  let lastWidth = window.innerWidth;
  let lastHeight = window.innerHeight;
  window.addEventListener('resize', () => {
    if (lastWidth === window.innerWidth && lastHeight === window.innerHeight) return;
    lastWidth = window.innerWidth;
    lastHeight = window.innerHeight;
    render();
  });
  window.arkigoCanvas = Object.freeze({
    getState: () => structuredClone({
      mode: state.mode, address: state.address, viewId: state.viewId, selected: state.selected, detail: state.detail,
      path: index.pathTo(state.viewId).map((object) => object.id), camera: ctx.camera.save(),
      direction: ctx.direction, transitioning: ctx.camera.transitioning(), panel: ctx.directory.active(),
      layout: exportData(), cards: scene?.cards ?? [], zones: scene?.zones ?? []
    })
  });
}

initialize();

    })();
  </script>
