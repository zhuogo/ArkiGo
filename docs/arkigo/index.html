<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' file:">
  <title>ArkiGo</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('arkigo-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch {}
  </script>
  <style>:root {
  --paper: #f8f9fc;
  --surface: #fff;
  --ink: #20253a;
  --muted: #57647c;
  --line: #d7ddea;
  --zone: #eaf0f9;
  --grid: #d9dfec;
  --accent: #2e54aa;
  --accent-bg: #e7eefc;
  --edge: #6f84ad;
  --warn: #964f19;
  --good: #14674f;
  --shadow: 0 6px 18px #233f6d0c;
  color-scheme: light;
  font-family: Inter, ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
}

:root[data-theme="dark"] {
  --paper: #161922;
  --surface: #202533;
  --ink: #ecf0fa;
  --muted: #b0bbd0;
  --line: #3c4658;
  --zone: #1b2230;
  --grid: #2a3345;
  --accent: #adc4ff;
  --accent-bg: #303e60;
  --edge: #899bc0;
  --warn: #ffc189;
  --good: #8bd9bc;
  --shadow: 0 6px 18px #0003;
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --paper: #161922;
    --surface: #202533;
    --ink: #ecf0fa;
    --muted: #b0bbd0;
    --line: #3c4658;
    --zone: #1b2230;
    --grid: #2a3345;
    --accent: #adc4ff;
    --accent-bg: #303e60;
    --edge: #899bc0;
    --warn: #ffc189;
    --good: #8bd9bc;
    --shadow: 0 6px 18px #0003;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto auto minmax(0, 1fr);
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
}

button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
button:focus-visible, a:focus-visible, input:focus-visible, #viewport:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

svg { width: 18px; height: 18px; vertical-align: middle; flex: none; }
p, h1, h2, h3, ul, ol, figure { margin: 0; }
code { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
.muted { color: var(--muted); }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.topbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: center;
  gap: 16px;
  padding: 10px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand, .tools, #readings, .location, #crumbs, .tool {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand { min-width: 0; gap: 11px; }
.brand strong, .crumb, #selection-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand strong { font-size: 15px; }
#rev { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 11px; flex-shrink: 0; min-height: 26px; }
#brand-icon {
  background: var(--accent-bg);
  color: var(--accent);
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 7px;
  flex: none;
}
.tools { justify-content: flex-end; }
#readings { padding: 3px; gap: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.read-mode, .tool, .crumb {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 32px;
  padding: 4px 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  white-space: nowrap;
}
.tool:hover, .read-mode:hover, button.crumb:hover { color: var(--accent); background: var(--accent-bg); }
.read-mode { padding-inline: 13px; }
.read-mode[aria-current] {
  color: var(--accent);
  border-color: var(--line);
  background: var(--surface);
  font-weight: 650;
  box-shadow: var(--shadow);
}
.tool svg, .read-mode svg { width: 16px; height: 16px; }
.tool.primary { color: var(--accent); background: var(--accent-bg); font-weight: 650; }
.location { min-width: 0; padding: 3px 23px; border-bottom: 1px solid var(--line); }
#crumbs { overflow-x: auto; scrollbar-width: none; gap: 3px; }
#crumbs svg { width: 13px; color: var(--muted); }
.crumb { display: block; max-width: min(360px, 75vw); flex: none; }
.crumb[aria-current] { font-weight: 650; color: var(--ink); }

#workspace { grid-row: 3; display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
#reading { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
.view-heading {
  padding: 22px 30px 16px;
  min-width: 0;
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 14px;
}
.view-heading > div { min-width: 0; }
.view-heading h1 { font-size: 26px; line-height: 1.3; letter-spacing: -.01em; overflow-wrap: anywhere; }
#view-detail { flex: none; }
.view-heading p { font-size: 13px; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
#view-facts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-top: 12px; }
.fact { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; }
.fact-name { color: var(--muted); margin-right: 2px; }
.person, .progress-fact { min-height: 28px; border-color: var(--line); background: var(--surface); color: var(--ink); }
.person { padding: 3px 10px 3px 7px; border-radius: 14px; }
.person svg { color: var(--muted); }
.person[aria-current] { color: var(--accent); border-color: var(--accent); background: var(--accent-bg); }
.progress-fact { gap: 10px; padding: 3px 10px; }
.progress-fact b { margin-left: 4px; font-variant-numeric: tabular-nums; }
.count { color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; }
#viewport {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: clip;
  touch-action: none;
  background-image: radial-gradient(var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
}
#viewport.panning { cursor: grabbing; }
#world, .scene-ghost { position: absolute; inset: 0; transform-origin: 0 0; }
.scene-ghost { pointer-events: none; }
.graph-zone, .graph-card, .edge-label, .graph-edges { position: absolute; }
.graph-zone {
  background: color-mix(in srgb, var(--surface) 62%, transparent);
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--muted);
  pointer-events: none;
}
.graph-zone > span {
  display: block;
  margin: 11px 16px;
  font-size: 12px;
  font-weight: 600;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.graph-card {
  display: grid;
  grid-template-rows: 25px 21px 37px 19px;
  align-content: start;
  gap: 3px;
  text-align: left;
  border: 1px solid var(--line);
  color: var(--ink);
  background: var(--surface);
  padding: 11px 14px;
  border-radius: 10px;
  box-shadow: var(--shadow);
  user-select: none;
}
.graph-card[data-enterable="true"] { background: color-mix(in srgb, var(--accent-bg) 38%, var(--surface)); }
.graph-card:hover, .graph-card[aria-pressed="true"] { border-color: var(--accent); }
.graph-card[aria-pressed="true"] { box-shadow: 0 0 0 1px var(--accent); }
.graph-card.card-related { border-color: var(--accent); background: var(--accent-bg); }
.graph-card.dragging { z-index: 4; cursor: grabbing; }
.card-meta, .card-kind, .card-flags, .card-count { display: flex; align-items: center; gap: 5px; }
.card-meta { justify-content: space-between; min-width: 0; font-size: 12px; }
.card-kind { color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; }
.card-title, .card-summary {
  min-width: 0;
  overflow: hidden;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-box-orient: vertical;
}
.card-title { font-size: 16px; line-height: 21px; font-weight: 650; -webkit-line-clamp: 1; }
.card-summary { color: var(--muted); font-size: 13px; line-height: 18px; -webkit-line-clamp: 2; }
.card-flags { align-self: end; color: var(--muted); gap: 8px; }
.card-flags > svg { margin-left: auto; }
.card-flags svg { width: 14px; height: 14px; }
.card-count { font-size: 12px; }
.failure { color: var(--warn); }
.type-mark {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  flex: none;
  background: var(--accent-bg);
  color: var(--accent);
  border-radius: 5px;
}
.type-mark svg { width: 16px; height: 16px; }
.type-mark[data-type="entity"], .type-mark[data-type="acceptance"] { color: var(--good); }
.type-mark[data-type="rule"], .type-mark[data-type="decision"] { color: var(--warn); }
.type-mark[data-type="actor"], .type-mark[data-type="screen"] { color: var(--muted); background: var(--paper); }
.implementation-status, .design-status, .evidence-status, .step-phase {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.implementation-status[data-state="implemented"], .evidence-status[data-state="ok"] { color: var(--good); }
.implementation-status[data-state="stale"], .implementation-status[data-state="partial"],
.evidence-status[data-state="missing"], .evidence-status[data-state="changed"] { color: var(--warn); }
.design-status[data-state="accepted"], .step-phase { color: var(--accent); }
.graph-edges { overflow: visible; pointer-events: none; }
.graph-edge { fill: none; stroke: var(--edge); stroke-width: 1.5px; }
.graph-edge.edge-selected { stroke: var(--accent); stroke-width: 2px; }
.minor-edge { visibility: hidden; }
.minor-edge.edge-selected { visibility: visible; }
.has-selection .graph-edge:not(.edge-selected), .has-selection .edge-label:not(.edge-selected) { opacity: .28; }
.edge-label.edge-selected { color: var(--accent); border-color: var(--accent); }
.back-edge { stroke: var(--warn); stroke-dasharray: 6 4; }
.arrow-tip { fill: var(--edge); }
.edge-label {
  display: block;
  padding: 2px 5px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--surface);
  color: var(--muted);
  font-size: 12px;
  line-height: 17px;
  text-align: center;
  white-space: nowrap;
}
.edge-label > span { display: block; overflow: hidden; text-overflow: ellipsis; }
button.edge-label:hover { color: var(--accent); border-color: var(--accent); }

#controls {
  display: flex;
  min-height: 47px;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
  padding: 6px 23px;
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.camera-tools, #selection { display: flex; align-items: center; gap: 3px; }
#selection, #hint { margin-right: auto; min-width: 0; }
#selection { gap: 5px; }
#hint { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#selection-title { font-size: 13px; }
#scale { min-width: 42px; text-align: center; color: var(--muted); font-size: 12px; }
.divider { width: 1px; height: 19px; margin-inline: 3px; background: var(--line); }

#detail {
  width: min(410px, 39vw);
  z-index: 5;
  overflow: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  border-left: 1px solid var(--line);
  overflow-wrap: anywhere;
  scrollbar-width: thin;
}
.detail-head { position: relative; display: grid; gap: 9px; padding: 20px 22px 17px; }
.detail-head h2 { font-size: 23px; line-height: 1.3; }
.detail-head h2:focus { outline: none; }
.detail-head > p { color: var(--muted); line-height: 1.5; }
.detail-head > .tool[aria-label="关闭详情"] { position: absolute; right: 13px; top: 15px; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.detail-actions .tool { border-color: var(--line); }
.detail-actions .primary { border-color: transparent; }
.detail-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; padding-right: 27px; }
.detail-content { padding: 0 22px 20px; }
.detail-section { padding: 13px 0; border-top: 1px solid var(--line); line-height: 1.55; }
.detail-section h3 { margin-bottom: 6px; font-size: 12px; font-weight: 650; color: var(--muted); }
.detail-section p + p, .detail-section p + ul { margin-top: 5px; }
.detail-section ol, .detail-section ul { padding-left: 21px; }
.detail-section li + li { margin-top: 5px; }
.detail-section code:not(pre code) { background: var(--paper); border-radius: 3px; padding: 1px 3px; }
.detail-section pre { margin: 0; padding: 10px; overflow: auto; background: var(--paper); border-radius: 6px; }
.detail-id { color: var(--muted); font-size: 11px; }
.table-scroll { overflow: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); background: var(--paper); }
.detail-section:is([data-field="fields"], [data-field="request"], [data-field="response"]) td:nth-child(-n + 2) {
  overflow-wrap: break-word;
}
.detail-section:is([data-field="fields"], [data-field="request"], [data-field="response"]) th:nth-child(3) {
  white-space: nowrap;
}
.detail-section .state-diagram, .detail-section .evidence-list, .relation-groups ul { list-style: none; padding: 0; }
.state-diagram li, .step-links { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.state-diagram small { color: var(--muted); }
.state-node, .chosen { background: var(--accent-bg); color: var(--accent); padding: 1px 6px; border-radius: 4px; }
.chosen { margin-left: 6px; font-size: 12px; }
.body-row { margin-block: 3px; }
.body-row > .muted { font-size: 12px; }
.media-list { display: grid; gap: 12px; }
figure img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; }
figcaption { margin-top: 5px; color: var(--muted); font-size: 12px; }
.callout { display: flex; align-items: start; gap: 7px; padding: 9px; border-radius: 6px; background: var(--paper); }
.callout[data-tone="warn"] svg { color: var(--warn); }
.evidence-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 5px; align-items: center; }
.evidence-row small { display: block; }
.source-path { overflow-wrap: anywhere; }
.implementation-detail { display: grid; gap: 5px; }
.relation-groups .detail-section:first-child { border-top: 0; padding-top: 0; }
.relation-groups .detail-section:last-child { padding-bottom: 0; }
.relation-note { display: block; color: var(--muted); font-size: 12px; }
.detail-section .child-list { list-style: none; padding: 0; }
.detail-section[data-field="children"] h3 .count { margin-left: 6px; }
.search-directory { margin-top: 8px; }
.browse-pages {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.browse-pages .tool { border-color: var(--line); }

#browse {
  width: min(540px, calc(100% - 24px));
  max-height: min(620px, calc(100% - 32px));
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 10px 40px #0003;
}
#browse[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); }
#browse::backdrop { background: #10192866; }
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 15px;
  border-bottom: 1px solid var(--line);
}
.panel-header h2 { font-size: 17px; }
#browse-body { padding: 12px 15px; overflow: auto; }
.search-field {
  display: flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding-inline: 9px;
  color: var(--muted);
}
.search-field input { background: transparent; border: none; height: 40px; min-width: 0; flex: 1; }
.search-clear { display: none; }
.search-contents output { display: block; font-size: 12px; padding-top: 6px; }
.search-result { display: grid; grid-template-columns: auto 1fr auto; gap: 9px; }
.search-result, .tree-object { padding: 7px 5px; align-items: center; color: var(--ink); text-decoration: none; }
.search-result:hover, .tree-object:hover { background: var(--accent-bg); color: var(--accent); border-radius: 5px; }
.search-result small { display: block; margin-top: 2px; overflow-wrap: anywhere; }
.tree-list { list-style: none; padding: 0; }
.tree-list .tree-list { margin-left: 13px; padding-left: 7px; border-left: 1px solid var(--line); }
.tree-row { display: flex; align-items: center; gap: 6px; min-height: 37px; }
.tree-row .tool { min-height: 26px; padding: 3px; }
.tree-indent { width: 24px; flex: none; }
.tree-object { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tree-row .type-mark { width: 23px; height: 23px; }

#view-content { height: 100%; overflow: auto; touch-action: pan-y; }
.empty-scene {
  min-height: 100%;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 14px;
  padding: 24px;
}
.empty-scene h2 { font-size: 18px; color: var(--muted); text-align: center; }
.empty-art { width: 160px; height: 108px; }
.empty-zone { fill: var(--zone); stroke: var(--edge); stroke-dasharray: 4 3; }
.empty-lines { stroke: var(--edge); fill: none; }
.empty-node { fill: var(--surface); stroke: var(--edge); }
.flow-index { list-style: none; width: min(100%, 410px); padding: 0; }
.flow-index li { display: flex; gap: 7px; align-items: center; border-top: 1px solid var(--line); padding: 8px 0; }
.flow-index small { margin-left: auto; }

@media (max-width: 760px) {
  /* Two rows: name and tools, then the entries with the version at the far end. */
  .topbar { grid-template-columns: 32px minmax(0, 1fr) auto; gap: 6px 8px; padding: 7px 12px; }
  .brand { display: contents; }
  .brand strong { font-size: 15px; }
  #rev { grid-column: 3; grid-row: 2; justify-self: end; font-size: 10px; padding-inline: 6px; }
  .tools { gap: 2px; }
  .tools .tool { padding: 4px 6px; }
  #readings { grid-column: 1 / span 2; grid-row: 2; justify-self: start; }
  .read-mode { min-height: 27px; padding: 2px 10px; }
  .location { padding: 1px 11px; }
  #view-facts {
    flex-wrap: nowrap;
    margin-inline: -16px;
    padding-inline: 16px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .fact { flex: none; flex-wrap: nowrap; }
  #hint { display: none; }
  .crumb { max-width: 66vw; }
  .view-heading { padding: 13px 16px 10px; gap: 6px; }
  .view-heading h1 { font-size: 21px; }
  .view-heading p { line-height: 1.4; }
  #controls { padding: 4px 10px; min-height: 45px; flex-wrap: wrap; gap: 3px; }
  #selection { width: 100%; }
  #selection-title { flex: 1; }
  #detail {
    position: fixed;
    inset: 0;
    width: 100%;
    min-height: 0;
    border-left: 0;
  }
  #browse-body { padding: 9px; }
  .tree-list .tree-list { margin-left: 7px; padding-left: 5px; }
  .tree-row { gap: 3px; }
  .tree-row .design-status, .tree-row .implementation-status { font-size: 11px; }
}

@media (pointer: coarse), (max-width: 640px) {
  .tool, #rev, .tree-row .tool, .read-mode, button.crumb, a:not(.inline-reference), .search-field input {
    min-width: 44px;
    min-height: 44px;
  }
  .tools .tool { justify-content: center; }
  .search-field input { font-size: 16px; }
  .search-field input::-webkit-search-cancel-button { display: none; }
  .search-clear { display: inline-flex; }
  .search-field input:placeholder-shown + .search-clear { visibility: hidden; }
  .tree-indent { width: 44px; }
  .tree-list .tree-list { margin-left: 4px; padding-left: 3px; }
  .object-link:not(.inline-reference), a.source-path { display: inline-flex; align-items: center; }
  .detail-meta { min-height: 44px; padding-right: 50px; }
  .detail-section[data-field="actor"] > .object-link, .body-row > .object-link { margin-inline-start: 5px; }
  span.edge-label { pointer-events: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

.read-mode { min-width: 0; }
.reading-badge, .card-change {
  color: var(--accent);
  background: var(--accent-bg);
  border-radius: 4px;
  padding: 0 4px;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}
.card-change { white-space: nowrap; }
.detail-comment { justify-self: start; }
body:not([data-reading="map"], [data-reading="flow"]) #viewport {
  background: var(--paper);
  touch-action: pan-y;
}
body[data-reading="progress"] { --reading-width: 1000px; }
body[data-reading="decisions"] { --reading-width: 940px; }
#reading { --reading-inset: 30px; }
.reading-page {
  width: min(100%, var(--reading-width, 1140px));
  margin-inline: auto;
  padding: 0 var(--reading-inset) 36px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}
.reading-page h2 { font-size: 18px; }
.reading-page h3 { font-size: 14px; }
.reading-page :is(ul, ol), .change-archive { padding: 0; list-style: none; }
.reading-toolbar, .reading-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.reading-toolbar { align-items: end; margin-bottom: 16px; }
.reading-toolbar output { align-self: end; padding: 7px 2px; }
.reading-field { display: grid; gap: 4px; min-width: 0; }
.reading-field span { color: var(--muted); font-size: 13px; }
.reading-field :is(select, textarea) {
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  font: inherit;
  padding: 6px 8px;
  min-width: 0;
  max-width: 100%;
}
.reading-field select { width: min(100%, 190px); min-height: 35px; }
.reading-field :is(select, textarea):focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.reading-toolbar .tool, .reading-actions .tool, .decision-form .tool { border-color: var(--line); }
.reading-toolbar button:disabled { opacity: .65; cursor: default; }
.reading-empty {
  min-height: 210px;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 6px;
  padding: 18px 0;
  text-align: center;
  color: var(--muted);
}
.reading-link { color: var(--accent); white-space: normal; text-align: start; justify-content: start; }
.reading-link[aria-current] { background: var(--accent-bg); }
.inventory-section { padding-block: 12px 18px; border-top: 1px solid var(--line); }
.inventory-section h2 { margin-bottom: 8px; }
.inventory-table { background: var(--surface); table-layout: fixed; }
.inventory-table th:first-child { width: 22%; }
.inventory-table th:last-child { width: 14%; }
.inventory-table :is(th, td) { vertical-align: middle; }
.inventory-table td:first-child { font-weight: 650; padding: 0 4px; }
.inventory-table tbody tr { cursor: pointer; }
.inventory-table tbody tr:hover { background: var(--accent-bg); }
.inventory-cell-label { display: none; }


.progress-group { padding: 11px 0 14px; border-top: 1px solid var(--line); }
.progress-group h3 { margin-top: 4px; }
.progress-bar { display: flex; gap: 2px; margin: 6px 0 2px; }
.progress-bar span {
  flex-basis: 0;
  min-width: 2em;
  text-align: center;
  background: var(--zone);
  border: 1px solid var(--line);
  font-weight: 650;
}
.progress-bar [data-state="partial"] { color: var(--warn); border-color: var(--warn); }
.progress-bar [data-state="implemented"] { color: var(--good); border-color: var(--good); }
.progress-bar [data-state="stale"] { color: var(--warn); border-color: var(--warn); border-style: dashed; }
.progress-bar [data-state="planned"] { color: var(--accent); background: var(--accent-bg); }
.reading-notice { color: var(--warn); }
.progress-counts { display: flex; flex-wrap: wrap; gap: 4px; }
.progress-count { font-variant-numeric: tabular-nums; }
.reading-object-list { padding: 0; list-style: none; }
.review-evidence {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) auto;
  align-items: center;
  gap: 6px;
}

.changes-page { display: grid; grid-template-columns: minmax(200px, 270px) minmax(0, 1fr); gap: 24px; }
.changes-page > .reading-empty { grid-column: 1 / -1; }
.change-archive li + li { border-top: 1px solid var(--line); }
.change-record {
  display: grid;
  width: 100%;
  justify-items: start;
  justify-content: start;
  padding: 9px;
  white-space: normal;
  text-align: start;
  gap: 2px;
}
.change-record time { font-size: 12px; }
.change-record[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); }
.change-details > .reading-actions { justify-content: space-between; }
.change-section { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
.change-entry { padding: 5px 0; }
.changed-field { margin-block: 5px; padding-inline: 4px; }
.field-path { color: var(--muted); }
.diff-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.diff-cell { border: 1px solid var(--line); background: var(--surface); padding: 6px 9px; border-radius: 6px; }
.diff-cell pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 4px 0 0; font: inherit; }
.diff-cell del { color: var(--warn); background: var(--zone); }
.diff-cell ins { color: var(--good); background: var(--zone); font-weight: 650; }

.decision-queue { padding-bottom: 18px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
.decision-queue .reading-actions { margin: 8px 0; }
.decision-row, .decision-item {
  border-top: 1px solid var(--line);
  padding: 9px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}
.decision-row:first-child { margin-top: 8px; }
.decision-object { flex: 1 1 280px; min-width: 0; }
.decision-object .reading-link { padding-inline: 0 7px; font-weight: 650; }
.decision-recorded { color: var(--accent); font-size: 12px; }
.decision-conclusion { margin-top: 4px; font-weight: 650; }
.decision-item code { font-size: 11px; }
.decision-form { display: grid; gap: 10px; }
.decision-form button { justify-self: end; }
.decision-copy { width: 100%; }

@media screen {
  body:not([data-reading="map"], [data-reading="flow"]) .view-heading {
    padding-inline: 0;
    overflow: hidden;
  }
  body:not([data-reading="map"], [data-reading="flow"]) .view-heading > div {
    width: min(100%, var(--reading-width, 1140px));
    margin-inline: auto;
    padding-inline: var(--reading-inset);
  }
  body:not([data-reading="map"], [data-reading="flow"]) :is(.view-heading, #view-content) {
    scrollbar-gutter: stable both-edges;
  }
}

@media (max-width: 760px) {
  #reading { --reading-inset: 14px; }
  .reading-page { padding-bottom: 24px; }
  .reading-page .tool, .reading-field select, .read-mode, .detail-comment,
  .decision-form button, #browse[data-panel="decision-copy"] button,
  #browse[data-panel="decision-form"] button,
  #browse[data-panel="progress"] button { min-width: 44px; min-height: 44px; }
  .reading-toolbar .reading-field { flex: 1 1 120px; }
  .reading-toolbar .reading-field select { width: 100%; }
  .inventory-table, .inventory-table tbody, .inventory-table tr, .inventory-table td { display: block; }
  .inventory-table thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .inventory-table tbody tr { display: grid; gap: 2px; border-top: 1px solid var(--line); padding: 3px 6px 8px; }
  .inventory-table td { border: 0; padding: 1px 5px; }
  .inventory-table td:not(:first-child) { display: grid; grid-template-columns: minmax(64px, 23%) 1fr; gap: 6px; }
  .inventory-cell-label { display: inline; color: var(--muted); }
  .changes-page { display: block; }
  .review-evidence { grid-template-columns: minmax(0, 1fr) auto; }
  .review-evidence code { grid-row: 2; }
  .change-archive { max-height: 162px; overflow: auto; margin-bottom: 10px; }
  .decision-form :is(select, textarea), .decision-copy, .reading-field select { font-size: 16px; }
}
</style>

f":"skills/arkigo/scripts/arkigo.mjs","symbol":"parse 与命令分发"},{"kind":"file","ref":"skills/arkigo/scripts/page.mjs","symbol":"buildPage"}]},{"id":"practice.code-boundary","type":"rule","title":"维护命令、模型与浏览器的边界","summary":"入口只解析和分发，共用文件与校验逻辑独立，浏览器只消费生成时快照。","parent":"practice","status":"accepted","origin":"doc","body":{"constraint":"命令处理器分文件，模型、路径、锁、修改项、查询及依据核对在共享代码。页面生成器接收已校验的数据；运行时、样式与排版在 assets，Schema 单独维护。源码一行最多 120 字符，不留注释掉的代码、不用的导出、调试输出和临时文件。","when":"维护仓库源码时"},"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 2、9 节"},{"kind":"file","ref":"skills/arkigo/scripts/arkigo.mjs","symbol":"入口分发"},{"kind":"file","ref":"skills/arkigo/scripts/page.mjs","symbol":"buildPage"}],"implementation":{"evidence":[{"checkedAt":"2026-11-21T04:21:26.329Z","hash":"c08fefadc518fcf668ba50159855fb332fd2d53e49ecd0f783e4447cce502fdc","path":"skills/arkigo/scripts/arkigo.mjs","symbol":"入口分发"},{"checkedAt":"2026-11-21T04:21:26.329Z","hash":"55609dbd85b09f717c1fe622f86a155d8547bc5cf2648250c89556f428585c7b","path":"skills/arkigo/scripts/page.mjs","symbol":"buildPage"}],"note":"各模块边界已落地；现有源码有超过 120 字符的行，代码风格需要审阅。","status":"partial"}},{"id":"practice.design-review","type":"acceptance","title":"现状设计有可追溯出处","summary":"各模块可定位职责、出处、验收，未知问题带选项。","parent":"practice","status":"accepted","origin":"doc","body":{"given":["已有代码、文档和用户决定"],"then":["各模块可定位职责、出处、验收，未知问题带选项。"],"when":"按已有项目路线建档，再用 query、context、export md、check 和 verify 回读"},"sources":[{"kind":"file","ref":"skills/arkigo/references/existing-system.md","symbol":"三种信息分开记、步骤"},{"kind":"file","ref":"skills/arkigo/references/content.md","symbol":"核对原有资料没有漏掉、交付前自己读一遍"}],"verification":{"checkedAt":"2026-11-20T15:19:26.953Z","note":"从用户、旧文档和已阅读的代码建档；用 query、context、export md、check、verify 回读，五个模块在 65,536 字节预算下无省略。设计提醒对应未决项。","status":"passed"}},{"id":"practice.develop","type":"flow","title":"从开工材料到实现回写","summary":"开发前取范围，写完登记代码位置和实际验收，代码变化后复查依据。","parent":"practice","status":"accepted","origin":"doc","body":{"ends":["record"],"start":"read","steps":[{"action":"AI 用 query 找 ID，以 context 读规则、接口、验收和决定。","actor":"assistant","failure":"材料不足则续读；被未决项挡住时交给用户，继续不受影响的工作。","id":"read","title":"读取材料"},{"action":"按明确要求改设计再开工；AI 提议等待拍板。","actor":"assistant","id":"align","title":"对齐方案"},{"action":"AI 按规则写代码并执行验收。","actor":"assistant","failure":"未运行保持未验证，失败记录实际结果。","id":"code","title":"实现和验证"},{"action":"AI 用 change 的 implement 和 verify 修改项回写，代码再变时复查。","actor":"assistant","id":"record","title":"回写记录"}],"transitions":[{"from":"read","to":"align"},{"from":"align","to":"code"},{"from":"code","to":"record"}],"trigger":"用户要求改功能或继续开发。"},"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 1、4.6、11.1 节"},{"kind":"file","ref":"skills/arkigo/references/loop.md","symbol":"写代码之前、写完代码之后、用户在页面上拍板之后"},{"kind":"file","ref":"skills/arkigo/SKILL.md","symbol":"分工、先看这次是哪种情况、没定的事交给用户"}],"implementation":{"evidence":[{"checkedAt":"2026-11-21T04:21:26.329Z","hash":"2934a3f5236f07c65c8b5db49775c1655e673b33444e8ef7c3473a5db53106d2","path":"skills/arkigo/references/loop.md","symbol":"写代码之前、写完代码之后、用户在页面上拍板之后"},{"checkedAt":"2026-11-21T04:21:26.329Z","hash":"310b097d52ed63caba615585e39fc19900104a7a0d81ce055bc068fe18c074d0","path":"skills/arkigo/SKILL.md","symbol":"分工、先看这次是哪种情况、没定的事交给用户"},{"checkedAt":"2026-11-21T04:21:26.329Z","hash":"687f8c5969a65c4ed3eafbe52abd5aa04e1e374e249aa60801c9a9b536b88e17","path":"skills/arkigo/scripts/lib/operations.mjs","symbol":"apply"}],"status":"implemented"}},{"id":"practice.feedback","type":"flow","title":"把页面拍板交回项目","summary":"用户在浏览器暂存操作，再交 AI 核对版本、应用决定并处理批注。","parent":"practice","status":"accepted","origin":"doc","body":{"ends":["apply"],"start":"make","steps":[{"action":"用户从待拍板选择或从对象详情写批注，可以撤销。","actor":"person","failure":"浏览器不能保存时可直接复制或导出。","id":"make","title":"暂存操作"},{"action":"用户交回文字或决定文件；AI 读取所见 rev、对象和理由。","actor":"person","id":"handoff","title":"复制或导出"},{"action":"AI 检查相关对象在所见版本后是否变化，用标题核对零基选项。","actor":"assistant","failure":"对象已变化时请用户确认；文件可先 dry-run，文字用 --base 核对。","id":"review","title":"核对变化"},{"action":"AI 写入接受、作废或选择并保留理由。明确批注按要求改，需设计则提议，是问题则回复；根据结论调整被卡住的内容。","actor":"assistant","id":"apply","title":"应用并跟进"}],"transitions":[{"from":"make","to":"handoff"},{"from":"handoff","to":"review"},{"from":"review","to":"apply"}],"trigger":"用户接受、否决、选择或写批注。"},"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 8.8、11.3 节"},{"kind":"file","ref":"skills/arkigo/references/loop.md","symbol":"写代码之前、写完代码之后、用户在页面上拍板之后"},{"kind":"file","ref":"skills/arkigo/assets/decisions.mjs","symbol":"decisionPrompt、decisionLine"}],"implementation":{"evidence":[{"checkedAt":"2026-11-21T04:21:26.329Z","hash":"2934a3f5236f07c65c8b5db49775c1655e673b33444e8ef7c3473a5db53106d2","path":"skills/arkigo/references/loop.md","symbol":"写代码之前、写完代码之后、用户在页面上拍板之后"},{"checkedAt":"2026-11-21T04:21:26.329Z","hash":"d408245f7ca7d2ff6d5271e3fe9f6add504e23d76cf3fffadd1ae961b1dcd473","path":"skills/arkigo/assets/decisions.mjs","symbol":"decisionPrompt、decisionLine"},{"checkedAt":"2026-11-21T04:21:26.329Z","hash":"687f8c5969a65c4ed3eafbe52abd5aa04e1e374e249aa60801c9a9b536b88e17","path":"skills/arkigo/scripts/lib/operations.mjs","symbol":"applyDecisions"}],"status":"implemented"}},{"id":"practice.handoff","type":"interface","title":"项目规则与拍板指令","summary":"项目规则约定代码前后同步设计；拍板指令写明所见版本和后续动作。","parent":"practice","status":"accepted","origin":"code","body":{"kind":"other","signature":"init 写规则片段；页面「复制给 AI」输出包含对象和 rev 的纯文本"},"notes":[{"lang":"markdown","text":"\u003c!-- arkigo:start -->\n## 项目设计\n\n这个项目的设计只有一份，放在 `{dir}/design.json`，由 ArkiGo 技能管理。需求、模块、流程、规则、数据、接口、界面、验收和还没定的问题都在里面，项目里没有另外的需求文档和设计文档；用户通过 `{dir}/index.html` 阅读和拍板。设计和代码对得上，这份设计才有用，所以每次改代码请按下面的顺序做。\n\n- 动手之前先读设计。用 arkigo 技能的 `context \u003c对象id>` 取得要改的那部分的材料，里面有它的规则、验收、数据、接口和还没定的问题；不知道对象 id 时先用 `query --search \u003c关键词>` 找。\n- 要做的事设计里没有，或者和设计不一致时，先用 `change` 把设计改成要做的样子，再写代码。用户已经明确要求的改动可以改完设计直接开工；你自己提出的改动保持「提议」状态，告诉用户改了什么，等用户认可。\n- 写完代码后回写。用 `change` 记录实现情况和代码位置；实际跑过的验收记录结果，没跑过的不要写成通过。\n- 被设计里还没定的问题挡住时，停下来问用户，不要替用户选。\n- `design.json` 只通过 arkigo 技能的命令修改，不要直接编辑；也不要另写需求文档或设计文档，该写的内容写进设计。\n\u003c!-- arkigo:end -->","title":"项目规则片段","type":"code"},{"lang":"text","text":"我在 ArkiGo 页面上做了下面这些决定，请用 arkigo 技能把它们写进设计。\n\n设计目录：{dir}\n我看到的版本：{rev}\n\n1. 接受「{标题}」（{id}）\n2. 否决「{标题}」（{id}）。理由：{理由}\n3. 「{问题}」（{id}）选第 {序号} 项「{选项标题}」。理由：{理由}\n4. 对「{标题}」（{id}）的批注：{批注}\n\n请这样处理：接受、否决和选择直接用 change 写入，原因写「用户在页面上拍板」。批注是我的意见，请先读相关内容再处理：意见明确的按它修改；需要你来设计、或有不止一种改法的，把你的方案作为提议写进设计，等我确认。如果设计现在的版本和我看到的不一样，先看这几个对象有没有变化，变了的先问我再写。做完后告诉我写入了哪些、哪些没写入以及原因。","title":"拍板复制模板","type":"code"},{"text":"init 在 AGENTS.md 和已存在的 CLAUDE.md 写入标记范围，保留外围字节；--no-rules 跳过。开工材料开头见 [[reading.context]]。决定文字依操作顺序编号，选项序号从 1 开始，文件和 decide 从 0 开始。没有理由时省去理由半句。","type":"text"},{"text":"以上是指定原文。实际 init 生成片段末句的「或」为「和」，参见 [[practice.init-wording]]。","tone":"warn","type":"callout"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 11.1、11.3 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/init.mjs","symbol":"rules、updateRules"},{"kind":"file","ref":"skills/arkigo/assets/decisions.mjs","symbol":"decisionPrompt、decisionLine"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:10:13.992Z","hash":"89db40a174c416a4a2d4f519ce69470ce14101a3cc5ced46b1decb1fd990b4ba","path":"skills/arkigo/scripts/commands/init.mjs","symbol":"rules、updateRules"},{"checkedAt":"2026-11-20T15:10:13.992Z","hash":"d408245f7ca7d2ff6d5271e3fe9f6add504e23d76cf3fffadd1ae961b1dcd473","path":"skills/arkigo/assets/decisions.mjs","symbol":"decisionPrompt、decisionLine"}],"status":"implemented"}},{"id":"practice.init-wording","type":"decision","title":"项目规则末句的措辞","summary":"总纲写「需求文档或设计文档」，init 生成的片段写了「需求文档和设计文档」。","parent":"practice","status":"proposed","origin":"ai","body":{"options":[{"detail":"生成器改回「或」，用总纲文字回归比对。","title":"恢复总纲原文"},{"detail":"由固定文字的作者确认并统一依据，再校对此后生成的项目规则。","title":"确认生成器措辞"}],"question":"项目规则末句恢复总纲的「或」，还是由固定文字的作者确认「和」并同步定稿？"},"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 11.1 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/init.mjs","symbol":"rules"}]},{"id":"practice.install","type":"interface","title":"install 复制独立技能","summary":"复制运行包和许可证到新目录，输出安装运行依赖的命令。","parent":"practice","status":"accepted","origin":"code","body":{"kind":"cli","signature":"install \u003c新目标目录> | install --user"},"notes":[{"text":"需要 Node.js 22 或以上。复制 SKILL.md、LICENSE、包清单和锁文件、scripts、references、assets、schemas。目标已存在或在技能内时拒绝。--user 使用 CODEX_HOME 或用户目录下的 .codex/skills/arkigo。","type":"text"},{"lang":"sh","text":"npm ci --omit=dev --ignore-scripts --no-audit --no-fund","title":"在安装目录执行","type":"code"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 2、9 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/install.mjs","symbol":"install、files"},{"kind":"file","ref":"LICENSE","symbol":"MIT License"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:10:13.992Z","hash":"ad87dab2fd8c0f6fd8c1543e22a4ffa2de6b0b10f77f5f5f46a5700027d149c2","path":"skills/arkigo/scripts/commands/install.mjs","symbol":"install、files"},{"checkedAt":"2026-11-20T15:10:13.992Z","hash":"4c9d61f60965105e10070c6e260c3315d26385950927c88f68afb3951bc6b11a","path":"LICENSE","symbol":"MIT License"}],"status":"implemented"}},{"id":"practice.install-test","type":"acceptance","title":"独立安装与发布许可回归","summary":"两份许可证相同，安装副本携带许可证，版本为 2.0.0。","parent":"practice","status":"accepted","origin":"code","body":{"given":["系统临时目录内的新技能和新项目"],"then":["两份许可证相同，安装副本携带许可证，版本为 2.0.0。","独立运行可建档、改设计、生成 HTML。"],"when":"运行 core 安装用例，实际 install、npm ci、version、init、change 和 render"},"sources":[{"kind":"file","ref":"skills/arkigo/tests/core/workflow.test.mjs","symbol":"12 arity, duplicate flags, all exit codes and installer behavior"},{"kind":"file","ref":"skills/arkigo/scripts/commands/install.mjs","symbol":"install"}],"verification":{"checkedAt":"2026-11-20T15:14:25.556Z","evidence":[{"kind":"file","ref":"skills/arkigo/tests/core/workflow.test.mjs"},{"kind":"file","ref":"skills/arkigo/scripts/commands/install.mjs"}],"note":"core 安装用例通过；临时目录内 install 后 npm ci，再以独立副本执行 version、init、change、render、check 均成功。许可证逐字节相同。","status":"passed"}},{"id":"practice.license","type":"decision","title":"许可证与版权人","summary":"用户选用 MIT，版权人写「向阳 Yang」。","parent":"practice","status":"accepted","origin":"user","body":{"chosen":0,"decidedAt":"2026-11-20T15:10:13.992Z","decidedBy":"向阳 Yang","options":[{"detail":"仓库根与独立技能包放相同许可证，安装时随技能复制。","title":"MIT，Copyright (c) 2026 向阳 Yang"}],"question":"ArkiGo 采用什么许可证，版权人写谁？","rationale":"用户明确指定 MIT 许可证和版权人写法。"},"sources":[{"kind":"conversation","ref":"2026-11-20 「ArkiGo 方案没问题，开工，许可证用MIT。」"},{"kind":"conversation","ref":"2026-11-20 「版权人写 向阳 Yang」"},{"kind":"file","ref":"LICENSE","symbol":"Copyright 与 MIT License"}]},{"id":"practice.literal-review","type":"acceptance","title":"逐字比对交给 AI 的固定文字","summary":"项目规则、开工材料开头和复制给 AI 的文本都与指定原文一致。","parent":"practice","status":"accepted","origin":"doc","body":{"given":["总纲中的固定模板与实际生成的项目规则、开工开头和拍板指令"],"then":["项目规则、开工材料开头和复制给 AI 的文本都与指定原文一致。"],"when":"替换模板占位符后逐字比对"},"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 11.1–11.3 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/init.mjs","symbol":"rules"},{"kind":"file","ref":"skills/arkigo/scripts/commands/context.mjs","symbol":"prelude"},{"kind":"file","ref":"skills/arkigo/assets/decisions.mjs","symbol":"decisionPrompt"}],"verification":{"checkedAt":"2026-11-20T15:21:28.877Z","note":"逐字核对总纲及实际生成片段，init 末句「需求文档和设计文档」与原文「需求文档或设计文档」不符；context 开头一致。","status":"failed"}},{"id":"practice.provenance","type":"rule","title":"事实、建议和用户决定各有出处","summary":"按已有材料建档，提议需要拍板，未知的问题单独联到受影响对象。","parent":"practice","status":"accepted","origin":"code","body":{"constraint":"明确要求记 user/accepted；代码和文档既成事实记 code 或 doc/accepted 并带出处；建议记 ai/proposed。未知会改变做法时用有选项的决定关联受影响对象。代码与文档冲突时记录现状与两边出处，交用户选择。","when":"AI 写入或核对设计时"},"notes":[{"text":"先读入口、协议和真实调用，再按职责分块。来源说明内容从何处读来，实现依据说明在哪里做到了。尚未阅读的部分标出范围。","type":"text"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 1、2 节"},{"kind":"file","ref":"skills/arkigo/SKILL.md","symbol":"分工、先看这次是哪种情况、没定的事交给用户 "origin":"code","body":{"kind":"cli","signature":"check [--under \u003cID>] [--strict]"},"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 6、7 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/check.mjs","symbol":"check"},{"kind":"file","ref":"skills/arkigo/scripts/lib/warnings.mjs","symbol":"warningsFor"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"c33413b4afe3e8a036e5970f0f3967e77050006495d693366ea7a7d8de125f80","path":"skills/arkigo/scripts/commands/check.mjs","symbol":"check"},{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"c4f8f220a975228807a08b9b0a7fdfbcf4266241feec0afc33b96c0aaecfa23c","path":"skills/arkigo/scripts/lib/warnings.mjs","symbol":"warningsFor"}],"status":"implemented"}},{"id":"reading.cli","type":"interface","title":"命令入口与通用回执","summary":"一个 Node 入口分发 13 条命令，机器可区分成功、内容问题、用法和版本冲突。","parent":"reading","status":"accepted","origin":"code","body":{"errors":[{"code":"0","when":"成功；非严格 check 有提醒也成功。"},{"code":"1","when":"内容问题，包括校验失败、依据需复查及严格检查出现提醒。"},{"code":"2","when":"用法、依赖或读写错误。"},{"code":"3","when":"change 的 --base 与当前版本冲突。"}],"kind":"cli","signature":"node \u003cskill-dir>/scripts/arkigo.mjs \u003c命令> [参数]"},"notes":[{"text":"有效命令为 init、query、change、history、diff、check、verify、context、render、export、layout、version、install。未知或重复参数、位置参数数量不符会报错。","type":"text"},{"text":"标准输出使用单行紧凑 JSON；context 和不带 --out 的 export md 输出 Markdown。错误用 stderr 的单行 JSON（ok、code、message 和诊断）。版本与安装的技能路径或目标位置是本机绝对路径；项目内回执通常用相对路径。","type":"text"},{"text":"query、history、diff、check、verify 支持 --offset、--limit（1–100）和 --max-bytes（1024–65536）。默认 20 项和 12,000 UTF-8 字节，含换行。nextOffset 标记续读；omitted 也可能指已跳过前页或当前行只提供身份。context 只有 --max-bytes，默认 24,000。","type":"text"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 2、7、9 节"},{"kind":"file","ref":"skills/arkigo/scripts/arkigo.mjs","symbol":"parse 与命令分发"},{"kind":"file","ref":"skills/arkigo/scripts/lib/output.mjs","symbol":"page、preview"},{"kind":"file","ref":"skills/arkigo/scripts/lib/commands.mjs","symbol":"commands"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"c08fefadc518fcf668ba50159855fb332fd2d53e49ecd0f783e4447cce502fdc","path":"skills/arkigo/scripts/arkigo.mjs","symbol":"parse 与命令分发"},{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"c50da4acceb297d47644e907f659802aad76faa9ad46bcfb0f0e1e294406c6da","path":"skills/arkigo/scripts/lib/output.mjs","symbol":"page、preview"},{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"86f6a7b64cee8cf3ec0d6f9d0b206b71a876431d5988b53547f8984802846c40","path":"skills/arkigo/scripts/lib/commands.mjs","symbol":"commands"}],"status":"implemented"}},{"id":"reading.context","type":"interface","title":"context 取开工材料","summary":"限定 Markdown 字节数，给 AI 目标、规则、验收、相关数据和代码位置。","parent":"reading","status":"accepted","origin":"code","body":{"kind":"cli","signature":"context \u003cID> [--max-bytes \u003c字节数>]"},"notes":[{"columns":["段落顺序","采集范围"],"rows":[["1. 目标对象","目标的完整内容。"],["2. 树中位置、项目目标与范围","祖先路径，以及系统目标和范围。"],["3. 直接下级","每个直接下级的标题、ID 和摘要。"],["4. 相关规则","目标及各层下级的 governed_by 目标，步骤端点归到所属流程。"],["5. 相关验收","指向目标及各层下级的 verifies 来源，带结果。"],["6. 数据与接口","从目标发出的 reads、writes、calls 中符合类型的对象，以及直接下级接口和被调用的目标接口。"],["7. 双向依赖","与目标直接相连的 depends_on 另一端摘要。"],["8. 未决问题","blocks 直接指向目标的未决项。"],["9. 实现情况与依据","目标及已收进材料的对象，列状态、说明、路径、符号和复查状态。"],["10. 省略清单","报告被压缩或省掉的项目和取回命令。"]],"type":"table"},{"text":"预算不足时依次缩减依赖摘要、下级摘要、数据和接口字段，按块截短目标说明，然后整条移走规则、验收和未决问题。再改清单为数量，必要时继续删辅助段落、缩短目标正文；极端输入退到标题或摘要加字段取回命令。","type":"text"},{"lang":"markdown","text":"# 开工材料：{对象标题}\n\n这是设计里「{对象标题}」（`{对象id}`）及其相关内容，取自设计版本 `{rev}`。实现时以其中的规则和验收为准；标为未决的问题由用户决定，不要自行选择；这里没有列出的内容见末尾的省略清单。写完代码后用 `change` 回写实现情况和验收结果。","title":"交给 AI 的开头","type":"code"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 7.2、11.2 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/context.mjs","symbol":"context"},{"kind":"file","ref":"skills/arkigo/scripts/lib/context-budget.mjs","symbol":"fitContext、fieldCommand"},{"kind":"file","ref":"skills/arkigo/scripts/lib/markdown.mjs","symbol":"objectMarkdown、prose"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"fb72848272b8fdd9baa3377b2b1913df6edfbc823eb49ee54bee8c4d3b1ff587","path":"skills/arkigo/scripts/commands/context.mjs","symbol":"context"},{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"16d3c8564afb2f61cefc7453f86414aa165166d2b01f0fcdf8d23ce205c9a906","path":"skills/arkigo/scripts/lib/context-budget.mjs","symbol":"fitContext、fieldCommand"},{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"aab104cc26bacad82bef03036549682cc8dcf2f4a764e0966e8e83dae467c1b8","path":"skills/arkigo/scripts/lib/markdown.mjs","symbol":"objectMarkdown、prose"}],"status":"implemented"}},{"id":"reading.context-reach","type":"decision","title":"开工材料应取哪些后代关系","summary":"目前规则、验收遍历后代，数据接口和未决问题只按目标附近的关系采集。","parent":"reading","status":"proposed","origin":"ai","body":{"options":[{"detail":"精确目标较短，模块级任务要继续打开下级对象。","title":"保留当前范围并解释"},{"detail":"模块级材料更完整，需要设计超预算时的优先级和续读指引。","title":"扩大采集范围"}],"question":"模块级开工材料是否也要列出各层下级的数据接口和未决问题？"},"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 7.2 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/context.mjs","symbol":"context"},{"kind":"file","ref":"skills/arkigo/references/commands.md","symbol":"context"}]},{"id":"reading.diagnostics","type":"rule","title":"检查提示只指出可见缺口","summary":"程序给提示和定位，不给设计评分或替作者判断是否完整。","parent":"reading","status":"accepted","origin":"code","body":{"constraint":"提示包含代码、对象 ID 和一句说明。普通 check 和 change 不因提醒失败；check --strict 有提醒时以 1 返回。","when":"check 或 change 报告提醒时"},"notes":[{"columns":["代码","含义"],"rows":[["SYSTEM_INCOMPLETE","系统缺用户、目标或范围。"],["THIN_MODULE","模块没有职责也没有下级。"],["FLOW_NO_FAILURE","流程没有一步写失败处理。"],["RULE_NO_ACCEPTANCE","规则没有验收指向它。"],["ACCEPTED_BUT_BLOCKED","已接受对象连到一个未决阻塞。"],["OPEN_DECISION","待定项没有选项结论。"],["SUMMARY_LONG","摘要超过 90 字符。"],["NO_SOURCE","代码或文档来源缺出处。"],["UNUSED_ENTITY / UNUSED_INTERFACE","没有关系指向该数据或接口。"],["NOT_CHECKED","可实现对象没有实现记录。"],["STALE_EVIDENCE","内容出处已缺失，或实现依据缺失、指纹变化。"]],"type":"table"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 6 节"},{"kind":"file","ref":"skills/arkigo/scripts/lib/warnings.mjs","symbol":"warningsFor"},{"kind":"file","ref":"skills/arkigo/scripts/commands/check.mjs","symbol":"check"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"c4f8f220a975228807a08b9b0a7fdfbcf4266241feec0afc33b96c0aaecfa23c","path":"skills/arkigo/scripts/lib/warnings.mjs","symbol":"warningsFor"},{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"c33413b4afe3e8a036e5970f0f3967e77050006495d693366ea7a7d8de125f80","path":"skills/arkigo/scripts/commands/check.mjs","symbol":"check"}],"status":"implemented"}},{"id":"reading.diff","type":"interface","title":"diff 比较两份内容","summary":"按稳定 ID 比对两份设计，列对象字段和关系变化。","parent":"reading","status":"accepted","origin":"code","body":{"kind":"cli","signature":"diff \u003c另一份 design.json>"},"notes":[{"text":"before 是当前设计，after 是给定文件；比较不写入。文件必须符合当前项目的设计和相对资源约定。","type":"text"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 7 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/diff.mjs","symbol":"diff"},{"kind":"file","ref":"skills/arkigo/scripts/lib/changes.mjs","symbol":"changesBetween、fieldsChanged"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"0bb62c4f1e19728ee80ecb4779880686ad6d3452b1529edcc8a632e4281a535b","path":"skills/arkigo/scripts/commands/diff.mjs","symbol":"diff"},{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"947811b1554910b77ff6fa9e8aef2853593cd2056f2c99e45d6edd0e23f85fd9","path":"skills/arkigo/scripts/lib/changes.mjs","symbol":"changesBetween、fieldsChanged"}],"status":"implemented"}},{"id":"reading.export","type":"interface","title":"export md 导出文档","summary":"按文档顺序导出 Markdown，流程和状态图用 Mermaid。","parent":"reading","status":"accepted","origin":"code","body":{"kind":"cli","signature":"export md [--under \u003cID>] [--out \u003c项目内文件>]"},"notes":[{"text":"默认写 stdout；--out 只允许项目内路径，避免覆盖设计、历史和其他受保护文件，成 o 2.0 升级总纲","symbol":"第 8.11 节"},{"kind":"file","ref":"skills/arkigo/tests/browser/benchmark.mjs","symbol":"40 卡布局、页面可用计时"},{"kind":"file","ref":"skills/arkigo/tests/browser/readings-benchmark.mjs","symbol":"读法切换计时"}],"verification":{"checkedAt":"2026-11-21T04:21:26.329Z","evidence":[{"kind":"file","ref":"skills/arkigo/tests/browser/benchmark.mjs"},{"kind":"file","ref":"skills/arkigo/tests/browser/readings-benchmark.mjs"}],"note":"改版后两份 Chromium 规模脚本各采样 5 次。最大值：可用 174.4ms，40 卡排版 10.0ms，进入流程 26.0ms，清单 159.9ms，进度 67.2ms，变更 74.2ms，待拍板 44.3ms。这组均达标，历史偶发超时仍待决定。","status":"passed"}},{"id":"workspace","type":"module","title":"建档与变更","summary":"创建项目设计；校验并登记每次内容修改，随后重生页面。","parent":"arkigo","group":"产品模块","order":20,"status":"accepted","origin":"code","body":{"boundaries":["业务内容和决定由 AI 与人提供","页面生成失败时保留已成功写入的内容"],"responsibilities":["定位项目和设计目录","读取并成组执行修改项","持久化设计、历史和布局，管理写锁","导入用户的决定文件"]},"notes":[{"text":"改写入时先追 [[workspace.apply]] 的锁、候选、发布、页面四段。请求和错误见 [[workspace.change]]，路径和失败边界见 [[workspace.paths]]、[[workspace.atomic]]、[[workspace.refresh]]。涉及导入决定再读 [[workspace.import]]。","title":"从哪里开工","type":"text"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 3、5、7.1、7.3 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/init.mjs","symbol":"init"},{"kind":"file","ref":"skills/arkigo/scripts/commands/change.mjs","symbol":"change"},{"kind":"file","ref":"skills/arkigo/scripts/lib/io.mjs","symbol":"withLock、writeBatch"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T14:57:49.193Z","hash":"89db40a174c416a4a2d4f519ce69470ce14101a3cc5ced46b1decb1fd990b4ba","path":"skills/arkigo/scripts/commands/init.mjs","symbol":"init"},{"checkedAt":"2026-11-20T14:57:49.193Z","hash":"f2b644d97fe91ebb7c8d5bb3d8bea940ea132e1297b3b3b7fd37b39d37bd2b85","path":"skills/arkigo/scripts/commands/change.mjs","symbol":"change"},{"checkedAt":"2026-11-20T14:57:49.193Z","hash":"c9f239540ac6c6f726419ad3105f1c67ee65592dd53c40fe03b47e2c443ff7f8","path":"skills/arkigo/scripts/lib/io.mjs","symbol":"withLock、writeBatch"}],"status":"implemented"}},{"id":"workspace.apply","type":"flow","title":"一次修改怎样生效","summary":"命令加锁、处理候选、保存设计与记录，再根据生效结果刷新页面。","parent":"workspace","status":"accepted","origin":"code","body":{"ends":["preview","page"],"start":"lock","steps":[{"action":"程序读当前设计，规范化并比对可选的 --base。","failure":"锁超时返回用法或读写错误。版本冲突退出 3，AI 重读后再基于新版本准备修改。","id":"lock","title":"取得写锁"},{"action":"程序顺序应用修改项，再校验整个候选。","failure":"操作或校验失败退出 1；设计、历史和页面保持原样。","id":"candidate","title":"应用并校验"},{"action":"程序返回试跑结果或无变化结果，history 为 null。","id":"preview","title":"返回检查结果"},{"action":"程序发布设计及一条字段级变更记录。","failure":"普通写入异常回滚已发布文件；回滚失败单独报告。","id":"write","title":"保存设计与历史"},{"action":"程序把同一 rev 与依据快照交给阅读页并返回状态。","failure":"持久化成功后生成页失败仍返回退出 0，page.ok 为 false，另执行 render。","id":"page","title":"刷新页面"}],"transitions":[{"from":"lock","to":"candidate"},{"from":"candidate","to":"preview","when":"试跑或候选规范字节无变化"},{"from":"candidate","to":"write","when":"正式执行且内容变化"},{"from":"write","to":"page"}],"trigger":"AI 有明确的设计修改，调用 change。"},"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 7.1、7.3 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/change.mjs","symbol":"change、recordPath"},{"kind":"file","ref":"skills/arkigo/scripts/lib/io.mjs","symbol":"withLock、writeBatch、writeAtomic"},{"kind":"file","ref":"skills/arkigo/scripts/lib/render-page.mjs","symbol":"renderPage、regeneratePage、previousEditor"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:01:42.170Z","hash":"f2b644d97fe91ebb7c8d5bb3d8bea940ea132e1297b3b3b7fd37b39d37bd2b85","path":"skills/arkigo/scripts/commands/change.mjs","symbol":"change、recordPath"},{"checkedAt":"2026-11-20T15:01:42.170Z","hash":"c9f239540ac6c6f726419ad3105f1c67ee65592dd53c40fe03b47e2c443ff7f8","path":"skills/arkigo/scripts/lib/io.mjs","symbol":"withLock、writeBatch、writeAtomic"},{"checkedAt":"2026-11-20T15:01:42.170Z","hash":"4c58a0c3e064329ee5c8e7ed1072957ae93f3879bd6a491c68f8140aae72a134","path":"skills/arkigo/scripts/lib/render-page.mjs","symbol":"renderPage、regeneratePage、previousEditor"}],"status":"implemented"}},{"id":"workspace.atomic","type":"rule","title":"同一设计串行写入","summary":"版本冲突、操作或结构校验失败不会发布候选内容。","parent":"workspace","status":"accepted","origin":"code","body":{"constraint":"为设计目录加写锁，等待最多五秒并尝试清理死亡进程留下的锁。写入先落同目录临时文件，再改名替换；新建文件用硬链接避免覆盖。正常写入故障尝试回滚批次。已有内容提交与页面生成分开返回。","when":"初始化、应用内容、生成页面或更改布局时"},"notes":[{"text":"文件替换有原子性；多文件批次通过回滚处理正常异常，没有独立的断电事务。--dry-run 只校验，不写设计、历史或页面；规范字节不变时也一样。","type":"text"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 2、7.1、7.3 节"},{"kind":"file","ref":"skills/arkigo/scripts/lib/io.mjs","symbol":"withLock、writeBatch、writeAtomic"},{"kind":"file","ref":"skills/arkigo/scripts/commands/change.mjs","symbol":"change、recordPath"},{"kind":"file","ref":"skills/arkigo/scripts/lib/render-page.mjs","symbol":"renderPage、regeneratePage、previousEditor"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:01:42.170Z","hash":"c9f239540ac6c6f726419ad3105f1c67ee65592dd53c40fe03b47e2c443ff7f8","path":"skills/arkigo/scripts/lib/io.mjs","symbol":"withLock、writeBatch、writeAtomic"},{"checkedAt":"2026-11-20T15:01:42.170Z","hash":"f2b644d97fe91ebb7c8d5bb3d8bea940ea132e1297b3b3b7fd37b39d37bd2b85","path":"skills/arkigo/scripts/commands/change.mjs","symbol":"change、recordPath"},{"checkedAt":"2026-11-20T15:01:42.170Z","hash":"4c58a0c3e064329ee5c8e7ed1072957ae93f3879bd6a491c68f8140aae72a134","path":"skills/arkigo/scripts/lib/render-page.mjs","symbol":"renderPage、regeneratePage、previousEditor"}],"status":"implemented"}},{"id":"workspace.change","type":"interface","title":"change 应用修改","summary":"从 JSON 修改项或决定文件读入内容，可试跑或检查所读版本。","parent":"workspace","status":"accepted","origin":"code","body":{"errors":[{"code":"BASE_CONFLICT / 3","when":"--base 与当前 rev 不同，重新读取后再决定如何处理。"},{"code":"VALIDATION_FAILED / 1","when":"候选内容有结构或语义错误。"},{"code":"OP_INVALID / 1","when":"修改项形状、字段、类型或目标不允许。"}],"kind":"cli","signature":"change --reason \u003c说明> (--ops \u003c文件|-> | --from-decisions \u003c文件>) [--by \u003c名字>] [--base \u003crev>] [--dry-run]"},"notes":[{"columns":["修改项","作用"],"rows":[["add、move","新增完整对象；调整归属。"],["update","按点分路径 set；用 [id 或 name] 匹配数组元素，[+] 追加，null 删除。保护对象身份、归属字段和结果记录。"],["remove","缺省拒绝带子项或引用的目标。cascade 删除下级和相关关系；遗留正文引用或步骤角色须同组修正。"],["link、unlink","增删关系。移除按 from、type、to 定位。"],["accept、retire","更新设计决定状态。"],["decide","记录从零开始的选项、理由、谁定的和时间；提议同时变为已接受。"],["implement、confirm-evidence","登记实现与 SHA-256，或重新核对刷新指纹；status: null 清除实现记录。planned 需要传 evidence 数组。"],["verify","只为验收写 passed 或 failed；保存时间和可选说明、证据。"]],"type":"table"},{"text":"成功 JSON 包含 ok、rev、base、applied、changed、history、warnings；写入后增加 page，删除时可增加 removed，试跑时 dryRun，决定导入时 decisions。warnings 只列新出现的提醒并限量。","type":"text"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 7、7.1 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/change.mjs","symbol":"change、recordPath"},{"kind":"file","ref":"skills/arkigo/scripts/lib/operations.mjs","symbol":"applyOperations、setPath、remove、applyDecisions"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:01:42.170Z","hash":"f2b644d97fe91ebb7c8d5bb3d8bea940ea132e1297b3b3b7fd37b39d37bd2b85","path":"skills/arkigo/scripts/commands/change.mjs","symbol":"change、recordPath"},{"checkedAt":"2026-11-20T15:01:42.170Z","hash":"687f8c5969a65c4ed3eafbe52abd5aa04e1e374e249aa60801c9a9b536b88e17","path":"skills/arkigo/scripts/lib/operations.mjs","symbol":"applyOperations、setPath、remove、applyDecisions"}],"status":"implemented"}},{"id":"workspace.change-tests","type":"acceptance","title":"更改和并发写入回归","summary":"错误操作、试跑和基线冲突不发布；变更后可读历史。","parent":"workspace","status":"accepted","origin":"code","body":{"given":["已有设计、临时目录及不同基线和失败输入"],"then":["错误操作、试跑和基线冲突不发布；变更后可读历史。","同一写锁协调并行请求；失败的页面生成有独立结果。","旧版本决定中的评论保留、不能应用的动作有报告。"],"when":"运行 npm run test:core 和 npm run test:e2e"},"sources":[{"kind":"file","ref":"skills/arkigo/tests/core/workflow.test.mjs","symbol":"change、锁、布局、版本与安装用例"},{"kind":"file","ref":"skills/arkigo/tests/e2e/workflow.test.mjs","symbol":"自动生成、失败恢复 p":"update","id":"practice.ai-text","fields":["implementation.evidence","implementation.note","implementation.status"],"before":{"id":"practice.ai-text","type":"rule","title":"交给 AI 的说明逐字保持","summary":"项目规则、开工材料开头和拍板复制文本使用固定原文。","parent":"practice","status":"accepted","origin":"code","body":{"constraint":"保留固定原文，只替换目录、版本、对象、选项和理由等占位符。技能指引与这些文字的措辞由用户指定的作者定稿。","when":"生成项目规则、开工 Markdown 或页面复制结果时"},"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 11.1、11.2、11.3 节"},{"kind":"conversation","ref":"2026-11-20 「像提示词，这种关键的信息，你可以亲自写」。交给另一个 AI 执行的文字与技能指引定稿后逐字使用。"},{"kind":"file","ref":"skills/arkigo/scripts/commands/init.mjs","symbol":"rules、updateRules"},{"kind":"file","ref":"skills/arkigo/assets/decisions.mjs","symbol":"decisionPrompt、decisionLine"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:10:13.992Z","hash":"89db40a174c416a4a2d4f519ce69470ce14101a3cc5ced46b1decb1fd990b4ba","path":"skills/arkigo/scripts/commands/init.mjs","symbol":"rules、updateRules"},{"checkedAt":"2026-11-20T15:10:13.992Z","hash":"fb72848272b8fdd9baa3377b2b1913df6edfbc823eb49ee54bee8c4d3b1ff587","path":"skills/arkigo/scripts/commands/context.mjs","symbol":"prelude"},{"checkedAt":"2026-11-20T15:10:13.992Z","hash":"d408245f7ca7d2ff6d5271e3fe9f6add504e23d76cf3fffadd1ae961b1dcd473","path":"skills/arkigo/assets/decisions.mjs","symbol":"decisionPrompt、decisionLine"}],"status":"implemented"}}},{"op":"update","id":"practice.handoff","fields":["notes"],"before":{"id":"practice.handoff","type":"interface","title":"项目规则与拍板指令","summary":"项目规则约定代码前后同步设计；拍板指令写明所见版本和后续动作。","parent":"practice","status":"accepted","origin":"code","body":{"kind":"other","signature":"init 写规则片段；页面「复制给 AI」输出包含对象和 rev 的纯文本"},"notes":[{"lang":"markdown","text":"\u003c!-- arkigo:start -->\n## 项目设计\n\n这个项目的设计只有一份，放在 `{dir}/design.json`，由 ArkiGo 技能管理。需求、模块、流程、规则、数据、接口、界面、验收和还没定的问题都在里面，项目里没有另外的需求文档和设计文档；用户通过 `{dir}/index.html` 阅读和拍板。设计和代码对得上，这份设计才有用，所以每次改代码请按下面的顺序做。\n\n- 动手之前先读设计。用 arkigo 技能的 `context \u003c对象id>` 取得要改的那部分的材料，里面有它的规则、验收、数据、接口和还没定的问题；不知道对象 id 时先用 `query --search \u003c关键词>` 找。\n- 要做的事设计里没有，或者和设计不一致时，先用 `change` 把设计改成要做的样子，再写代码。用户已经明确要求的改动可以改完设计直接开工；你自己提出的改动保持「提议」状态，告诉用户改了什么，等用户认可。\n- 写完代码后回写。用 `change` 记录实现情况和代码位置；实际跑过的验收记录结果，没跑过的不要写成通过。\n- 被设计里还没定的问题挡住时，停下来问用户，不要替用户选。\n- `design.json` 只通过 arkigo 技能的命令修改，不要直接编辑；也不要另写需求文档或设计文档，该写的内容写进设计。\n\u003c!-- arkigo:end -->","title":"项目规则片段","type":"code"},{"lang":"text","text":"我在 ArkiGo 页面上做了下面这些决定，请用 arkigo 技能把它们写进设计。\n\n设计目录：{dir}\n我看到的版本：{rev}\n\n1. 接受「{标题}」（{id}）\n2. 否决「{标题}」（{id}）。理由：{理由}\n3. 「{问题}」（{id}）选第 {序号} 项「{选项标题}」。理由：{理由}\n4. 对「{标题}」（{id}）的批注：{批注}\n\n请这样处理：接受、否决和选择直接用 change 写入，原因写「用户在页面上拍板」。批注是我的意见，请先读相关内容再处理：意见明确的按它修改；需要你来设计、或有不止一种改法的，把你的方案作为提议写进设计，等我确认。如果设计现在的版本和我看到的不一样，先看这几个对象有没有变化，变了的先问我再写。做完后告诉我写入了哪些、哪些没写入以及原因。","title":"拍板复制模板","type":"code"},{"text":"init 在 AGENTS.md 和已存在的 CLAUDE.md 写入标记范围，保留外围字节；--no-rules 跳过。开工材料开头见 [[reading.context]]。决定文字依操作顺序编号，选项序号从 1 开始，文件和 decide 从 0 开始。没有理由时省去理由半句。","type":"text"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 11.1、11.3 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/init.mjs","symbol":"rules、updateRules"},{"kind":"file","ref":"skills/arkigo/assets/decisions.mjs","symbol":"decisionPrompt、decisionLine"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:10:13.992Z","hash":"89db40a174c416a4a2d4f519ce69470ce14101a3cc5ced46b1decb1fd990b4ba","path":"skills/arkigo/scripts/commands/init.mjs","symbol":"rules、updateRules"},{"checkedAt":"2026-11-20T15:10:13.992Z","hash":"d408245f7ca7d2ff6d5271e3fe9f6add504e23d76cf3fffadd1ae961b1dcd473","path":"skills/arkigo/assets/decisions.mjs","symbol":"decisionPrompt、decisionLine"}],"status":"implemented"}}},{"op":"add","id":"practice.init-wording"},{"op":"add","id":"practice.literal-review"},{"op":"update","id":"practice.workflow-tests","fields":["body.then"],"before":{"id":"practice.workflow-tests","type":"acceptance","title":"技能闭环与固定文本回归","summary":"项目规则、开工开头、拍板模板在真实命令与页面中可用。","parent":"practice","sta
