<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' file:">
  <title>ArkiGo</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('arkigo-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch {}
  </script>
  <style>:root {
  --paper: #f8f9fc;
  --surface: #fff;
  --ink: #20253a;
  --muted: #57647c;
  --line: #d7ddea;
  --zone: #eaf0f9;
  --grid: #d9dfec;
  --accent: #2e54aa;
  --accent-bg: #e7eefc;
  --edge: #6f84ad;
  --warn: #964f19;
  --good: #14674f;
  --shadow: 0 6px 18px #233f6d0c;
  color-scheme: light;
  font-family: Inter, ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
}

:root[data-theme="dark"] {
  --paper: #161922;
  --surface: #202533;
  --ink: #ecf0fa;
  --muted: #b0bbd0;
  --line: #3c4658;
  --zone: #1b2230;
  --grid: #2a3345;
  --accent: #adc4ff;
  --accent-bg: #303e60;
  --edge: #899bc0;
  --warn: #ffc189;
  --good: #8bd9bc;
  --shadow: 0 6px 18px #0003;
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --paper: #161922;
    --surface: #202533;
    --ink: #ecf0fa;
    --muted: #b0bbd0;
    --line: #3c4658;
    --zone: #1b2230;
    --grid: #2a3345;
    --accent: #adc4ff;
    --accent-bg: #303e60;
    --edge: #899bc0;
    --warn: #ffc189;
    --good: #8bd9bc;
    --shadow: 0 6px 18px #0003;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: var(--paper);
  color: var(--ink);
  font-size: 14px;
}

button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
button:focus-visible, a:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

svg { width: 18px; height: 18px; vertical-align: middle; flex: none; }
p, h1, h2, h3, ul, ol, figure { margin: 0; }
code { font-family: ui-monospace, "SF Mono", Consolas, monospace; }
.muted { color: var(--muted); }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.topbar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
  padding: 10px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.tools, #crumbs, .tool { display: flex; align-items: center; gap: 8px; }
.tools { justify-content: flex-end; }
.tool, .crumb {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 32px;
  padding: 4px 8px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--muted);
  border-radius: 6px;
  white-space: nowrap;
}
.tool:hover, .crumb:hover { color: var(--accent); background: var(--accent-bg); }
.tool svg { width: 16px; height: 16px; }
.tool.primary { color: var(--accent); background: var(--accent-bg); font-weight: 650; }
#crumbs { min-width: 0; overflow-x: auto; scrollbar-width: none; gap: 3px; }
#crumbs svg { width: 13px; color: var(--muted); }
.crumb { display: block; max-width: min(360px, 60vw); flex: none; overflow: hidden; text-overflow: ellipsis; }
.crumb[aria-current] { font-weight: 650; color: var(--ink); }
.crumb:focus-visible { outline-offset: -2px; }
.count { color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; }

#workspace {
  display: grid;
  grid-template: minmax(0, 1fr) auto / minmax(0, 1fr);
  min-height: 0;
  overflow: clip;
}
#reading { grid-area: 1 / 1 / -1 / -1; display: grid; grid-template-rows: subgrid; min-width: 0; min-height: 0; }
#viewport {
  position: relative;
  min-width: 0;
  min-height: 0;
  overflow: clip;
  touch-action: none;
  background-image: radial-gradient(var(--grid) 1px, transparent 1px);
  background-size: 20px 20px;
}
#viewport:focus { outline: none; }
:root[data-input="keyboard"] #viewport:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
#world, #world *, .empty-scene, .empty-scene *, .scene-ghost {
  -webkit-user-select: none;
  user-select: none;
}
#viewport.panning { cursor: grabbing; }
#world, .scene-ghost { position: absolute; inset: 0; transform-origin: 0 0; }
.scene-ghost { pointer-events: none; }
.graph-zone, .graph-card, .edge-label, .graph-edges { position: absolute; }
.graph-zone {
  z-index: 0;
  background: color-mix(in srgb, var(--surface) 62%, transparent);
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--muted);
  pointer-events: none;
}
.graph-zone > span {
  display: block;
  margin: 11px 16px;
  font-size: 12px;
  font-weight: 600;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.graph-card {
  z-index: 2;
  display: grid;
  grid-template-rows: 25px 21px 37px 19px;
  align-content: start;
  gap: 3px;
  text-align: left;
  border: 1px solid var(--line);
  color: var(--ink);
  background: var(--surface);
  padding: 11px 14px;
  border-radius: 10px;
  box-shadow: var(--shadow);
}
.graph-card[data-enterable="true"] { background: color-mix(in srgb, var(--accent-bg) 38%, var(--surface)); }
.graph-card:hover, .graph-card[aria-pressed="true"] { border-color: var(--accent); }
.graph-card[aria-pressed="true"] { box-shadow: 0 0 0 1px var(--accent); }
.graph-card.card-related { border-color: var(--accent); background: var(--accent-bg); }
.graph-card.dragging { z-index: 4; cursor: grabbing; }
.card-meta, .card-kind, .card-flags, .card-count { display: flex; align-items: center; gap: 5px; }
.card-meta { justify-content: space-between; min-width: 0; font-size: 12px; }
.card-kind { color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; }
.card-title, .card-summary {
  min-width: 0;
  overflow: hidden;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-box-orient: vertical;
}
.card-title { font-size: 16px; line-height: 21px; font-weight: 650; -webkit-line-clamp: 1; }
.card-summary { color: var(--muted); font-size: 13px; line-height: 18px; -webkit-line-clamp: 2; }
.card-flags { align-self: end; color: var(--muted); gap: 8px; }
.card-flags > svg { margin-left: auto; }
.card-flags svg { width: 14px; height: 14px; }
.card-count { font-size: 12px; }
.failure { color: var(--warn); }
.type-mark {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  flex: none;
  background: var(--accent-bg);
  color: var(--accent);
  border-radius: 5px;
}
.type-mark svg { width: 16px; height: 16px; }
.type-mark[data-type="entity"], .type-mark[data-type="acceptance"] { color: var(--good); }
.type-mark[data-type="rule"], .type-mark[data-type="decision"] { color: var(--warn); }
.type-mark[data-type="actor"], .type-mark[data-type="screen"] { color: var(--muted); background: var(--paper); }
.design-status, .step-phase { font-size: 12px; color: var(--muted); white-space: nowrap; }
.step-phase { color: var(--accent); }
.check-status { display: inline-flex; color: var(--muted); }
.check-status[data-state="checked"] { color: var(--good); }
.check-status[data-state="changed"], .check-status[data-state="missing"] { color: var(--warn); }
.graph-edges { z-index: 1; overflow: visible; pointer-events: none; }
.graph-edge, .arrow-tip {
  fill: none;
  stroke: var(--connection-color, var(--edge));
  stroke-width: 1.5px;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.minor-edge { visibility: hidden; }
.minor-edge.edge-selected { visibility: visible; }
.has-selection .graph-edge:not(.edge-selected, .edge-emphasized) { opacity: .78; }
.has-selection .edge-label:not(.edge-selected) { opacity: .9; }
.graph-edge.back-edge { stroke-dasharray: 5 4; }
.graph-edge.edge-selected { stroke-width: 2.2px; }
.graph-edge.edge-emphasized { stroke-width: 3px; }
.edge-label {
  z-index: 1;
  display: block;
  padding: 2px 5px;
  border: 1px solid color-mix(in srgb, var(--connection-color) 48%, transparent);
  border-radius: 6px;
  background: color-mix(in srgb, var(--connection-color) 16%, transparent);
  color: var(--ink);
  font-size: 12px;
  line-height: 17px;
  text-align: center;
  white-space: nowrap;
}
.edge-label > span { display: block; overflow: hidden; text-overflow: ellipsis; }
.edge-label.edge-selected, .edge-label:hover, .edge-label:focus-visible {
  border-color: var(--connection-color);
  background: color-mix(in srgb, var(--connection-color) 24%, transparent);
}

#controls {
  display: flex;
  min-height: 47px;
  gap: 8px;
  align-items: center;
  justify-content: flex-end;
  padding: 6px 23px;
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.camera-tools { display: flex; align-items: center; gap: 3px; }
#hint { margin-right: auto; min-width: 0; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#scale { min-width: 42px; text-align: center; color: var(--muted); font-size: 12px; }
.divider { width: 1px; height: 19px; margin-inline: 3px; background: var(--line); }

#detail {
  grid-area: 1 / 1;
  justify-self: end;
  min-height: 0;
  width: min(410px, 39vw);
  z-index: 5;
  overflow: auto;
  overscroll-behavior: contain;
  background: var(--surface);
  border-left: 1px solid var(--line);
  overflow-wrap: anywhere;
  scrollbar-width: none;
}
#detail::-webkit-scrollbar { display: none; }
#detail[hidden] { pointer-events: none; }
@media (prefers-reduced-motion: no-preference) {
  :root[data-input="pointer"] #detail {
    transition: transform 220ms cubic-bezier(.23, 1, .32, 1), display 220ms allow-discrete;
  }
  :root[data-input="pointer"] #detail[hidden] { transform: translateX(100%); }
  @starting-style {
    :root[data-input="pointer"] #detail:not([hidden]) { transform: translateX(100%); }
  }
}
@media (min-width: 761px) and (prefers-reduced-motion: no-preference) {
  :root[data-input="pointer"] #detail:not([hidden]) {
    transition: transform 220ms cubic-bezier(.23, 1, .32, 1), pointer-events 220ms step-end allow-discrete;
  }
  @starting-style {
    :root[data-input="pointer"] #detail:not([hidden]) { pointer-events: none; }
  }
}
.detail-head { position: relative; display: grid; gap: 9px; padding: 20px 22px 17px; }
.detail-head h2 { font-size: 23px; line-height: 1.3; }
.detail-head h2:focus { outline: none; }
.detail-head > p { color: var(--muted); line-height: 1.5; }
.detail-head > .tool[aria-label="关闭详情"] { position: absolute; right: 13px; top: 15px; }
.module-detail-title { display: flex; gap: 4px; align-items: start; }
.module-detail-title h2 { flex: 1; min-width: 0; padding-block: 2px; }
.module-detail-title .tool { flex: none; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.detail-actions .tool { border-color: var(--line); }
.detail-actions .primary { border-color: transparent; }
.detail-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; padding-right: 27px; }
.detail-content { padding: 0 22px 20px; }
.detail-section { padding: 13px 0; border-top: 1px solid var(--line); line-height: 1.55; }
.detail-section h3 { margin-bottom: 6px; font-size: 12px; font-weight: 650; color: var(--muted); }
.detail-section p + p, .detail-section p + ul { margin-top: 5px; }
.detail-section ol, .detail-section ul { padding-left: 21px; }
.detail-section li + li { margin-top: 5px; }
.detail-section code:not(pre code) { background: var(--paper); border-radius: 3px; padding: 1px 3px; }
.detail-section pre { margin: 0; padding: 10px; overflow: auto; background: var(--paper); border-radius: 6px; }
.detail-id { color: var(--muted); font-size: 11px; }
.table-scroll { overflow: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
th { color: var(--muted); background: var(--paper); }
.detail-section:is([data-field="fields"], [data-field="request"], [data-field="response"]) td:nth-child(-n + 2) {
  overflow-wrap: break-word;
}
.detail-section:is([data-field="fields"], [data-field="request"], [data-field="response"]) th:nth-child(3) {
  white-space: nowrap;
}
.detail-section .state-diagram, .detail-section .evidence-list, .relation-groups ul { list-style: none; padding: 0; }
.state-diagram li, .step-links { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.state-diagram small { color: var(--muted); }
.state-node, .chosen { background: var(--accent-bg); color: var(--accent); padding: 1px 6px; border-radius: 4px; }
.chosen { margin-left: 6px; font-size: 12px; }
.body-row { margin-block: 3px; }
.body-row > .muted { font-size: 12px; }
.media-list { display: grid; gap: 12px; }
figure img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; }
figcaption { margin-top: 5px; color: var(--muted); font-size: 12px; }
.callout { display: flex; align-items: start; gap: 7px; padding: 9px; border-radius: 6px; background: var(--paper); }
.callout[data-tone="warn"] svg { color: var(--warn); }
.evidence-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 5px; align-items: center; }
.evidence-row small { display: block; }
.source-path { overflow-wrap: anywhere; }
.implementation-detail { display: grid; gap: 5px; }
.relation-groups .detail-section:first-child { border-top: 0; padding-top: 0; }
.relation-groups .detail-section:last-child { padding-bottom: 0; }
.relation-note { display: block; color: var(--muted); font-size: 12px; }
.detail-section .child-list { list-style: none; padding: 0; }
.detail-section[data-field="children"] h3 .count { margin-left: 6px; }
.search-directory { margin-top: 8px; }
.browse-pages {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.browse-pages .tool { border-color: var(--line); }

#browse {
  width: min(540px, calc(100% - 24px));
  max-height: min(620px, calc(100% - 32px));
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 10px 40px #0003;
}
#browse[open] { display: grid; grid-template-rows: auto minmax(0, 1fr); }
#browse::backdrop { background: #10192866; }
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 15px;
  border-bottom: 1px solid var(--line);
}
.panel-header h2 { font-size: 17px; }
#browse-body { padding: 12px 15px; overflow: auto; }
.search-field {
  display: flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding-inline: 9px;
  color: var(--muted);
}
.search-field input { background: transparent; border: none; height: 40px; min-width: 0; flex: 1; }
.search-clear { display: none; }
.search-contents output { display: block; font-size: 12px; padding-top: 6px; }
.search-result { display: grid; grid-template-columns: auto 1fr auto; gap: 9px; }
.search-result, .tree-object { padding: 7px 5px; align-items: center; color: var(--ink); text-decoration: none; }
.search-result:hover, .tree-object:hover { background: var(--accent-bg); color: var(--accent); border-radius: 5px; }
.search-result small { display: block; margin-top: 2px; overflow-wrap: anywhere; }
.tree-list { list-style: none; padding: 0; }
.tree-list .tree-list { margin-left: 13px; padding-left: 7px; border-left: 1px solid var(--line); }
.tree-row { display: flex; align-items: center; gap: 6px; min-height: 37px; }
.tree-row .tool { min-height: 26px; padding: 3px; }
.tree-indent { width: 24px; flex: none; }
.tree-object { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tree-row .type-mark { width: 23px; height: 23px; }

#view-content { height: 100%; overflow: auto; touch-action: pan-y; }
.empty-scene {
  min-height: 100%;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 14px;
  padding: 24px;
}
.empty-scene h2 { font-size: 18px; color: var(--muted); text-align: center; }
.empty-art { width: 160px; height: 108px; }
.empty-zone { fill: var(--zone); stroke: var(--edge); stroke-dasharray: 4 3; }
.empty-lines { stroke: var(--edge); fill: none; }
.empty-node { fill: var(--surface); stroke: var(--edge); }
.flow-index { list-style: none; width: min(100%, 410px); padding: 0; }
.flow-index li { display: flex; gap: 7px; align-items: center; border-top: 1px solid var(--line); padding: 8px 0; }
.flow-index small { margin-left: auto; }

@media (max-width: 760px) {
  .topbar { gap: 8px; padding: 6px 12px; }
  .tools { gap: 2px; }
  .tools .tool { padding: 4px 6px; }
  #hint { display: none; }
  .crumb { max-width: 66vw; }
  #controls { padding: 4px 10px; min-height: 45px; flex-wrap: wrap; gap: 3px; }
  #detail {
    position: fixed;
    inset: 0;
    width: 100%;
    min-height: 0;
    border-left: 0;
  }
  #browse-body { padding: 9px; }
  .tree-list .tree-list { margin-left: 7px; padding-left: 5px; }
  .tree-row { gap: 3px; }
  .tree-row .design-status { font-size: 11px; }
}

@media (pointer: coarse), (max-width: 640px) {
  .tool, .tree-row .tool, button.crumb, a:not(.inline-reference), .search-field input {
    min-width: 44px;
    min-height: 44px;
  }
  .tools .tool { justify-content: center; }
  .search-field input { font-size: 16px; }
  .search-field input::-webkit-search-cancel-button { display: none; }
  .search-clear { display: inline-flex; }
  .search-field input:placeholder-shown + .search-clear { visibility: hidden; }
  .tree-indent { width: 44px; }
  .tree-list .tree-list { margin-left: 4px; padding-left: 3px; }
  .object-link:not(.inline-reference), a.source-path { display: inline-flex; align-items: center; }
  .detail-meta { min-height: 44px; padding-right: 50px; }
  .detail-section[data-field="actor"] > .object-link, .body-row > .object-link { margin-inline-start: 5px; }
  span.edge-label { pointer-events: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

body:not([data-reading="map"], [data-reading="flow"]) #viewport {
  background: var(--paper);
  touch-action: pan-y;
}
#reading { --reading-inset: 30px; }
.reading-page {
  width: min(100%, 1140px);
  margin-inline: auto;
  padding: 16px var(--reading-inset) 36px;
  line-height: 1.55;
  overflow-wrap: anywhere;
}
.reading-page h2 { font-size: 18px; }
.reading-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 8px;
  margin-bottom: 16px;
}
.reading-toolbar output { align-self: end; padding: 7px 2px; }
.reading-field { display: grid; gap: 4px; min-width: 0; }
.reading-field span { color: var(--muted); font-size: 13px; }
.reading-field select {
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  font: inherit;
  padding: 6px 8px;
  min-width: 0;
  max-width: 100%;
}
.reading-field select { width: min(100%, 190px); min-height: 35px; }
.reading-field select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.reading-toolbar .tool { border-color: var(--line); }
.reading-toolbar button:disabled { opacity: .65; cursor: default; }
.reading-empty {
  min-height: 210px;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 6px;
  padding: 18px 0;
  text-align: center;
  color: var(--muted);
}
.reading-link { color: var(--accent); white-space: normal; text-align: start; justify-content: start; }
.reading-link[aria-current] { background: var(--accent-bg); }
.inventory-section { padding-block: 12px 18px; border-top: 1px solid var(--line); }
.inventory-section h2 { margin-bottom: 8px; }
.inventory-table { background: var(--surface); table-layout: fixed; }
.inventory-table th:first-child { width: 22%; }
.inventory-table th:last-child { width: 14%; }
.inventory-table :is(th, td) { vertical-align: middle; }
.inventory-table td:first-child { font-weight: 650; padding: 0 4px; }
.inventory-table tbody tr { cursor: pointer; }
.inventory-table tbody tr:hover { background: var(--accent-bg); }
.inventory-cell-label { display: none; }
@media (max-width: 760px) {
  #reading { --reading-inset: 14px; }
  .reading-page { padding-bottom: 24px; }
  .reading-toolbar .reading-field { flex: 1 1 120px; }

:"ArkiGo 2.0 升级总纲","symbol":"第 6、7 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/check.mjs","symbol":"check"},{"kind":"file","ref":"skills/arkigo/scripts/lib/warnings.mjs","symbol":"warningsFor"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"c33413b4afe3e8a036e5970f0f3967e77050006495d693366ea7a7d8de125f80","path":"skills/arkigo/scripts/commands/check.mjs","symbol":"check"},{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"c4f8f220a975228807a08b9b0a7fdfbcf4266241feec0afc33b96c0aaecfa23c","path":"skills/arkigo/scripts/lib/warnings.mjs","symbol":"warningsFor"}],"status":"implemented"}},{"id":"reading.cli","type":"interface","title":"命令入口与通用回执","summary":"一个 Node 入口分发 13 条命令，机器可区分成功、内容问题、用法和版本冲突。","parent":"reading","status":"accepted","origin":"code","body":{"errors":[{"code":"0","when":"成功；非严格 check 有提醒也成功。"},{"code":"1","when":"内容问题，包括校验失败、依据需复查及严格检查出现提醒。"},{"code":"2","when":"用法、依赖或读写错误。"},{"code":"3","when":"change 的 --base 与当前版本冲突。"}],"kind":"cli","signature":"node \u003cskill-dir>/scripts/arkigo.mjs \u003c命令> [参数]"},"notes":[{"text":"有效命令为 init、query、change、history、diff、check、verify、context、render、export、layout、version、install。未知或重复参数、位置参数数量不符会报错。","type":"text"},{"text":"标准输出使用单行紧凑 JSON；context 和不带 --out 的 export md 输出 Markdown。错误用 stderr 的单行 JSON（ok、code、message 和诊断）。版本与安装的技能路径或目标位置是本机绝对路径；项目内回执通常用相对路径。","type":"text"},{"text":"query、history、diff、check、verify 支持 --offset、--limit（1–100）和 --max-bytes（1024–65536）。默认 20 项和 12,000 UTF-8 字节，含换行。nextOffset 标记续读；omitted 也可能指已跳过前页或当前行只提供身份。context 只有 --max-bytes，默认 24,000。","type":"text"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 2、7、9 节"},{"kind":"file","ref":"skills/arkigo/scripts/arkigo.mjs","symbol":"parse 与命令分发"},{"kind":"file","ref":"skills/arkigo/scripts/lib/output.mjs","symbol":"page、preview"},{"kind":"file","ref":"skills/arkigo/scripts/lib/commands.mjs","symbol":"commands"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"c08fefadc518fcf668ba50159855fb332fd2d53e49ecd0f783e4447cce502fdc","path":"skills/arkigo/scripts/arkigo.mjs","symbol":"parse 与命令分发"},{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"c50da4acceb297d47644e907f659802aad76faa9ad46bcfb0f0e1e294406c6da","path":"skills/arkigo/scripts/lib/output.mjs","symbol":"page、preview"},{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"86f6a7b64cee8cf3ec0d6f9d0b206b71a876431d5988b53547f8984802846c40","path":"skills/arkigo/scripts/lib/commands.mjs","symbol":"commands"}],"status":"implemented"}},{"id":"reading.context","type":"interface","title":"context 取开工材料","summary":"限定 Markdown 字节数，给 AI 目标、规则、验收、相关数据和代码位置。","parent":"reading","status":"accepted","origin":"code","body":{"kind":"cli","signature":"context \u003cID> [--max-bytes \u003c字节数>]"},"notes":[{"columns":["段落顺序","采集范围"],"rows":[["1. 目标对象","目标的完整内容。"],["2. 树中位置、项目目标与范围","祖先路径，以及系统目标和范围。"],["3. 直接下级","每个直接下级的标题、ID 和摘要。"],["4. 相关规则","目标及各层下级的 governed_by 目标，步骤端点归到所属流程。"],["5. 相关验收","指向目标及各层下级的 verifies 来源，带结果。"],["6. 数据与接口","从目标发出的 reads、writes、calls 中符合类型的对象，以及直接下级接口和被调用的目标接口。"],["7. 双向依赖","与目标直接相连的 depends_on 另一端摘要。"],["8. 未决问题","blocks 直接指向目标的未决项。"],["9. 实现情况与依据","目标及已收进材料的对象，列状态、说明、路径、符号和复查状态。"],["10. 省略清单","报告被压缩或省掉的项目和取回命令。"]],"type":"table"},{"text":"预算不足时依次缩减依赖摘要、下级摘要、数据和接口字段，按块截短目标说明，然后整条移走规则、验收和未决问题。再改清单为数量，必要时继续删辅助段落、缩短目标正文；极端输入退到标题或摘要加字段取回命令。","type":"text"},{"lang":"markdown","text":"# 开工材料：{对象标题}\n\n这是设计里「{对象标题}」（`{对象id}`）及其相关内容，取自设计版本 `{rev}`。实现时以其中的规则和验收为准；标为未决的问题由用户决定，不要自行选择；这里没有列出的内容见末尾的省略清单。写完代码后用 `change` 回写实现情况和验收结果。","title":"交给 AI 的开头","type":"code"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 7.2、11.2 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/context.mjs","symbol":"context"},{"kind":"file","ref":"skills/arkigo/scripts/lib/context-budget.mjs","symbol":"fitContext、fieldCommand"},{"kind":"file","ref":"skills/arkigo/scripts/lib/markdown.mjs","symbol":"objectMarkdown、prose"}],"implementation":{"evidence":[{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"fb72848272b8fdd9baa3377b2b1913df6edfbc823eb49ee54bee8c4d3b1ff587","path":"skills/arkigo/scripts/commands/context.mjs","symbol":"context"},{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"16d3c8564afb2f61cefc7453f86414aa165166d2b01f0fcdf8d23ce205c9a906","path":"skills/arkigo/scripts/lib/context-budget.mjs","symbol":"fitContext、fieldCommand"},{"checkedAt":"2026-11-20T15:04:20.796Z","hash":"aab104cc26bacad82bef03036549682cc8dcf2f4a764e0966e8e83dae467c1b8","path":"skills/arkigo/scripts/lib/markdown.mjs","symbol":"objectMarkdown、prose"}],"status":"implemented"}},{"id":"reading.context-reach","type":"decision","title":"开工材料应取哪些后代关系","summary":"目前规则、验收遍历后代，数据接口和未决问题只按目标附近的关系采集。","parent":"reading","status":"proposed","origin":"ai","body":{"options":[{"detail":"精确目标较短，模块级任务要继续打开下级对象。","title":"保留当前范围并解释"},{"detail":"模块级材料更完整，需要设计超预算时的优先级和续读指引。","title":"扩大采集范围"}],"question":"模块级开工材料是否也要列出各层下级的数据接口和未决问题？"},"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 7.2 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/context.mjs","symbol":"context"},{"kind":"file","ref":"skills/arkigo/references/commands.md","symbol":"context"}]},{"id":"reading.diagnostics","type":"rule","title":"检查提示只指出可见缺口","summary":"程序给提示和定位，不给设计评分或替作者判断是否完整。","parent":"reading","status":"accepted","origin":"code","body":{"constraint":"提示包含代码、对象 ID 和一句说明。普通 check 和 change 不因提醒失败；check --strict 有提醒时以 1 返回。","when":"check 或 change 报告提醒时"},"notes":[{"columns":["代码","含义"],"rows":[["SYSTEM_INCOMPLETE","系统缺用户、目标或范围。"],["THIN_MODULE","模块没有职责也没有下级。"],["FLOW_NO_FAILURE","流程没有一步写失败处理。"],["RULE_NO_ACCEPTANCE","规则没有验收指向它。"],["ACCEPTED_BUT_BLOCKED","已接受对象连到一个未决阻塞。"],["OPEN_DECISION","待定项没有选项结论。"],["SUMMARY_LONG","摘要超过 90 字符。"],["NO_SOURCE","代码或文档来源缺出处。"],["UNUSED_ENTITY / UNUSED_INTERFACE","没有关系指向该数据或接口。"],["NOT_CHECKED","可实现对象没有实现记录。"],["STALE_EVIDENCE","内容出处已缺失，或实现依据缺失、指纹变化。"]],"type":"table"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 6 节"},{"kind":"file","ref":"ski e":"screen","title":"清单","summary":"用六类表格横向找规则、验收、决策、数据、接口或界面。","parent":"viewer","status":"accepted","origin":"user","body":{"elements":["按设计状态与所属模块筛选，选中一行打开对应详情。","从查找面板的「按类型列出全部」打开，可由顶栏路径回到地图。"],"purpose":"按结构化类别和状态查找设计。","route":"#/inventory/\u003c对象ID>","states":["某类型为空或筛选无匹配时显示空结果。"]},"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 8.4 节"},{"kind":"file","ref":"skills/arkigo/assets/readings/inventory.js","symbol":"registerRead 的 render"},{"kind":"file","ref":"skills/arkigo/assets/inventory.mjs","symbol":"inventoryRows"},{"kind":"conversation","ref":"2026-11-21 用户要求精简路线图、移除页面拍板、变更和进度，核对状态用图标。"},{"kind":"file","ref":"skills/arkigo/assets/directory.js","symbol":"createDirectory"}],"implementation":{"evidence":[{"checkedAt":"2026-11-21T08:51:23.472Z","hash":"757db2e2eeebe75bdebd9b638003becc8b7040f6eff53f75303294fbf7064d16","path":"skills/arkigo/assets/readings/inventory.js","symbol":"inventoryTable"},{"checkedAt":"2026-11-21T08:51:23.472Z","hash":"b6c0e6697ea0a4f62b6e852a4d7a8e9573210492bee905d766647257ea90084e","path":"skills/arkigo/assets/directory.js","symbol":"createDirectory"}],"status":"implemented"}},{"id":"viewer.map","type":"screen","title":"地图","summary":"按一层归属看卡片、分区和主要关系；选中一张卡片再看它的全部关系。","parent":"viewer","status":"accepted","origin":"user","body":{"elements":["系统和模块只显示直接下级。模块、流程、数据、接口、界面成卡；角色可以从查找或详情打开，本层没有别的卡片时才成卡。规则、验收和决策可通过顶栏查找打开，也可从其他对象详情的下级或关系打开。","主界面采用顶栏、画布和底栏。画布内禁止原生文本选取和拖拽，卡片拖动和画布平移由应用管理。","有实现依据且生成时全部核对一致的卡片显示带勾圆圈，其余显示虚线圆圈。","按分组或类型分区；宽屏分区并排，放不下换行。自动排版按主要关系分层，同一输入位置稳定，手动位置保存在浏览器并可导出。","关系合并到当前层可见卡片，标签可以打开原关系。连线采用圆滑转角，在卡片间选择较短的通路，可跨分区和不同归属分支。分区边框只作视觉分组，连线和标签可以跨过边框。线多于卡片时默认只画主要关系，选中后突出有关连线，同时保留其他主线和标签的可读性。 连线与箭头用可区分的颜色，关系和条件标签使用对应线色的半透明底。 连线离开和接入卡片时优先留出一段直线再转弯，空间紧时可提前转弯。","在宽屏和窄屏单击卡片均打开详情。模块详情的标题旁提供进入箭头，流程详情提供查看流程。双击和画布缩放导航也可进入，顶栏路径和缩小可返回。底栏提供缩放、适应、布局重置及导出。"],"purpose":"项目负责人先看组成；维护者进入一个模块找流程、接口及关系。","route":"#/map/\u003c对象ID>","states":["无卡片时显示空层，可以点击顶栏当前路径查看本层详情。","使用指针平移或拖动卡片时，画布边缘不显示焦点轮廓。"]},"sources":[{"kind":"doc","ref":"Arki ect"},{"checkedAt":"2026-11-21T08:59:32.639Z","hash":"e3310f6b69ffd759502803a43e0ab902b8506546f56adcff1e69a30db0420109","path":"skills/arkigo/assets/dom.js","symbol":"codeCheckMark"},{"checkedAt":"2026-11-21T08:59:32.639Z","hash":"e3ea293e58d2e8badca5042356b8dbf8dc0a04f17129cc010401fcd234009357","path":"skills/arkigo/assets/page.css","symbol":"画布、分区与连线样式"},{"checkedAt":"2026-11-21T08:59:32.639Z","hash":"8631081f2e02a7a0cd71cd6ed88fa1702e8af155d9e55a4dd7d856cc98b137d0","path":"skills/arkigo/assets/routing.mjs","symbol":"routeConnection、roundedPath、placeConnectionLabel"},{"checkedAt":"2026-11-21T08:59:32.639Z","hash":"c13c7db280eaec3e7b446f3f1ee8dd0195fbf04cef51b5e9f23e736519693feb","path":"skills/arkigo/assets/model.mjs","symbol":"projectRelations"}],"note":"分区边框仅作视觉分组，走线可穿过边框或经过分区外。箭头和半透明标签使用与连线对应的色调，悬停或键盘聚焦标签时，对应连线加粗并显示在其他线前面。 走线优先在卡片与首尾拐点之间留 28 个画布像素，转角圆滑后保留可见的直线段，狭窄通路可以缩短这段距离。","status":"implemented"}},{"id":"viewer.navigation","type":"screen","title":"入口、查找与窄屏导航","summary":"在顶栏查看路径、打开当前层详情、查找对象和切换主题。","parent":"viewer","status":"accepted","origin":"user","body":{"elements":["顶栏路径与项目名合并，点击上级返回，点击当前层打开其详情。","查找面板搜索 ID、标题、摘要、正文、说明和依据，显示归属路径并可跳转。空查询时展示归属树及清单入口。 归属树省略「已接受」标记。","换页保留对象定位，地址可分享，流程步骤也可定位。","宽度不超过 760px 时地图和流程竖排，详情占满屏幕。主题默认跟随系统，手动设置保存在浏览器。"],"purpose":"按词、归属、内容或链接找到同一对象。","route":"#/\u003c读法>/\u003c对象ID>","states":["尊重减少动态效果偏好；使用键盘可阅读和导航。","窄屏初始比例的卡片字号目标至少 12px。"]},"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 8、8.9、8.10 节"},{"kind":"file","ref":"skills/arkigo/assets/app.js","symbol":"render、navigate、initialize"},{"kind":"file","ref":"skills/arkigo/assets/directory.js","symbol":"createDirectory"},{"kind":"file","ref":"skills/arkigo/assets/search.mjs","symbol":"buildSearchIndex、searchDesign"},{"kind":"file","ref":"skills/arkigo/assets/page.css","symbol":"主题、窄屏与减少动态效果"},{"kind":"conversation","ref":"2026-11-21 接手时读到的用户留言：同意搜索和目录合成一个、进度和变更不占入口的方案"},{"kind":"conversation","ref":"2026-11-21 用户要求精简路线图、移除页面拍板、变更和进度，核对状态用图标。"},{"kind":"file","ref" t":"改写入时先追 [[workspace.apply]] 的锁、候选、发布、页面四段。请求和错误见 [[workspace.change]]，路径和失败边界见 [[workspace.paths]]、[[workspace.atomic]]、[[workspace.refresh]]。涉及导入决定再读 [[workspace.import]]。","title":"从哪里开工","type":"text"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 3、5、7.1、7.3 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/init.mjs","symbol":"init"},{"kind":"file","ref":"skills/arkigo/scripts/commands/change.mjs","symbol":"change"},{"kind":"file","ref":"skills/arkigo/scripts/lib/io.mjs","symbol":"withLock、writeBatch"}],"implementation":{"evidence":[{"checkedAt":"2026-11-21T07:55:15.127Z","hash":"187e0f4beb48e3e4487a4e29cbcf8ff1a2bb348ff15cddc70b560be0172725c1","path":"skills/arkigo/scripts/commands/init.mjs","symbol":"init"},{"checkedAt":"2026-11-21T07:55:15.127Z","hash":"f2b644d97fe91ebb7c8d5bb3d8bea940ea132e1297b3b3b7fd37b39d37bd2b85","path":"skills/arkigo/scripts/commands/change.mjs","symbol":"change"},{"checkedAt":"2026-11-21T07:55:15.127Z","hash":"c9f239540ac6c6f726419ad3105f1c67ee65592dd53c40fe03b47e2c443ff7f8","path":"skills/arkigo/scripts/lib/io.mjs","symbol":"withLock、writeBatch"}],"status":"implemented"}},{"id":"workspace.apply","type":"flow","title":"一次修改怎样生效","summary":"命令加锁、处理候选、保存设计与记录，再根据生效结果刷新页面。","parent":"workspace","status":"accepted","origin":"code","body":{"ends":["preview","page"],"start":"lock","steps":[{"action":"程序读当前设计，规范化并比对可选的 --base。","failure":"锁超时返回用法或读写错误。版本冲突退出 3，AI 重读后再基于新版本准备修改。","id":"lock","title":"取得写锁"},{"action":"程序顺序应用修改项，再校验整个候选。","failure":"操作或校验失败退出 1；设计、历史和页面保持原样。","id":"candidate","title":"应用并校验"},{"action":"程序返回试跑结果或无变化结果，history 为 null。","id":"preview","title":"返回检查结果"},{"action":"程序发布设计及一条字段级变更记录。","failure":"普通写入异常回滚已发布文件；回滚失败单独报告。","id":"write","title":"保存设计与历史"},{"action":"程序把同一 rev 与依据快照交给阅读页并返回状态。","failure":"持久化成功后生成页失败仍返回退出 0，page.ok 为 false，另执行 render。","id":"page","title":"刷新页面"}],"transitions":[{"from":"lock","to":"candidate"},{"from":"candidate","to":"preview","when":"试跑或候选规范字节无变化"},{"from":"candidate","to":"write","when":"正式执行且内容变化"},{"from":"write","to":"page"}],"trigger":"AI 有明确的设计修改，调用 change。"},"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 7.1、7.3 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/change.mjs","symbol":"change、recordPath"},{"kind":"file","ref":"skills/arkigo/scripts/lib/io.mjs","symbol":"withLock、writeBatch、writeAtomic"},{"kind":"file","ref":"skills/arkigo/scripts/lib/render-page.mjs","symbol":"renderPage、regeneratePage、previousEditor"}],"implementation":{"evidence":[{"checkedAt":"2026-11-21T07:55:15.127Z","hash":"f2b644d97fe91ebb7c8d5bb3d8bea940ea132e1297b3b3b7fd37b39d37bd2b85","path":"skills/arkigo/scripts/commands/change.mjs","symbol":"change、recordPath"},{"checkedAt":"2026-11-21T07:55:15.127Z","hash":"c9f239540ac6c6f726419ad3105f1c67ee65592dd53c40fe03b47e2c443ff7f8","path":"skills/arkigo/scripts/lib/io.mjs","symbol":"withLock、writeBatch、writeAtomic"},{"checkedAt":"2026-11-21T07:55:15.127Z","hash":"5936aae3f94a564bd16b374bf73e827134e31a0b325ce3d72192db51a9a723b6","path":"skills/arkigo/scripts/lib/render-page.mjs","symbol":"renderPage、regeneratePage、previousEditor"}],"status":"implemented"}},{"id":"workspace.atomic","type":"rule","title":"同一设计串行写入","summary":"版本冲突、操作或结构校验失败不会发布候选内容。","parent":"workspace","status":"accepted","origin":"code","body":{"constraint":"为设计目录加写锁，等待最多五秒并尝试清理死亡进程留下的锁。写入先落同目录临时文件，再改名替换；新建文件用硬链接避免覆盖。正常写入故障尝试回滚批次。已有内容提交与页面生成分开返回。","when":"初始化、应用内容、生成页面或更改布局时"},"notes":[{"text":"文件替换有原子性；多文件批次通过回滚处理正常异常，没有独立的断电事务。--dry-run 只校验，不写设计、历史或页面；规范字节不变时也一样。","type":"text"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 2、7.1、7.3 节"},{"kind":"file","ref":"skills/arkigo/scripts/lib/io.mjs","symbol":"withLock、writeBatch、writeAtomic"},{"kind":"file","ref":"skills/arkigo/scripts/commands/change.mjs","symbol":"change、recordPath"},{"kind":"file","ref":"skills/arkigo/scripts/lib/render-page.mjs","symbol":"renderPage、regeneratePage、previousEditor"}],"implementation":{"evidence":[{"checkedAt":"2026-11-21T07:55:15.127Z","hash":"c9f239540ac6c6f726419ad3105f1c67ee65592dd53c40fe03b47e2c443ff7f8","path":"skills/arkigo/scripts/lib/io.mjs","symbol":"withLock、writeBatch、writeAtomic"},{"checkedAt":"2026-11-21T07:55:15.127Z","hash":"f2b644d97fe91ebb7c8d5bb3d8bea940ea132e1297b3b3b7fd37b39d37bd2b85","path":"skills/arkigo/scripts/commands/change.mjs","symbol":"change、recordPath"},{"checkedAt":"2026-11-21T07:55:15.127Z","hash":"5936aae3f94a564bd16b374bf73e827134e31a0b325ce3d72192db51a9a723b6","path":"skills/arkigo/scripts/lib/render-page.mjs","symbol":"renderPage、regeneratePage、previousEditor"}],"status":"implemented"}},{"id":"workspace.change","type":"interface","title":"change 应用修改","summary":"从 JSON 修改项或决定文件读入内容，可试跑或检查所读版本。","parent":"workspace","status":"accepted","origin":"code","body":{"errors":[{"code":"BASE_CONFLICT / 3","when":"--base 与当前 rev 不同，重新读取后再决定如何处理。"},{"code":"VALIDATION_FAILED / 1","when":"候选内容有结构或语义错误。"},{"code":"OP_INVALID / 1","when":"修改项形状、字段、类型或目标不允许。"}],"kind":"cli","signature":"change --reason \u003c说明> (--ops \u003c文件|-> | --from-decisions \u003c文件>) [--by \u003c名字>] [--base \u003crev>] [--dry-run]"},"notes":[{"columns":["修改项","作用"],"rows":[["add、move","新增完整对象；调整归属。"],["update","按点分路径 set；用 [id 或 name] 匹配数组元素，[+] 追加，null 删除。保护对象身份、归属字段和结果记录。"],["remove","缺省拒绝带子项或引用的目标。cascade 删除下级和相关关系；遗留正文引用或步骤角色须同组修正。"],["link、unlink","增删关系。移除按 from、type、to 定位。"],["accept、retire","更新设计决定状态。"],["decide","记录从零开始的选项、理由、谁定的和时间；提议同时变为已接受。"],["implement、confirm-evidence","登记实现与 SHA-256，或重新核对刷新指纹；status: null 清除实现记录。planned 需要传 evidence 数组。"],["verify","只为验收写 passed 或 failed；保存时间和可选说明、证据。"]],"type":"table"},{"text":"成功 JSON 包含 ok、rev、base、applied、changed、history、warnings；写入后增加 page，删除时可增加 removed，试跑时 dryRun，决定导入时 decisions。warnings 只列新出现的提醒并限量。","type":"text"}],"sources":[{"kind":"doc","ref":"ArkiGo 2.0 升级总纲","symbol":"第 7、7.1 节"},{"kind":"file","ref":"skills/arkigo/scripts/commands/change.mjs","symbol":"change、recordPath"},{"kind":"file","ref":"skills/arkigo/scri     const path = [];
    for (let object = objects.get(objectId(id)); object; object = objects.get(object.parent)) path.push(object);
    return path.reverse();
  }
  function get(address) {
    const [id, stepId] = address.split('#');
    const object = objects.get(id);
    if (stepId === undefined) return object;
    const step = object?.body.steps?.find((item) => item.id === stepId);
    if (step) return { ...step, id: address, parent: id, type: 'step', summary: step.action, body: step };
  }
  function containerFor(id) {
    let object = objects.get(objectId(id));
    while (object && !['system', 'module'].includes(object.type)) object = objects.get(object.parent);
    return object ?? root;
  }
  return { objects, children, root, get, pathTo, containerFor };
}

// How much a relation counts when one line stands for all relations between two cards, and when the map
// chooses the lines it draws before anything is selected.
const relationWeights = { calls: 4, writes: 3, depends_on: 3, reads: 2, uses: 2, relates: 1 };

// Projects the design's relations onto the cards of one map level. Every pair of cards gets a single line that
// carries all relations between them; `main` marks each card's weightiest line.
function projectRelations(index, relations, container, cardIds) {
  const pairs = new Map();
  const annotations = new Map();
  const owners = new Map();
  function owner(address) {
    const id = objectId(address);
    if (owners.has(id)) return owners.get(id);
    let current = index.objects.get(id);
    while (current && current.parent !== container) current = index.objects.get(current.parent);
    const result = cardIds.has(current?.id) ? current.id : undefined;
    owners.set(id, result);
    return result;
  }
  for (const relation of relations) {
    const { type } = relation;
    const from = owner(relation.from);
    const to = owner(relation.to);
    if (Object.hasOwn(annotationTypes, type)) {
      const id = type === 'governed_by' ? from : to;
      if (!id) continue;
      if (!annotations.has(id)) annotations.set(id, {});
      (annotations.get(id)[type] ??= []).push(relation);
      continue;
    }
    if (!from || !to || from === to) continue;
    const [a, b] = from < to ? [from, to] : [to, from];
    const key = a + '/' + b;
    if (!pairs.has(key)) pairs.set(key, { id: key, a, b, relations: [], types: new Map(), forward: 0, backward: 0 });
    const pair = pairs.get(key);
    const weight = relationWeights[type] ?? 1;
    pair.relations.push(relation);
    pair.types.set(type, (pair.types.get(type) ?? 0) + weight);
    pair[from === a ? 'forward' : 'backward'] += weight;
  }
  const edges = [...pairs.values()].map(({ id, a, b, relations, types, forward, backward }) => {
    const [from, to] = forward >= backward ? [a, b] : [b, a];
    const type = [...types].reduce((best, entry) => entry[1] > best[1] ? entry : best)[0];
    return {
      id, from, to, type, relations, count: relations.length, weight: forward + backward,
      mutual: forward > 0 && backward > 0, main: false
    };
  });
  const heaviest = new Map();
  for (const edge of edges) {
    for (const id of [edge.from, edge.to]) {
      if (!heaviest.has(id) || edge.weight > heaviest.get(id).weight) heaviest.set(id, edge);
    }
  }
  for (const edge of heaviest.values()) edge.main = true;
  // A level with no more lines than cards is already easy to read, so nothing is held back there.
  if (edges.length <= cardIds.size) for (const edge of edges) edge.main = true;
  return { edges, annotations, owner };
}

function implementationState(object, evidence) {
  if (!['module', 'flow', 'rule', 'entity', 'interface', 'screen'].includes(object.type)) return null;
  const stale = Object.hasOwn(evidence, object.id) && evidence[object.id].some((item) =>
    item.of === 'implementation' && ['changed', 'missing'].includes(item.state));
  return stale ? 'stale' : object.implementation?.status ?? 'unknown';
}


const ZONE_TOP = 38;
const ZONE_GAP = 34;
const WIDE_GAP = 88;
const CARD_GAP = 32;
const ZONE_PAD = 16;

function overlaps(a, b) {
  return a.x < b.x + b.width && b.x < a.x + a.width && a.y < b.y + b.height && b.y < a.y + a.height;
}

function layoutBounds(boxes) {
  if (!boxes.length) return { x: 0, y: 0, width: 0, height: 0 };
  const x = Math.min(...boxes.map((box) => box.x));
  const y = Math.min(...boxes.map((box) => box.y));
  const right = Math.max(...boxes.map((box) => box.x + box.width));
  const bottom = Math.max(...boxes.map((box) => box.y + box.height));
  return { x, y, width: right - x, height: bottom - y };
}

// Remove DFS back edges before ranking so a retry never pulls later steps ahead of the start.
function rankGraph(ids, edges) {
  const outgoing = new Map(ids.map((id) => [id, []]));
  const ranks = new Map(ids.map((id) => [id, 0]));
  const visited = new Set();
  const active = new Set();
  const back = new Set();
  const ordered = [];
  for (const edge of edges) outgoing.get(edge.from)?.push(edge);
  for (const id of ids) {
    if (visited.has(id)) continue;
    const stack = [{ id, next: 0 }];
    visited.add(id);
    active.add(id);
    while (stack.length) {
      const frame = stack.at(-1);
      const edge = outgoing.get(frame.id)[frame.next++];
      if (!edge) {
        ordered.push(frame.id);
        active.delete(frame.id);
        stack.pop();
      } else if (active.has(edge.to)) {
        back.add(edge);
      } else if (!visited.has(edge.to) && outgoing.has(edge.to)) {
        visited.add(edge.to);
        active.add(edge.to);
        stack.push({ id: edge.to, next: 0 });
      }
    }
  }
  for (const id of ordered.reverse()) {
    for (const edge of outgoing.get(id)) {
      if (!back.has(edge) && ranks.has(edge.to)) ranks.set(edge.to, Math.max(ranks.get(edge.to), ranks.get(id) + 1));
    }
  }
  return { ranks, back };
}

function groupBy(items, keyOf) {
  const groups = new Map();
  for (const item of items) {
    const key = keyOf(item);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  }
  return groups;
}

function zoneFor(group, cards, padding = ZONE_PAD, heading = ZONE_TOP) {
  const box = layoutBounds(cards);
  return {
    group, x: box.x - padding, y: box.y - heading,
    width: box.width + padding * 2, height: box.height + heading + padding
  };
}

// Vertical reading: one column, ranks top to bottom, adjacent ranks of one group share a partition.
function columnSlots(cards, height) {
  const slots = [];
  let y = ZONE_TOP;
  const bands = [];
  for (const rank of groupBy(cards, (card) => card.rank).values()) {
    for (const [group, items] of groupBy(rank, (card) => card.group)) {
      if (bands.at(-1)?.[0] === group) bands.at(-1)[1].push(...items);
      else bands.push([group, items]);
    }
  }
  for (const [band, [group, items]] of bands.entries()) {
    const positions = items.map((card, i) => ({ ...card, x: ZONE_PAD, y: y + i * (height + 70), band }));
    const zone = zoneFor(group, positions);
    slots.push(...positions);
    y = zone.y + zone.height + ZONE_GAP + ZONE_TOP;
  }
  return slots;
}

// Horizontal reading: every group is a partition, partitions follow each other left to right and move to a new
// line when the next one would not fit, so the whole map can be read at full size.
function flowSlots(cards, width, height, availableWidth) {
  const step = width + WIDE_GAP;
  const zoneGap = WIDE_GAP - ZONE_PAD * 2;
  const most = Math.max(1, Math.floor((availableWidth - ZONE_PAD * 2 + WIDE_GAP) / step));
  const slots = [];
  let x = 0;
  let y = 0;
  let lineHeight = 0;
  for (const [band, [group, items]] of [...groupBy(cards, (card) => card.group)].entries()) {
    const ranks = [...groupBy(items, (card) => card.rank).values()];
    // Cards with no order among them read better side by side than as one tall column.
    const columns = ranks.length === 1 && items.length > 2
      ? Array.from({ length: Math.ceil(items.length / most) }, (_, row) => items.slice(row * most, (row + 1) * most))
        .flatMap((row) => row.map((card) => [card]))
      : ranks;
    const rows = [];
    for (let first = 0; first < columns.length; first += most) rows.push(columns.slice(first, first + most));
    const placed = [];
    let top = ZONE_TOP;
    for (const row of rows) {
      for (const [column, members] of row.entries()) {
        for (const [i, card] of members.entries()) {
          placed.push({ ...card, x: ZONE_PAD + column * step, y: top + i * (height + CARD_GAP), band });
        }
      }
      top += Math.max(...row.map((members) => members.length)) * (height + CARD_GAP) + CARD_GAP;
    }
    const zone = zoneFor(group, placed);
    if (x > 0 && x + zone.width > availableWidth) {
      x = 0;
      y += lineHeight + zoneGap;
      lineHeight = 0;
    }
    for (const card of placed) slots.push({ ...card, x: card.x + x, y: card.y + y });
    x += zone.width + zoneGap;
    lineHeight = Math.max(lineHeight, zone.height);
  }
  return slots;
}

function preservePositions(slots, positions, vertical) {
  const fixed = [];
  const automatic = [];
  for (const slot of slots) {
    const point = Object.hasOwn(positions, slot.id) ? positions[slot.id] : undefined;
    if (Number.isFinite(point?.x) && Number.isFinite(point?.y)) {
      fixed.push({ ...slot, x: point.x, y: point.y, fixed: true });
    } else automatic.push(slot);
  }
  const placed = [...fixed];
  for (const slot of automatic) {
    const card = { ...slot };
    const laterThan = placed.filter((other) => other.rank < card.rank);
    if (vertical && laterThan.length) {
      card.y = Math.max(card.y, ...laterThan.map((other) => other.y + other.height + CARD_GAP));
    }
    let hit;
    while ((hit = placed.find((other) => overlaps(card, other)))) card.y = hit.y + hit.height + CARD_GAP;
    placed.push(card);
  }
  const byId = new Map(placed.map((card) => [card.id, card]));
  return slots.map((card) => byId.get(card.id));
}

function layoutMap(items, edges, {
  direction = 'horizontal', availableWidth = direction === 'vertical' ? 390 : 1280, positions = {}
} = {}) {
  const vertical = direction === 'vertical';
  const width = vertical ? Math.min(260, Math.max(1, availableWidth - ZONE_PAD * 2)) : 264;
  const height = 136;
  // Only the lines drawn by default decide the order, so a seldom used relation cannot stretch the map.
  const { ranks, back } = rankGraph(items.map((item) => item.id), edges.filter((edge) => edge.main !== false));
  const cards = items.map((item) => ({
    id: item.id, group: item.group ?? item.type, width, height, rank: ranks.get(item.id)
  })).sort((a, b) => a.rank - b.rank);
  const slots = vertical ? columnSlots(cards, height) : flowSlots(cards, width, height, availableWidth);
  const placed = preservePositions(slots, positions, vertical);
  let zones = [...groupBy(placed, (card) => card.band).values()].map((band) => zoneFor(band[0].group, band));
  // A fixed position can interleave groups. Split the affected partitions around their cards.
  const split = zones.map((zone) => zones.some((other) => zone !== other && overlaps(zone, other)));
  if (split.some(Boolean)) {
    zones = zones.flatMap((zone, i) => split[i]
      ? placed.filter((card) => card.band === i).map((card) => zoneFor(card.group, [card], 0, 0))
      : [zone]);
  }
  return {
    direction, cards: placed, zones, bounds: layoutBounds(zones),
    edges: edges.map((edge) => ({ ...edge, back: back.has(edge) }))
  };
}

function layoutFlow(body, { direction = 'horizontal', availableWidth = 390 } = {}) {
  const vertical = direction === 'vertical';
  const width = vertical ? Math.min(246, Math.max(1, availableWidth - 96)) : 212;
  const height = 126;
  const ids = [body.start, ...body.steps.map((step) => step.id).filter((id) => id !== body.start)];
  const transitions = body.transitions ?? [];
  const { ranks, back } = rankGraph(ids, transitions);
  const layers = [...groupBy(body.steps, (step) => ranks.get(step.id))].sort(([a], [b]) => a - b);
  const crossSize = Math.max(1, ...layers.map(([, layer]) => layer.length));
  const cards = [];
  for (const [rank, layer] of layers) {
    for (const [index, step] of layer.entries()) {
      const row = index + (crossSize - layer.length) / 2;
      cards.push({
        id: step.id, rank, width, height,
        x: vertical ? 48 : rank * (width + 100),
        y: vertical ? cards.length * (height + 122) : row * (height + 52)
      });
    }
  }
  return {
    direction, cards, zones: [], bounds: layoutBounds(cards),
    edges: transitions.map((edge, index) => ({ ...edge, id: index, back: back.has(edge) }))
  };
}


const portVectors = { left: [-1, 0], right: [1, 0], top: [0, -1], bottom: [0, 1] };
const midpoint = (a, b) => (a + b) / 2;
const cornerRadius = 20;
const preferredLead = 28;

function port(card, side, offset, clearance) {
  const [x, y] = portVectors[side];
  const point = {
    x: card.x + card.width * (x + 1) / 2 + (y ? offset : 0),
    y: card.y + card.height * (y + 1) / 2 + (x ? offset : 0)
  };
  return [point, { x: point.x + x * clearance, y: point.y + y * clearance }];
}

function segmentHitsBox(a, b, box) {
  if (a.x === b.x) {
    return a.x > box.x && a.x < box.x + box.width &&
      Math.max(a.y, b.y) > box.y && Math.min(a.y, b.y) < box.y + box.height;
  }
  if (a.y === b.y) {
    return a.y > box.y && a.y < box.y + box.height &&
      Math.max(a.x, b.x) > box.x && Math.min(a.x, b.x) < box.x + box.width;
  }
  return true;
}

function simplifyRoute(points) {
  const result = [];
  for (const point of points) {
    const previous = result.at(-1);
    if (previous?.x === point.x && previous.y === point.y) continue;
    const earlier = result.at(-2);
    if ((earlier?.x === point.x && previous.x === point.x && (previous.y - earlier.y) * (point.y - previous.y) > 0) ||
        (earlier?.y === point.y && previous.y === point.y && (previous.x - earlier.x) * (point.x - previous.x) > 0)) {
      result.pop();
    }
    result.push(point);
  }
  return result;
}

function gridRoute(start, end, cards, clear) {
  const xs = [...new Set([start.x, end.x, ...cards.flatMap(({ x, width }) => [x, x + width])])].sort((a, b) => a - b);
  const ys = [...new Set([start.y, end.y, ...cards.flatMap(({ y, height }) => [y, y + height])])].sort((a, b) => a - b);
  const goal = xs.indexOf(end.x) + ys.indexOf(end.y) * xs.length;
  const first = xs.indexOf(start.x) + ys.indexOf(start.y) * xs.length;
  const trail = new Map([[first, -1]]);
  const queue = [first];
  const point = (i) => ({ x: xs[i % xs.length], y: ys[Math.floor(i / xs.length)] });
  for (let i = 0; i < queue.length; i++) {
    const index = queue[i];
    const a = point(index);
    if (index === goal) {
      const result = [];
      for (let current = index; current >= 0; current = trail.get(current)) result.push(point(current));
      return result.reverse();
    }
    const column = index % xs.length;
    const neighbors = [
      column > 0 ? index - 1 : -1, column + 1 < xs.length ? index + 1 : -1,
      index - xs.length, index + xs.length
    ];
    for (const next of neighbors) {
      if (next < 0 || next >= xs.length * ys.length || trail.has(next) || !clear(a, point(next))) continue;
      trail.set(next, index);
      queue.push(next);
    }
  }
}

function findRoute(from, to, cards, vertical, back, lane, clearance) {
  const obstacles = cards.map(({ x, y, width, height }) =>
    ({ x: x - clearance, y: y - clearance, width: width + 2 * clearance, height: height + 2 * clearance }));
  const clear = (a, b) => !obstacles.some((box) => segmentHitsBox(a, b, box));
  const forward = vertical ? ['bottom', 'top'] : ['right', 'left'];
  const returnSide = vertical ? 'right' : 'top';
  const preferred = back ? [returnSide, from === to ? forward[1] : returnSide] : forward;
  const sides = Object.keys(portVectors);
  const pairs = [preferred, ...sides.flatMap((a) => sides
    .filter((b) => (from !== to || a !== b) && (a !== preferred[0] || b !== preferred[1]))
    .map((b) => [a, b]))];
  const outside = Math.abs(lane) / 2 + 8;
  const left = Math.min(...obstacles.map((box) => box.x)) - outside;
  const right = Math.max(...obstacles.map((box) => box.x + box.width)) + outside;
  const top = Math.min(...obstacles.map((box) => box.y)) - outside;
  const bottom = Math.max(...obstacles.map((box) => box.y + box.height)) + outside;
  const entrances = [];
  let best;
  let bestScore = Infinity;
  for (const [fromSide, toSide] of pairs) {
    const [a, start] = port(from, fromSide, lane, clearance);
    const [b, end] = port(to, toSide, from === to ? -lane : lane, clearance);
    if (cards.some((card) => card !== from && segmentHitsBox(a, start, card)) ||
        cards.some((card) => card !== to && segmentHitsBox(end, b, card))) continue;
    const sideCost = (Number(fromSide !== preferred[0]) + Number(toSide !== preferred[1])) * (back ? 18 : 8);
    const minimum = Math.abs(a.x - b.x) + Math.abs(a.y - b.y) + sideCost;
    if (minimum >= bestScore) continue;
    entrances.push({ a, start, end, b, sideCost });
    const viaX = (x) => [start, { x, y: start.y }, { x, y: end.y }, end];
    const viaY = (y) => [start, { x: start.x, y }, { x: end.x, y }, end];
    const [fromX, fromY] = portVectors[fromSide];
    const [toX, toY] = portVectors[toSide];
    const xs = [midpoint(start.x, end.x) + lane, start.x, end.x,
      a.x + fromX * preferredLead, b.x + toX * preferredLead, left, right];
    const ys = [midpoint(start.y, end.y) + lane, start.y, end.y,
      a.y + fromY * preferredLead, b.y + toY * preferredLead, top, bottom];
    const minX = Math.min(start.x, end.x), maxX = Math.max(start.x, end.x);
    const minY = Math.min(start.y, end.y), maxY = Math.max(start.y, end.y);
    for (const card of obstacles) {
      if (minX < card.x + card.width && maxX > card.x) {
        ys.push(card.y, card.y + card.height);
      }
      if (minY < card.y + card.height && maxY > card.y) {
        xs.push(card.x, card.x + card.width);
      }
    }
    for (const route of [...new Set(xs)].map(viaX).concat([...new Set(ys)].map(viaY))) {
      if (!route.every((point, i) => i === 0 || clear(route[i - 1], point))) continue;
      const points = simplifyRoute([a, ...route, b]);
      const score = routeScore(points, sideCost);
      if (score < bestScore) {
        best = points;
        bestScore = score;
      }
    }
  }
  if (best) return best;
  for (const { a, start, end, b } of entrances) {
    const points = gridRoute(start, end, obstacles, clear);
    if (points) return simplifyRoute([a, ...points, b]);
  }
}

function routeScore(points, sideCost) {
  let score = sideCost + (points.length - 2) * 24;
  for (let i = 1; i < points.length; i++) {
    const length = Math.abs(points[i].x - points[i - 1].x) + Math.abs(points[i].y - points[i - 1].y);
    score += length;
    // Tight passages remain usable, but a bend against a card loses to a little extra length.
    if (points.length > 2 && (i === 1 || i === points.length - 1)) {
      score += 4 * Math.max(0, preferredLead - length);
    }
  }
  return score;
}

function routeConnection(from, to, cards, vertical, back, lane = 0) {
  return findRoute(from, to, cards, vertical, back, lane, 12) ??
    findRoute(from, to, cards, vertical, back, lane, 2);
}

function roundedPath(points, cards) {
  let path = 'M' + points[0].x + ',' + points[0].y;
  for (let i = 1; i < points.length; i++) {
    const p = points[i];
    const next = points[i + 1];
    if (!next) return path + ' L' + p.x + ',' + p.y;
    const previous = points[i - 1];
    let radius = Math.min(cornerRadius, Math.hypot(p.x - previous.x, p.y - previous.y) / 2,
      Math.hypot(next.x - p.x, next.y - p.y) / 2);
    // The quadratic stays within 1/4 of its radius from at least one leg of the corner.
    // Reduce the radius where a tight route leaves less clearance than that.
    const legs = [previous, next].map(({ x, y }) => [Math.sign(x - p.x), Math.sign(y - p.y)]);
    const [dx, dy] = [legs[0][0] + legs[1][0], legs[0][1] + legs[1][1]];
    if (dx && dy) {
      for (const card of cards) {
        const nearX = dx > 0 ? card.x - p.x : p.x - card.x - card.width;
        const nearY = dy > 0 ? card.y - p.y : p.y - card.y - card.height;
        if (nearX >= radius || nearY >= radius || nearX + card.width <= 0 || nearY + card.height <= 0) continue;
        radius = Math.min(radius, Math.max(nearX, nearY, 4 * Math.min(nearX, nearY), 0));
      }
    }
    const round = (neighbor) => (p.x + Math.sign(neighbor.x - p.x) * radius) + ',' +
      (p.y + Math.sign(neighbor.y - p.y) * radius);
    path += ' L' + round(previous) + ' Q' + p.x + ',' + p.y + ' ' + round(next);
  }
  return path;
}

function placeConnectionLabel(points, width, height, cards, occupied, bounds, vertical, separate = false,
  routes = [points]) {
  const candidates = [];
  for (let i = 1; i < points.length; i++) {
    const [a, b] = points.slice(i - 1, i + 1);
    const horizontal = a.y === b.y;
    const length = Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
    if (length < 8) continue;
    for (const fraction of [.5, .35, .65, .2, .8]) {
      for (const side of [-1, 1]) {
        const left = a.x + (b.x - a.x) * fraction + (horizontal ? -width / 2 : side > 0 ? 7 : -width - 7);
        const x = separate && vertical
          ? Math.max(bounds.x, Math.min(left, bounds.x + bounds.width - width)) : left;
        const y = a.y + (b.y - a.y) * fraction + (horizontal ? side > 0 ? 5 : -height - 5 : -height / 2);
        const label = { x, y, width, height };
        const collisions = cards.filter((card) => overlaps(card, label)).length * 10000 +
          occupied.filter((other) => overlaps(other, label)).length * 1000;
        const crossesLine = routes.some((route) => route.some((point, j) =>
          j > 0 && segmentHitsBox(route[j - 1], point, label)));
        const overflow = vertical ? Math.max(0, bounds.x - x, x + width - bounds.x - bounds.width) : 0;
        candidates.push({ ...label, collisions, score: Math.min(length, 240) - collisions -
          (crossesLine ? 250 : 0) - overflow * 100 });
      }
    }
  }
  candidates.sort((a, b) => b.score - a.score);
  const fallback = candidates[0] ?? { x: points[0].x, y: points[0].y, width, height };
  if (!separate) return fallback;
  const clear = candidates.find(({ collisions }) => collisions === 0);
  if (clear) return clear;
  // Choose the nearest free slot above or below the preferred point if the route has no space.
  const obstacles = [...cards, ...occupied].filter(({ x, width }) =>
    x < fallback.x + fallback.width && x + width > fallback.x);
  const stops = obstacles.flatMap((box) => [box.y - height, box.y + box.height]);
  stops.sort((a, b) => Math.abs(a - fallback.y) - Math.abs(b - fallback.y));
  return { ...fallback, y: stops.find((y) => obstacles.every((box) => !overlaps({ ...fallback, y }, box))) ??
    fallback.y };
}


const backtick = String.fromCharCode(96);
const referencePattern = /^[a-z0-9][a-z0-9._-]{0,63}(#[a-z0-9][a-z0-9._-]{0,63})?$/;

function parseInline(text) {
  function read(start, end, close = '', links = true, depth = 0) {
    const nodes = [];
    let plain = start;
    let i = start;
    const flush = () => {
      if (i > plain) nodes.push({ kind: 'text', value: text.slice(plain, i) });
    };
    while (i < end) {
      if (close && text.startsWith(close, i)) {
        flush();
        return { nodes, next: i + close.length };
      }
      let node;
      let next;
      if (text[i] === backtick) {
        const stop = text.indexOf(backtick, i + 1);
        if (stop > i + 1 && stop < end) {
          node = { kind: 'code', value: text.slice(i + 1, stop) };
          next = stop + 1;
        }
      } else if (depth < 24 && text.startsWith('**', i) && !close && text.indexOf('**', i + 2) < end) {
        const inner = text.indexOf('**', i + 2) < 0 ? null : read(i + 2, end, '**', links, depth + 1);
        if (inner?.nodes.length) {
          node = { kind: 'strong', children: inner.nodes };
          next = inner.next;
        }
      } else if (depth < 24 && links && text.startsWith('[[', i)) {
        const stop = text.indexOf(']]', i + 2);
        const separator = text.indexOf('|', i + 2);
        const hasLabel = separator >= 0 && separator < stop;
        const target = text.slice(i + 2, hasLabel ? separator : stop);
        if (stop >= 0 && stop + 2 <= end && referencePattern.test(target)) {
          node = { kind: 'reference', target };
          if (hasLabel) node.children = read(separator + 1, stop, '', false, depth + 1).nodes;
          next = stop + 2;
        }
      }
      if (node) {
        flush();
        nodes.push(node);
        i = plain = next;
      } else i++;
    }
    flush();
    return close ? null : { nodes };
  }
  return read(0, text.length).nodes;
}


function searchText(value) {
  if (typeof value === 'string') return value;
  if (value && typeof value === 'object') return Object.values(value).map(searchText).join(' ');
  return '';
}

const normalizeSearch = (value) => value.normalize('NFKC').toLowerCase();

function buildSearchIndex(index, evidence = {}) {
  return [...index.objects.values()].map((object) => {
    const path = index.pathTo(object.id).map(({ id, title }) => ({ id, title }));
    const fields = [object.id, object.title, object.summary, searchText([
      object.body, object.notes, object.sources, object.implementation, object.verification,
      Object.hasOwn(evidence, object.id) ? evidence[object.id] : []
    ])].map(normalizeSearch);
    return { object, path, fields };
  });
}

function searchDesign(entries, query) {
  const term = normalizeSearch(query.trim());
  if (!term) return [];
  const words = term.split(/\s+/);
  return entries.flatMap(({ object, path, fields }) => {
    const position = fields.findIndex((field) => field.includes(term));
    if (position < 0 && !words.every((word) => fields.some((field) => field.includes(word)))) return [];
    const exact = fields.slice(0, 2).includes(term);
    return [{ object, path, rank: exact ? -1 : position < 0 ? fields.length : position }];
  }).sort((a, b) => a.rank - b.rank || (a.object.id < b.object.id ? -1 : Number(a.object.id > b.object.id)));
}



const inventoryTypes = ['rule', 'acceptance', 'decision', 'entity', 'interface', 'screen'];

function inventoryRows(index, evidence, filters = {}) {
  const tables = Object.fromEntries(inventoryTypes.map((type) => [type, []]));
  for (const object of [...index.objects.values()].sort(compareObjects)) {
    if (!Object.hasOwn(tables, object.type)) continue;
    const module = index.pathTo(object.id).slice(0, -1).findLast((ancestor) => ancestor.type === 'module');
    const implementation = implementationState(object, evidence);
    if (filters.status && filters.status !== object.status ||
        filters.implementation && filters.implementation !== implementation ||
        filters.module && filters.module !== (module?.id ?? '@root')) continue;
    tables[object.type].push({ object, module, implementation });
  }
  return tables;
}

}

function addressHash(mode, address) {
  return '#/' + mode + '/' + encodeURIComponent(address).replace(/%23/g, '#');
}

function objectLink(ctx, address, label, className = 'object-link', locate = false) {
  const link = make('a', className, label ?? ctx.index.get(address)?.title ?? address);
  link.setAttribute('href', addressHash(ctx.modeFor(address), address));
  link.addEventListener('click', (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey || event.shiftKey) return;
    event.preventDefault();
    ctx.jump(address, locate);
  });
  return link;
}

function rich(element, value, ctx) {
  function nodes(tokens) {
    return tokens.map((token) => {
      if (token.kind === 'text') return textNode(token.value);
      if (token.kind === 'code') return make('code', '', token.value);
      const child = token.kind === 'strong' ? make('strong') :
        objectLink(ctx, token.target, undefined, 'object-link inline-reference');
      if (token.children) child.replaceChildren(...nodes(token.children));
      return child;
    });
  }
  element.append(...nodes(parseInline(value)));
  return element;
}

}

function sourceStatus(ctx, id, of, path, occurrence) {
  const entries = Object.hasOwn(ctx.evidence, id) ? ctx.evidence[id] : [];
  return entries.filter((item) => item.of === of && item.path === path)[occurrence]?.state ?? 'unrecorded';

function editorLink(ctx, path) {
  if (!['vscode', 'cursor'].includes(ctx.editor) || !ctx.projectRoot) return null;
  if (/^(?:[\\/]|[a-z]:)/i.test(path) || path.includes('\0')) return null;
  const relative = [];
  for (const part of path.split(/[\\/]/)) {
    if (!part || part === '.') continue;
    if (part !== '..') relative.push(part);
    else if (relative.length) relative.pop();
    else return null;
  }
  if (!relative.length) return null;
  const normalizedRoot = ctx.projectRoot.replaceAll('\\', '/').replace(/\/$/, '');
  const chunks = [...normalizedRoot.split('/'), ...relative].map(encodeURIComponent);
  if (/^[a-z]:$/i.test(normalizedRoot.slice(0, 2))) chunks[0] = normalizedRoot.slice(0, 2);
  return ctx.editor + '://file/' + chunks.join('/').replace(/^\//, '');
}

async function copySource(path) {
  try {
    await navigator.clipboard.writeText(path);
  } catch {
    const area = make('textarea', 'sr-only');
    const focus = document.activeElement;
    area.value = path;
    document.body.append(area);
    area.select();
    const copied = document.execCommand('copy');
    area.remove();
    focus?.focus();
    if (!copied) {
      announce('复制失败');
      return;
    }
  }
  announce('已复制路径');
}

function evidenceEntries(ctx, object, items, of) {
  const occurrences = new Map();
  return items.map((item) => {
    const path = item.path ?? item.ref;
    const isFile = Boolean(item.path) || item.kind === 'file';
    const occurrence = occurrences.get(path) ?? 0;
    if (isFile) occurrences.set(path, occurrence + 1);
    const state = isFile ? sourceStatus(ctx, object.id, of, path, occurrence) : 'unrecorded';
    return { path, isFile, state, symbols: item.symbol ? [item.symbol] : [] };
  });
}
