<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>ArkiGo · 架构画布</title><script>(()=>{try{const theme=localStorage.getItem("arkigo-theme");if(theme==="light"||theme==="dark")document.documentElement.dataset.theme=theme;}catch{}})();</script><style>:root{color-scheme:light;--header-height:56px;--bg:#f6f7f9;--paper:#fff;--ink:#202630;--muted:#687583;--line:#e1e6eb;--soft:#eef2f5;--accent:#176c60;--accentsoft:#eaf5f1;--blue:#416aaa;--orange:#966128;--purple:#7861a3;--edge:#94a6b7;--dot:#d9dfe6;--ring:#176c6033;--module-surface:#b7d9cf;--shadow:0 2px 5px #22334406,0 12px 32px #2233440c;--ease-out:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:var(--bg);color:var(--ink);font:14px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.4;cursor:default}[hidden]{display:none!important}h1,h2,h3,p{margin:0}button{border:0}a{color:var(--accent)}
/* One compact toolbar; the canvas owns the remaining height. */
.header{position:absolute;inset:0 0 auto;height:var(--header-height);padding:0 20px;display:flex;align-items:center;gap:20px;background:var(--paper);border-bottom:1px solid var(--line);z-index:12}
.header-actions{display:flex;align-items:center;gap:3px;flex-shrink:0}.btn{background:transparent;padding:8px 12px;border-radius:7px;min-height:34px;font-size:12px;white-space:nowrap}.btn.outline{border:1px solid var(--line);background:var(--paper)}.btn.primary,.btn.active{background:var(--accentsoft);color:var(--accent)}.btn.icon{width:34px;padding:0;font-size:18px}
.header-actions .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 9px}.header-actions svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.breadcrumbs{display:flex;align-items:center;flex:1;min-width:0;height:48px;gap:9px;overflow-x:auto;scrollbar-width:none}.breadcrumbs::-webkit-scrollbar{display:none}.crumb{display:block;max-width:280px;min-width:0;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:transparent;color:var(--muted);font-size:12px;padding:6px 2px;border-radius:4px}.crumb.current{font-size:14px;font-weight:600;color:var(--ink);flex-shrink:0}.crumb-separator{color:var(--edge);font-size:11px;flex-shrink:0}.breadcrumbs button:focus-visible{outline-offset:-1px}
.module-actions{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:6px;max-width:calc(100vw - 24px);padding:6px;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}#module-name{font-size:12px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:170px;min-width:0;padding:0 8px}.module-actions .btn{flex-shrink:0}.module-selected .canvas-notes{display:none}.scene-ghost{z-index:1;pointer-events:none!important;will-change:transform,opacity}

.viewport{position:absolute;inset:var(--header-height) 0 0;overflow:hidden;touch-action:none;cursor:grab;background-image:radial-gradient(var(--dot) .85px,transparent .85px);background-size:18px 18px}.viewport:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--ring)}.viewport.panning{cursor:grabbing}.world{position:absolute;left:0;top:0;transform-origin:0 0}.canvas-title{position:absolute;left:60px;top:23px;right:36px;pointer-events:none}.canvas-title h2{font-size:25px;font-weight:550;line-height:1.5;letter-spacing:-.6px}.canvas-title p{font-size:13px;color:var(--muted);margin-top:4px;max-width:1100px}.zone{position:absolute;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--paper) 44%,transparent);pointer-events:none}.zone-label{position:absolute;top:12px;left:18px;font-size:11px;color:var(--muted);letter-spacing:.5px;max-width:calc(100% - 36px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}.edge{fill:none;stroke:var(--edge);stroke-width:1.5;marker-end:url(#arrow)}.edge[data-style=support]{stroke-dasharray:3 5;stroke-width:1.2}.edge[data-style=feedback]{stroke:var(--accent);stroke-dasharray:5 5}.edge.related{stroke:var(--accent);stroke-width:2}.edge.fallback{stroke:var(--orange);stroke-dasharray:3 5}.edge-label{font-size:11px;fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:7px;stroke-linejoin:round}.edge-label.related{fill:var(--accent)}
.node{display:flex;flex-direction:column;position:absolute;width:260px;height:154px;padding:15px 17px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);text-align:left;touch-action:none;cursor:grab;user-select:none;box-shadow:0 2px 5px #25344504;transition:border-color 120ms ease,box-shadow 120ms ease}.node.selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}.node.related-node:not(.selected){border-color:var(--edge)}.node[data-status=retired]{opacity:.65}.node[data-kind=问题],.node[data-kind=question]{border-style:dashed}.node.dragging{cursor:grabbing;z-index:8;will-change:transform}.node-kicker{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;margin-bottom:8px}.node-kicker span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.node-kicker i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px}.node[data-origin=ai] .node-kicker i{background:var(--purple)}.node[data-origin=code] .node-kicker i{background:var(--blue)}.node-kicker small{font:10px ui-monospace,monospace}.node h3{font-size:17px;font-weight:600;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}.node p{font-size:12px;line-height:1.65;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}.node-footer{font:11px/1.5 ui-monospace,Consolas,monospace;color:var(--accent);display:block;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* A translucent surface and stacked shape distinguish modules without instruction text.
   Only the wash is 30% opaque (70% transparent); titles and summaries stay opaque. */
.node[data-module=true]{isolation:isolate;background:transparent;border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.node[data-module=true]::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:var(--module-surface);opacity:.3;pointer-events:none}
.module-mark{display:inline-block;position:relative;width:18px;height:18px;flex-shrink:0;color:var(--accent);pointer-events:none}
.module-mark::before,.module-mark::after{content:"";position:absolute;width:12px;height:9px;border:1px solid currentColor;border-radius:2px}
.module-mark::before{top:1px;left:5px;opacity:.45}.module-mark::after{top:6px;left:0;background:var(--bg)}
.node>.module-mark{position:absolute;right:17px;bottom:14px}
.canvas-bottom{position:fixed;bottom:18px;left:26px;right:18px;z-index:10;display:flex;justify-content:space-between;align-items:end;gap:12px;pointer-events:none}.canvas-bottom>*{pointer-events:auto}.canvas-notes{max-width:55vw}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:10px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:5px;background:var(--bg)}.legend i{width:17px;border-top:1.5px solid var(--edge)}.legend i.support{border-top-style:dotted}.legend i.feedback{border-top-style:dashed;border-color:var(--accent)}.hint,.storage-state{font-size:10px;color:var(--muted);margin-top:5px;background:var(--bg);width:fit-content}.storage-state:empty{display:none}.camera-controls{margin-left:auto;display:flex;align-items:center;gap:1px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:4px;box-shadow:var(--shadow)}#zoom-value{font:11px ui-monospace,monospace;font-variant-numeric:tabular-nums;color:var(--muted);min-width:42px;text-align:center}.separator{height:18px;width:1px;background:var(--line);margin:0 4px}
.panel{position:fixed;z-index:20;top:calc(var(--header-height) + 12px);right:18px;width:370px;max-width:calc(100vw - 36px);max-height:calc(100dvh - var(--header-height) - 98px);display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:0;box-shadow:var(--shadow)}.panel-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panel h2{font-size:21px;font-weight:600;line-height:1.5}.tag{font-size:10px;color:var(--accent);background:var(--accentsoft);padding:3px 7px;border-radius:4px}.plain{font-size:14px;line-height:1.85;max-width:65ch;margin-top:12px;overflow-wrap:anywhere}.detail-block{margin-top:20px}.detail-block h3{font-size:11px;letter-spacing:.4px;color:var(--muted);font-weight:500;margin-bottom:7px}.detail-block p,.detail-block li{font-size:12px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.detail-block ul{padding-left:17px;margin:0}.source{font:11px/1.8 ui-monospace,Consolas,monospace;display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px;user-select:text}.notice{border-top:1px solid var(--line);padding-top:15px;margin-top:20px;font-size:11px;color:var(--muted);line-height:1.9;overflow-wrap:anywhere}.detail-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.relation-button{display:block;width:100%;padding:9px 0;text-align:left;background:none;border-bottom:1px solid var(--line);font-size:12px;line-height:1.7}.relation-button small{display:block;color:var(--muted)}.directory{left:18px;right:auto;width:310px}.directory h2{font-size:17px}.search{width:100%;border:1px solid var(--line);background:var(--bg);padding:9px 11px;border-radius:7px;font-size:12px;margin-bottom:12px}.directory-list{display:grid;gap:3px}.directory-list button{text-align:left;background:transparent;padding:10px 8px;border-radius:7px;display:flex;gap:10px;align-items:center}.directory-list small{font:10px ui-monospace,monospace;color:var(--muted)}.directory-list span{font-size:12px;overflow-wrap:anywhere}.empty{text-align:center;padding:26px 10px;font-size:12px;color:var(--muted)}.empty strong{font-size:14px;color:var(--ink)}.empty p{margin:8px 0 14px}
.load-state{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);max-width:420px;width:80%;text-align:center;color:var(--muted);font-size:13px}.load-state strong{display:block;color:var(--ink);font-size:18px;font-weight:500;margin-bottom:10px}.fatal .world{display:none}.noscript{position:fixed;top:calc(var(--header-height) + 20px);left:20px;z-index:30;background:var(--paper);padding:20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* Emil design engineering: clear surfaces, immediate graph controls, restrained feedback. */
.viewport.panning .world{will-change:transform}
.viewport.level-transition .world{will-change:transform,opacity}
.panel-head{padding:18px 20px 15px;border-bottom:1px solid var(--line);flex-shrink:0}
.panel-head .panel-top{margin-bottom:8px}.panel-head .btn.icon{flex-shrink:0;margin:-4px -5px -4px 0}
.panel-head h2{letter-spacing:-.02em;overflow-wrap:anywhere}.panel-head .tag{line-height:1.6}
.panel-body{padding:0 20px 20px;min-height:0;overflow:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin}
.panel-body:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.directory .panel-body{padding-top:10px}.panel-head .search{margin-bottom:0}
.panel-note{font-size:11px;color:var(--muted);line-height:1.7}.panel-head .panel-note{margin-bottom:10px}
.panel-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--line);flex-shrink:0}
.count{display:inline-block;font:11px/1.6 ui-monospace,monospace;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--muted);vertical-align:middle;margin-left:5px}
/* Compact directory: one search surface, flat names, quiet secondary export. */
.directory{width:288px;border-radius:10px}
.directory .panel-head{padding:12px 14px;border-bottom:0}
.directory .panel-top{margin-bottom:9px;min-height:30px}
.directory h2{font-size:13px;font-weight:600;letter-spacing:0}
.directory .count{font-size:11px;font-weight:400;padding:0;margin-left:6px;background:none;color:var(--muted)}
.directory .panel-head .btn.icon{margin:0;width:30px;min-height:30px;font-size:18px;color:var(--muted)}
.directory-search{position:relative}
.directory-search>svg{position:absolute;width:14px;height:14px;left:10px;top:50%;transform:translateY(-50%);stroke:var(--muted);stroke-width:1.6;fill:none;stroke-linecap:round;pointer-events:none}
.directory .search{display:block;margin:0;padding:8px 10px 8px 32px;border:1px solid transparent;background:var(--soft);border-radius:6px;font-size:12px;min-height:36px;outline-offset:1px}
.directory .search:focus-visible{outline:2px solid var(--ring);border-color:var(--edge)}
.directory .panel-body{padding:0 8px 8px}
.directory-list{gap:1px}
.directory-list button{padding:8px 9px;min-height:36px;gap:10px;border-radius:5px}
.directory-list .directory-name{flex:1;min-width:0;font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.directory-list .current{background:var(--accentsoft);color:var(--accent)}
.directory-list .module-mark{width:18px;height:18px;opacity:.7}
.directory .panel-foot{padding:7px 12px;justify-content:flex-end}
.directory .panel-foot .btn{padding:5px 7px;min-height:30px;font-size:11px;color:var(--muted)}
.directory .empty{padding:24px 8px}.directory .empty strong{font-size:12px;font-weight:500}.directory .empty p{font-size:11px}
.btn,.breadcrumbs button,.directory-list button,.relation-button{transition:transform 120ms var(--ease-out),background-color 100ms ease,color 100ms ease}
/* Header icons and their hover surface follow the palette immediately. */
.header-actions .btn{transition:transform 120ms var(--ease-out)}
:root[data-input=pointer] :is(.btn,.breadcrumbs button,.directory-list button,.relation-button):active:not(:disabled){transform:scale(.97)}
@media(hover:hover) and (pointer:fine){.btn:hover,.directory-list button:hover,.relation-button:hover{background:var(--soft)}.node:not(.selected):hover{border-color:var(--edge);box-shadow:0 2px 8px #2233440c}}
.panel,.feedback-toast{opacity:1;transform:translateY(0);transition:opacity 180ms var(--ease-out),transform 180ms var(--ease-out)}
.panel{transform-origin:top right}.directory{transform-origin:top left}
.feedback-toast{position:fixed;bottom:88px;right:18px;z-index:30;display:flex;align-items:center;gap:9px;max-width:min(390px,calc(100vw - 36px));padding:12px 15px;border:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:var(--shadow);font-size:12px;line-height:1.7;pointer-events:none}
.feedback-symbol{display:grid;place-items:center;flex-shrink:0;width:19px;height:19px;border-radius:50%;color:var(--accent);background:var(--accentsoft);font:600 12px/1 ui-sans-serif,system-ui}
.feedback-toast[data-tone=notice] .feedback-symbol{color:var(--orange);background:var(--soft)}
.feedback-toast[data-immediate=true]{transition:none}
@starting-style{:root[data-input=pointer] .panel:not([hidden]){opacity:0;transform:translateY(6px)}:root[data-input=pointer] .feedback-toast:not([hidden]):not([data-immediate=true]){opacity:0;transform:translateY(4px)}}
:root[data-input=keyboard] :is(.btn,.node,.breadcrumbs button,.directory-list button,.relation-button,.panel,.feedback-toast){transition:none!important;animation:none!important}

:root[data-theme=dark]{color-scheme:dark;--bg:#15191f;--paper:#1c2128;--ink:#e0e5eb;--muted:#a0adba;--line:#303740;--soft:#252c35;--accent:#7bc7b1;--accentsoft:#243932;--blue:#9bbcf0;--orange:#d2ac7f;--purple:#c2ace5;--edge:#72869a;--dot:#333d48;--ring:#7bc7b12e;--module-surface:#3d6a5d;--shadow:0 8px 30px #0003}
.theme-sun{display:none!important}:root[data-theme=dark] .theme-moon{display:none}:root[data-theme=dark] .theme-sun{display:block!important}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#15191f;--paper:#1c2128;--ink:#e0e5eb;--muted:#a0adba;--line:#303740;--soft:#252c35;--accent:#7bc7b1;--accentsoft:#243932;--blue:#9bbcf0;--orange:#d2ac7f;--purple:#c2ace5;--edge:#72869a;--dot:#333d48;--ring:#7bc7b12e;--module-surface:#3d6a5d;--shadow:0 8px 30px #0003}:root:not([data-theme=light]) .theme-moon{display:none}:root:not([data-theme=light]) .theme-sun{display:block!important}}

@media(max-width:1000px){.module-actions{bottom:82px}}
@media(max-width:760px){.header{padding:0 12px;gap:6px}.breadcrumbs{gap:6px}.crumb{max-width:150px}.crumb.current{font-size:12px;max-width:220px}.header-actions{gap:0}.header-actions .btn{width:36px;padding:0}.canvas-bottom{bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;justify-content:flex-end}.canvas-notes{display:none}.camera-controls .btn{font-size:11px;padding:7px 8px}.camera-controls .icon{font-size:17px}.panel{right:12px;max-width:calc(100vw - 24px)}.directory{left:12px;right:auto}.plain{font-size:14px}.directory .search{font-size:16px;min-height:44px}.feedback-toast{left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));max-width:none}.module-actions{bottom:calc(80px + env(safe-area-inset-bottom));width:calc(100vw - 24px)}#module-name{flex:1;max-width:none}}
@media(max-width:390px){.camera-controls .btn{padding:7px 6px}.camera-controls .separator{margin:0 2px}.camera-controls .icon{width:28px}}
@media(pointer:coarse){.header-actions .btn{min-width:44px}.btn{min-height:44px}.btn.icon{min-width:44px}.directory-list button{min-height:44px}.directory .panel-head .btn.icon{min-width:44px;min-height:44px}.directory .panel-foot .btn{min-height:44px}.breadcrumbs button{min-height:44px}}
@media(prefers-reduced-motion:reduce){.panel,.feedback-toast{transform:none!important;transition:opacity 80ms linear}.btn,.breadcrumbs button,.directory-list button,.relation-button{transform:none!important;transition:background-color 80ms ease,color 80ms ease}.node{transition:border-color 80ms ease}}
</style></head>
<body>
<header class="header"><h1 id="document-title" class="sr-only">架构画布</h1><nav id="breadcrumbs" class="breadcrumbs" aria-label="模块路径"></nav><div class="header-actions"><button class="btn icon" id="directory-open" aria-label="搜索节点" title="搜索节点" aria-expanded="false" aria-controls="directory"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button><button class="btn icon" id="theme-toggle" aria-label="切换到深色" title="切换到深色"><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.4A8.7 8.7 0 0 1 9.6 3.6a8.7 8.7 0 1 0 10.8 10.8Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button></div></header>
<main><div id="viewport" class="viewport" tabindex="0" aria-label="架构画布。拖动空白平移，滚轮缩放，拖动节点调整位置。方向键平移，加减号缩放，零适应画布。选中模块后放大或按回车进入，缩小或按 Alt 加左方向键返回上层。"><div class="load-state" id="load-state" role="status"><strong id="load-title">正在展开架构图</strong><p id="load-message">请启用 JavaScript；所有资源均已包含在此文件中。</p></div><div id="world" class="world"><div class="canvas-title"><h2 id="view-title"></h2><p id="view-subtitle"></p></div><div id="zones"></div><svg id="edges" class="edges" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><g id="edge-paths"></g><g id="edge-labels"></g></svg><div id="nodes"></div></div></div></main>

<script>const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const widthOf = (node) => node.width ?? 260;
const heightOf = (node) => node.height ?? 154;

function boundsOf(view) {
  const boxes = [...view.nodes.map((n) => ({ ...n, width: widthOf(n), height: heightOf(n) })), ...view.zones];
  const left = Math.min(0, ...boxes.map((b) => b.x - 32));
  const top = Math.min(0, ...boxes.map((b) => b.y - 32));
  return { x: left, y: top, width: Math.max(700, ...boxes.map((b) => b.x + b.width + 36)) - left,
    height: Math.max(430, ...boxes.map((b) => b.y + b.height + 36)) - top };
}

function fitCamera(bounds, width, height, padding = 38) {
  const k = clamp(Math.min((width - padding * 2) / bounds.width, (height - padding * 2) / bounds.height, 1), 0.08, 2.5);
  return { k, x: (width - bounds.width * k) / 2 - bounds.x * k, y: (height - bounds.height * k) / 2 - bounds.y * k };
}

function zoomCamera(camera, factor, point, { min = 0.08, max = 2.5 } = {}) {
  const k = clamp(camera.k * factor, min, max), ratio = k / camera.k;
  return { k, x: point.x - (point.x - camera.x) * ratio, y: point.y - (point.y - camera.y) * ratio };
}

function segmentHitsBox(a, b, box) {
  const left = box.x, right = box.x + box.width, top = box.y, bottom = box.y + box.height;
  if (a.x === b.x) return a.x > left && a.x < right && Math.max(a.y, b.y) > top && Math.min(a.y, b.y) < bottom;
  if (a.y === b.y) return a.y > top && a.y < bottom && Math.max(a.x, b.x) > left && Math.min(a.x, b.x) < right;
  return true;
}

function simplify(points) {
  const output = [];
  for (const p of points) {
    if (output.length && p.x === output.at(-1).x && p.y === output.at(-1).y) continue;
    while (output.length > 1) {
      const a = output.at(-2), b = output.at(-1);
      if ((a.x === b.x && b.x === p.x) || (a.y === b.y && b.y === p.y)) output.pop(); else break;
    }
    output.push(p);
  }
  return output;
}

function endpoint(node, side) {
  const w = widthOf(node), h = heightOf(node);
  return side === 'left' ? { x: node.x, y: node.y + h / 2 } : side === 'right' ? { x: node.x + w, y: node.y + h / 2 }
    : side === 'top' ? { x: node.x + w / 2, y: node.y } : { x: node.x + w / 2, y: node.y + h };
}

// Orthogonal A* on obstacle boundary coordinates; edge endpoints are authored or inferred.
function routeEdge(edge, nodes) {
  const from = nodes.find((n) => n.id === edge.from), to = nodes.find((n) => n.id === edge.to);
  if (!from || !to) throw new Error('Missing edge endpoint');
  const dx = to.x + widthOf(to) / 2 - from.x - widthOf(from) / 2;
  const dy = to.y + heightOf(to) / 2 - from.y - heightOf(from) / 2;
  let fromSide = edge.fromSide, toSide = edge.toSide;
  if (from === to) { fromSide ??= 'right'; toSide ??= 'bottom'; }
  else if (Math.abs(dx) >= Math.abs(dy)) { fromSide ??= dx >= 0 ? 'right' : 'left'; toSide ??= dx >= 0 ? 'left' : 'right'; }
  else { fromSide ??= dy >= 0 ? 'bottom' : 'top'; toSide ??= dy >= 0 ? 'top' : 'bottom'; }
  const vectors = { left: [-1,0], right: [1,0], top: [0,-1], bottom: [0,1] };
  const a = endpoint(from, fromSide), b = endpoint(to, toSide), av = vectors[fromSide], bv = vectors[toSide];
  const start = { x: a.x + av[0] * 26, y: a.y + av[1] * 26 };
  const end = { x: b.x + bv[0] * 26, y: b.y + bv[1] * 26 };
  const boxes = nodes.map((n) => ({ x: n.x - 10, y: n.y - 10, width: widthOf(n) + 20, height: heightOf(n) + 20 }));
  const xs = [...new Set([start.x, end.x, ...boxes.flatMap((r) => [r.x - 16, r.x + r.width + 16])])].sort((x,y) => x-y);
  const ys = [...new Set([start.y, end.y, ...boxes.flatMap((r) => [r.y - 16, r.y + r.height + 16])])].sort((x,y) => x-y);
  const sx = xs.indexOf(start.x), sy = ys.indexOf(start.y), ex = xs.indexOf(end.x), ey = ys.indexOf(end.y);
  const heap = [], costs = new Map(), parents = new Map();
  const key = (x,y,d) => `${x},${y},${d}`;
  const push = (v) => { heap.push(v); let i = heap.length-1; while (i) { const p=(i-1)>>1; if(heap[p].f<=v.f)break;heap[i]=heap[p];i=p; } heap[i]=v; };
  const pop = () => { const top=heap[0],last=heap.pop();if(heap.length){let i=0;while(i*2+1<heap.length){let j=i*2+1;if(j+1<heap.length&&heap[j+1].f<heap[j].f)j++;if(last.f<=heap[j].f)break;heap[i]=heap[j];i=j;}heap[i]=last;}return top; };
  const first = key(sx,sy,av[0]?0:1); costs.set(first,0);push({x:sx,y:sy,d:av[0]?0:1,k:first,g:0,f:0});let goal;
  while(heap.length) {
    const current=pop();if(current.g!==costs.get(current.k))continue;
    if(current.x===ex&&current.y===ey){goal=current.k;break;}
    for(const [mx,my] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx=current.x+mx,ny=current.y+my;if(nx<0||ny<0||nx>=xs.length||ny>=ys.length)continue;
      const p={x:xs[current.x],y:ys[current.y]},q={x:xs[nx],y:ys[ny]};
      if(boxes.some((box)=>segmentHitsBox(p,q,box)))continue;
      const d=mx?0:1,g=current.g+Math.abs(q.x-p.x)+Math.abs(q.y-p.y)+(current.d===d?0:28),k=key(nx,ny,d);
      if(g>=(costs.get(k)??Infinity))continue;costs.set(k,g);parents.set(k,current.k);
      push({x:nx,y:ny,d,k,g,f:g+Math.abs(q.x-end.x)+Math.abs(q.y-end.y)});
    }
  }
  if(!goal) {
    // Overlapping dragged nodes may trap a port. Keep a continuous orthogonal line, flagged for the UI.
    return { points: simplify([a,start,{x:start.x,y:end.y},end,b]), fallback: true };
  }
  const middle=[];for(let k=goal;k;k=parents.get(k)){const [x,y]=k.split(',').map(Number);middle.unshift({x:xs[x],y:ys[y]});}
  return { points: simplify([a,...middle,b]), fallback: false };
}

function roundedPath(points) {
  let path = `M${points[0].x},${points[0].y}`;
  for(let i=1;i<points.length;i++) {
    const p=points[i];if(i===points.length-1){path+=` L${p.x},${p.y}`;continue;}
    const a=points[i-1],b=points[i+1],r=Math.min(10,Math.hypot(p.x-a.x,p.y-a.y)/2,Math.hypot(b.x-p.x,b.y-p.y)/2);
    path+=` L${p.x+Math.sign(a.x-p.x)*r},${p.y+Math.sign(a.y-p.y)*r} Q${p.x},${p.y} ${p.x+Math.sign(b.x-p.x)*r},${p.y+Math.sign(b.y-p.y)*r}`;
  }
  return path;
}

function placeLabel(points, width, height, nodes, occupied=[]) {
  const candidates=[];
  for(let i=1;i<points.length;i++) {
    const a=points[i-1],b=points[i],horizontal=a.y===b.y,length=Math.abs(a.x-b.x)+Math.abs(a.y-b.y);
    if(length<24)continue;
    for(const fraction of [.5,.25,.75]) {
      const x=a.x+(b.x-a.x)*fraction-(horizontal?width/2:-10);
      const y=a.y+(b.y-a.y)*fraction-(horizontal?height+7:height/2);
      const box={x,y,width,height};
      const hit=(r)=>x<r.x+r.width+8&&x+width+8>r.x&&y<r.y+r.height+5&&y+height+5>r.y;
      const collisions=nodes.map((n)=>({...n,width:widthOf(n),height:heightOf(n)})).filter(hit).length*2+occupied.filter(hit).length;
      candidates.push({...box,score:length+(horizontal?80:0)-collisions*100000-(fraction===.5?0:8)});
    }
  }
  candidates.sort((a,b)=>b.score-a.score);
  return candidates[0]??{x:points[0].x,y:points[0].y-height-8,width,height};
}

// Hierarchy and screen-space navigation policy shared by validation and the browser.
// No document or DOM mutation: targetViewId remains the only child-view link.
const hierarchyError = (code, path, message, objectId = null) => {
  throw Object.assign(new Error(message), { code, path, objectId });
};

function buildHierarchy(document) {
  const views = new Map(), parents = new Map(), links = new Map();
  for (const [index, view] of document.views.entries()) {
    if (views.has(view.id)) hierarchyError('DUPLICATE_VIEW_ID', `/views/${index}/id`, '视图 ID 重复。', view.id);
    views.set(view.id, view);
    links.set(view.id, []);
  }
  const rootId = document.rootViewId ?? document.views[0]?.id;
  if (!views.has(rootId)) hierarchyError('ROOT_VIEW_MISSING', '/rootViewId', '根视图不存在。', rootId);
  document.views.forEach((view, vi) => view.nodes.forEach((node, ni) => {
    const child = node.targetViewId;
    if (!child) return;
    const path = `/views/${vi}/nodes/${ni}/targetViewId`;
    if (!views.has(child)) hierarchyError('TARGET_VIEW_MISSING', path, '目标视图不存在。', node.id);
    if (child === view.id) hierarchyError('VIEW_SELF_LINK', path, '模块不能指向当前视图。', node.id);
    if (parents.has(child)) hierarchyError('VIEW_MULTIPLE_PARENTS', path, '子视图只能属于一个模块节点。', node.id);
    parents.set(child, { viewId: view.id, nodeId: node.id });
    links.get(view.id).push({ child, path, nodeId: node.id });
  }));
  // Check every component, including unreachable cycles, without recursive depth limits.
  const complete = new Set();
  for (const viewId of views.keys()) {
    const active = new Set();
    let current = viewId;
    while (current && !complete.has(current)) {
      if (active.has(current)) hierarchyError('VIEW_CYCLE', '/views', '视图层级不能包含循环。', current);
      active.add(current);
      current = parents.get(current)?.viewId;
    }
    for (const id of active) complete.add(id);
  }
  if (parents.has(rootId)) hierarchyError('ROOT_VIEW_HAS_PARENT', '/rootViewId', '根视图不能属于其他模块。', rootId);
  const reached = new Set([rootId]), pending = [rootId];
  for (let i = 0; i < pending.length; i++) for (const { child } of links.get(pending[i])) {
    reached.add(child);
    pending.push(child);
  }
  for (const [index, view] of document.views.entries()) {
    if (!reached.has(view.id)) hierarchyError('VIEW_UNREACHABLE', `/views/${index}`, '视图必须可从根视图沿模块层级到达。', view.id);
  }
  return {
    rootId, parents,
    pathTo(viewId) {
      if (!views.has(viewId)) hierarchyError('TARGET_VIEW_MISSING', '/views', '目标视图不存在。', viewId);
      const path = [];
      for (let id = viewId; id;) {
        const parent = parents.get(id);
        path.push(parent ? { viewId: id, viaNodeId: parent.nodeId } : { viewId: id });
        id = parent?.viewId;
      }
      return path.reverse();
    }
  };
}

const SEMANTIC_ZOOM = Object.freeze({ enterOccupancy: .58, minVisibleRatio: .8 });

function moduleProjection(node, camera, viewport) {
  const x = node.x * camera.k + camera.x, y = node.y * camera.k + camera.y;
  const width = (node.width ?? 260) * camera.k, height = (node.height ?? 154) * camera.k;
  const vx = viewport.x ?? 0, vy = viewport.y ?? 0;
  if (![x, y, width, height, vx, vy, viewport.width, viewport.height].every(Number.isFinite)
    || width <= 0 || height <= 0 || viewport.width <= 0 || viewport.height <= 0) {
    return { x, y, width, height, occupancy: 0, visibleRatio: 0, centerVisible: false };
  }
  const visibleWidth = Math.max(0, Math.min(x + width, vx + viewport.width) - Math.max(x, vx));
  const visibleHeight = Math.max(0, Math.min(y + height, vy + viewport.height) - Math.max(y, vy));
  return { x, y, width, height,
    occupancy: Math.max(width / viewport.width, height / viewport.height),
    visibleRatio: visibleWidth * visibleHeight / (width * height),
    centerVisible: x + width / 2 >= vx && x + width / 2 <= vx + viewport.width
      && y + height / 2 >= vy && y + height / 2 <= vy + viewport.height
  };
}

// Call only for the selected module. Runtime owns gesture accumulation and hysteresis.
// Programmatic fit, search, restoration and walkthrough never supply deliberate=true.
function shouldEnterModule(node, camera, viewport, intent = {}) {
  if (!node?.targetViewId || intent.direction !== 'in' || intent.deliberate !== true) return false;
  const projected = moduleProjection(node, camera, viewport);
  return projected.occupancy >= SEMANTIC_ZOOM.enterOccupancy
    && projected.visibleRatio >= SEMANTIC_ZOOM.minVisibleRatio && projected.centerVisible;
}

function fitViewCamera(bounds, viewport, padding = 38) {
  const k = Math.max(.01, Math.min((viewport.width - padding * 2) / bounds.width,
    (viewport.height - padding * 2) / bounds.height, 1));
  return { k, x: (viewport.x ?? 0) + (viewport.width - bounds.width * k) / 2 - bounds.x * k,
    y: (viewport.y ?? 0) + (viewport.height - bounds.height * k) / 2 - bounds.y * k };
}

function frameNodeCamera(node, viewport, occupancy = .62) {
  const width = node.width ?? 260, height = node.height ?? 154;
  const k = Math.min(6, Math.max(.01, occupancy * Math.min(viewport.width / width, viewport.height / height)));
  return { k, x: (viewport.x ?? 0) + viewport.width / 2 - (node.x + width / 2) * k,
    y: (viewport.y ?? 0) + viewport.height / 2 - (node.y + height / 2) * k };
}
