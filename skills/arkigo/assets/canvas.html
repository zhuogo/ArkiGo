<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>ArkiGo · 架构画布</title><script>(()=>{try{const theme=localStorage.getItem("arkigo-theme");if(theme==="light"||theme==="dark")document.documentElement.dataset.theme=theme;}catch{}})();</script><style>/*ARKIGO_STYLE*/</style></head>
<body>
<header class="header"><h1 id="document-title" class="sr-only">架构画布</h1><nav id="breadcrumbs" class="breadcrumbs" aria-label="模块路径"></nav><div class="header-actions"><button class="btn icon" id="directory-open" aria-label="搜索节点" title="搜索节点" aria-expanded="false" aria-controls="directory"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button><button class="btn icon" id="theme-toggle" aria-label="切换到深色" title="切换到深色"><svg class="theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.4A8.7 8.7 0 0 1 9.6 3.6a8.7 8.7 0 1 0 10.8 10.8Z"/></svg><svg class="theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button></div></header>
<main><div id="viewport" class="viewport" tabindex="0" aria-label="架构画布。拖动空白平移，滚轮缩放，拖动节点调整位置。方向键平移，加减号缩放，零适应画布。选中模块后放大或按回车进入，缩小或按 Alt 加左方向键返回上层。"><div class="load-state" id="load-state" role="status"><strong id="load-title">正在展开架构图</strong><p id="load-message">请启用 JavaScript；所有资源均已包含在此文件中。</p></div><div id="world" class="world"><div class="canvas-title"><h2 id="view-title"></h2><p id="view-subtitle"></p></div><div id="zones"></div><svg id="edges" class="edges" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs><g id="edge-paths"></g><g id="edge-labels"></g></svg><div id="nodes"></div></div></div></main>
<div class="canvas-bottom"><div class="canvas-notes"><div id="legend" class="legend"></div><p class="hint" id="hint">拖动空白平移 · 滚轮缩放 · 拖动节点 · 点击查看详情</p><p class="storage-state" id="storage-state"></p></div><div class="camera-controls" aria-label="画布控制"><button class="btn icon" id="zoom-out" aria-label="缩小" title="缩小（−）">−</button><span id="zoom-value">100%</span><button class="btn icon" id="zoom-in" aria-label="放大" title="放大（＋）">＋</button><span class="separator"></span><button class="btn" id="fit" title="适应画布（0）">适应</button><button class="btn" id="actual" title="实际比例">1:1</button><span class="separator"></span><button class="btn" id="reset" title="恢复当前视图的初始位置">重置布局</button></div></div>
<div id="module-actions" class="module-actions" role="group" aria-label="选中模块操作" hidden><span id="module-name"></span><button class="btn" id="inspect-module">详情</button><button class="btn primary" id="enter-module">进入模块 →</button></div>
<aside class="panel detail" id="detail" aria-labelledby="detail-title" hidden><div class="panel-head"><div class="panel-top"><span class="tag" id="detail-tag"></span><button class="btn icon" id="detail-close" aria-label="关闭节点详情" title="关闭（Esc）">×</button></div><h2 id="detail-title"></h2></div><div class="panel-body" id="detail-body" tabindex="0" aria-label="节点说明与来源"><p class="plain" id="detail-summary"></p><div id="detail-actions" class="detail-actions"></div><div id="detail-fields"></div><div class="detail-block"><h3>相关关系</h3><div id="detail-relations"></div></div><div class="detail-block"><h3>来源与定位</h3><div id="detail-sources"></div></div><p class="notice" id="detail-id"></p></div></aside>
<aside class="panel directory" id="directory" aria-labelledby="directory-title" aria-describedby="directory-context scope-note" hidden><div class="panel-head"><div class="panel-top"><h2 id="directory-title">目录 <span id="directory-count" class="count"></span></h2><button class="btn icon" id="directory-close" aria-label="关闭节点目录" title="关闭（Esc）">×</button></div><p id="directory-context" class="sr-only"></p><div class="directory-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg><input id="search" class="search" type="search" placeholder="搜索节点" aria-label="搜索当前视图的节点"></div></div><div class="panel-body" id="directory-body"><div id="directory-list" class="directory-list"></div><div id="search-empty" class="empty" hidden><strong>没有找到节点</strong><p>换个关键词试试。</p><button class="btn" id="search-clear">清空搜索</button></div><p class="sr-only" id="scope-note"></p></div><div class="panel-foot"><button class="btn" id="directory-export">导出布局</button></div></aside>

<div id="feedback" class="feedback-toast" aria-hidden="true" hidden><span id="feedback-symbol" class="feedback-symbol"></span><span id="feedback-message"></span></div><div class="sr-only" id="announcement" aria-live="polite" aria-atomic="true"></div><noscript><p class="noscript">此文件需要 JavaScript 显示交互画布。原始内容保存在对应 JSON 文件中。</p></noscript>
<script id="arkigo-data" type="application/json"><!--ARKIGO_DATA--></script>
<script>/*ARKIGO_RUNTIME*/</script>
</body></html>
