<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' file:">
  <title>ArkiGo</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('arkigo-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
    } catch {}
  </script>
  <style><!--STYLE--></style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span id="brand-icon"></span><strong id="project-name"></strong>
      <button id="rev" class="tool" aria-label="最近变更"></button>
    </div>
    <nav id="readings" aria-label="入口"></nav>
    <div class="tools">
      <button id="search-open" class="tool" aria-haspopup="dialog"><span>查找</span></button>
      <button id="theme" class="tool"></button>
    </div>
  </header>
  <nav id="crumbs" class="location" aria-label="所在路径"></nav>
  <main id="workspace">
    <section id="reading">
      <div class="view-heading">
        <div><h1 id="view-title"></h1><p id="view-summary"></p><div id="view-facts" hidden></div></div>
        <button id="view-detail" class="tool" aria-label="当前对象详情"></button>
      </div>
      <div id="viewport" tabindex="0" aria-label="画布。方向键平移，加减号缩放，零键适应画布">
        <div id="world"></div>
        <div id="view-content" hidden></div>
      </div>
      <footer id="controls">
        <p id="hint" class="muted" hidden></p>
        <div id="selection" hidden>
          <span id="selection-title"></span>
          <button id="inspect" class="tool">详情</button>
          <button id="enter" class="tool primary">进入</button>
        </div>
        <div class="camera-tools" role="group" aria-label="画布控制">
          <button id="zoom-out" class="tool" aria-label="缩小"></button>
          <output id="scale"></output>
          <button id="zoom-in" class="tool" aria-label="放大"></button>
          <span class="divider"></span>
          <button id="fit" class="tool" aria-label="适应画布"></button>
          <button id="reset" class="tool" aria-label="重置当前布局"></button>
          <button id="export" class="tool" aria-label="导出布局"></button>
        </div>
      </footer>
    </section>
    <aside id="detail" aria-labelledby="detail-title" hidden></aside>
  </main>
  <dialog id="browse" aria-labelledby="browse-title">
    <header class="panel-header"><h2 id="browse-title"></h2><button id="browse-close" class="tool"></button></header>
    <div id="browse-body"></div>
  </dialog>
  <div id="live" class="sr-only" aria-live="polite"></div>
  <noscript>需要启用 JavaScript 才能浏览此设计。</noscript>
  <script type="application/json" id="arkigo-data"><!--DATA--></script>
  <script>
    (() => {
      'use strict';
      <!--SCRIPT-->
    })();
  </script>
</body>
</html>
